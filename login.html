<body>

<button onclick="login()">🔐 Login with Google</button>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnx2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.firebasestorage.app",
  messagingSenderId: "690336186269",
  appId: "1:690336186269:web:8215c1d313c4273c1f7974"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

/* SESSION SAVE */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* LOGIN FUNCTION */
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .then((result)=>{
    window.location.href = "index.html";
  })
  .catch((err)=>{
    alert(err.message);
  });
}

/* ❌ AUTO REDIRECT REMOVED (BUG FIX) */

</script>
