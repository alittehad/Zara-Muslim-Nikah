<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  overflow:hidden;
  position:relative;
}

/* BACKGROUND IMAGE */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("https://i.ibb.co/rG6YyCzB/nikah-wall.png") no-repeat center;
  background-size:cover;
  filter:brightness(0.95) contrast(1.05);
  z-index:0;
}

/* LIGHT OVERLAY */
body::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.15);
  z-index:1;
}

/* BUTTON AREA */
.box{
  position:relative;
  z-index:2;
}

/* SMALL BUTTON */
.btn{
  padding:10px 18px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  font-size:14px;
  color:white;
  cursor:pointer;
  background:linear-gradient(145deg,#14b8a6,#0f766e);
  box-shadow:0 4px 0 #0b5e57;
}

.btn:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #0b5e57;
}
</style>
</head>

<body>

<div class="box">
  <button class="btn" onclick="login()">Login with Google</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
  .then(()=>{
    window.location.href = "index.html";
  });
}
</script>

</body>
</html>
