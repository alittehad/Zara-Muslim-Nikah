<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  overflow:hidden;
  position:relative;
}

/* ✅ SINGLE IMAGE BACKGROUND */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("https://i.ibb.co/rG6YyCzB/nikah-wall.png") no-repeat center;
  background-size:cover;
  z-index:0;

  /* 🔥 LIGHT FIX (remove black harshness) */
  filter:brightness(0.95) contrast(1.05);
}

/* 🔥 VERY LIGHT OVERLAY (NO DARK FEEL) */
body::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.15); /* very light */
  z-index:1;
}

/* LOGIN BUTTON AREA */
.box{
  position:relative;
  z-index:2;
}

/* BUTTON */
.btn{
  padding:10px 18px;   /* छोटा padding */
  border:none;
  border-radius:10px;
  font-weight:bold;
  font-size:8px;      /* छोटा text */
  color:white;
  cursor:pointer;

  background:linear-gradient(145deg,#14b8a6,#0f766e);
  box-shadow:0 4px 0 #0b5e57;  /* हल्का shadow */
}

.btn:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #0b5e57;
}

/* 📱 MOBILE FIX */
@media(max-width:768px){
  body::before{
    background-size:cover;
    background-position:center;
  }
}
</style>
</head>

<body>

<div class="box">
  <button class="btn">Login with Google</button>
</div>

</body>
</html>
