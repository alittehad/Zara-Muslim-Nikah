<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Zara Nikah</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  overflow:hidden;
  position:relative;
  background:#000;
}

/* 🔥 IMAGE FIX (IMPORTANT PART) */
.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;   /* ⭐ MAIN FIX (no cut) */
  background:#000;
  z-index:0;
}

/* DARK OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
  z-index:1;
}

/* LOGIN BOX */
.box{
  position:relative;
  z-index:2;
  text-align:center;
}

/* 3D BUTTON */
.btn{
  padding:14px 28px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
  color:white;
  cursor:pointer;
  background:linear-gradient(145deg,#14b8a6,#0f766e);
  box-shadow:0 6px 0 #0b5e57;
  transition:0.2s;
}

.btn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #0b5e57;
}

/* 📱 MOBILE */
@media(max-width:768px){
  .bg{
    object-fit:contain;
  }
}

/* 💻 PC */
@media(min-width:1024px){
  .bg{
    object-fit:contain;
  }
}
</style>
</head>

<body>

<!-- 🔥 BACKGROUND IMAGE PROPER FIT -->
<img class="bg" src="https://i.ibb.co/fzQ1WgbN/bg.jpg">

<div class="overlay"></div>

<div class="box">
  <button class="btn" onclick="login()">Login with Google</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
  .then(()=>{
    window.location.href="index.html";
  });
}
</script>

</body>
</html>
