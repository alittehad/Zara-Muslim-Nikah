<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  overflow:hidden;
  position:relative;
}

/* BACKGROUND IMAGE */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("https://i.ibb.co/rG6YyCzB/nikah-wall.png") no-repeat center;
  background-size:cover;
  filter:brightness(0.95) contrast(1.05);
  z-index:0;
}

/* DARK OVERLAY */
body::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.18);
  z-index:1;
}

/* BUTTON AREA */
.box{
  position:relative;
  z-index:2;
  text-align:center;
}

/* LOGIN BUTTON */
.btn{
  padding:14px 24px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
  color:white;
  cursor:pointer;

  background:linear-gradient(145deg,#14b8a6,#0f766e);

  box-shadow:
    0 6px 0 #0b5e57,
    0 10px 20px rgba(0,0,0,0.25);

  transition:0.2s;
}

.btn:hover{
  transform:scale(1.04);
}

.btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #0b5e57;
}

/* LOADING TEXT */
.loading{
  color:white;
  margin-top:15px;
  font-size:14px;
  display:none;
}
</style>
</head>

<body>

<div class="box">

  <button class="btn" onclick="login()">
    🔐 Login with Google
  </button>

  <div class="loading" id="loading">
    Please wait...
  </div>

</div>

<script>

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

/* LOGIN STAY FIX */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* AUTO REDIRECT IF ALREADY LOGIN */
auth.onAuthStateChanged(user => {

  if(user){
    window.location.href = "index.html";
  }

});

/* GOOGLE LOGIN */
function login(){

  document.getElementById("loading").style.display = "block";

  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)

  .then((result)=>{

    console.log("Login Success");

    window.location.href = "index.html";

  })

  .catch((error)=>{

    document.getElementById("loading").style.display = "none";

    console.log(error);

    alert(error.message);

  });

}

</script>

</body>
</html>
