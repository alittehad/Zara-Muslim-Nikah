<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  background:#0f172a;
}

button{
  padding:14px 22px;
  border:none;
  border-radius:10px;
  background:#14b8a6;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
}

.loading{
  color:white;
  margin-top:10px;
  display:none;
  text-align:center;
}
</style>
</head>

<body>

<div style="text-align:center;">
  <button onclick="login()">🔐 Login with Google</button>
  <div class="loading" id="loading">Logging in...</div>
</div>

<script>

/* 🔥 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnx2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com",
  messagingSenderId: "690336186269",
  appId: "1:690336186269:web:8215c1d313c4273c1f7974"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

/* 🔥 SAVE LOGIN SESSION */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* 🔐 LOGIN FUNCTION */
function login(){

  document.getElementById("loading").style.display = "block";

  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .then((result)=>{

    if(result.user){

      console.log("LOGIN SUCCESS:", result.user.email);

      // redirect after login
      window.location.replace("index.html");

    }

  })
  .catch((error)=>{

    document.getElementById("loading").style.display = "none";

    console.log(error);

    alert("Login failed: " + error.message);

  });

}

/* 🔁 AUTO REDIRECT IF ALREADY LOGGED IN */
auth.onAuthStateChanged(user=>{
  if(user){
    window.location.replace("index.html");
  }
});

</script>

</body>
</html>
