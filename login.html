<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Zara Nikah</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  overflow:hidden;
  position:relative;
  background:#000;
}

/* 🔥 BLUR BACKGROUND (FULL COVER) */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("https://i.ibb.co/fzQ1WgbN/bg.jpg") center/cover no-repeat;
  filter:blur(8px) brightness(0.7);
  transform:scale(1.1);
  z-index:0;
}

/* 🔥 SAFE CENTER IMAGE (NO CUT FEEL) */
body::after{
  content:"";
  position:absolute;
  inset:0;
  background:url("https://i.ibb.co/fzQ1WgbN/bg.jpg") center/contain no-repeat;
  background-color:rgba(0,0,0,0.4);
  z-index:1;
}

/* LOGIN BOX */
.box{
  position:relative;
  z-index:2;
  text-align:center;
  color:white;
}

/* BUTTON */
.btn{
  padding:14px 28px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
  color:white;
  cursor:pointer;
  background:linear-gradient(145deg,#14b8a6,#0f766e);
  box-shadow:0 6px 0 #0b5e57;
}

.btn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #0b5e57;
}
</style>
</head>

<body>

<div class="box">
  <h2>🕋 Zara Nikah Service</h2>
  <button class="btn" onclick="login()">Login with Google</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
  .then(()=>{
    window.location.href="index.html";
  });
}
</script>

</body>
</html>
