<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Zara Nikah</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  overflow:hidden;
  position:relative;
}

/* ✅ ONLY ONE IMAGE */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("https://i.ibb.co/fzQ1WgbN/bg.jpg") no-repeat center;

  /* 🔥 IMPORTANT FIX */
  background-size:cover;       /* fills screen */
  background-position:center;  /* keeps focus center */

  filter:brightness(0.75);
  z-index:0;
}

/* LOGIN BOX */
.box{
  position:relative;
  z-index:2;
  text-align:center;
  color:white;
}

/* BUTTON */
.btn{
  padding:14px 28px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
  color:white;
  cursor:pointer;
  background:linear-gradient(145deg,#14b8a6,#0f766e);
  box-shadow:0 6px 0 #0b5e57;
}

.btn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #0b5e57;
}

/* 📱 MOBILE FIX */
@media(max-width:768px){
  body::before{
    background-size:cover;
    background-position:center;
  }
}
</style>
</head>

<body>

<div class="box">
  <h2>🕋 Zara Nikah Service</h2>
  <button class="btn">Login with Google</button>
</div>

</body>
</html>
