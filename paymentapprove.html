<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Approval Panel</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

header{
  background:#111;
  color:white;
  text-align:center;
  padding:12px;
  font-weight:bold;
}

.container{
  padding:10px;
}

.card{
  background:white;
  border-radius:10px;
  padding:10px;
  margin-bottom:12px;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
  font-size:14px;
}

.card img{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:8px;
}

.btn{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  margin-top:6px;
  cursor:pointer;
  color:white;
  font-size:12px;
}

.approve{background:green;}
.reject{background:red;}
.status{
  font-weight:bold;
  margin-top:5px;
}
</style>
</head>

<body>

<header>👑 Payment Approval Panel</header>

<div class="container" id="list"></div>

<script>

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* 🔥 LOAD PAYMENTS */
db.ref("payments").on("value", snap => {

  let html = "";

  snap.forEach(child => {

    let d = child.val();
    let id = child.key;

    html += `
      <div class="card">

        <b>👤 Name:</b> ${d.name || ""}<br>
        <b>🎂 Age:</b> ${d.age || ""}<br>
        <b>💰 Fee:</b> ₹${d.amount || "N/A"}<br>

        ${d.screenshot ? `<img src="${d.screenshot}">` : ""}

        <div class="status">Status: ${d.status || "pending"}</div>

        <button class="btn approve" onclick="approve('${id}')">✔ Approve</button>
        <button class="btn reject" onclick="reject('${id}')">✖ Reject</button>

      </div>
    `;
  });

  document.getElementById("list").innerHTML =
    html || "<p>No Payments Found</p>";
});

/* ✔ APPROVE */
function approve(id){
  db.ref("payments/"+id).update({
    status:"approved"
  });
}

/* ✖ REJECT */
function reject(id){
  db.ref("payments/"+id).update({
    status:"rejected"
  });
}

</script>

</body>
</html>
