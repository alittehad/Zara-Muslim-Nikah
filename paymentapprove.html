<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Approve</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  margin:0;
  background:#f4f6f9;
}

/* HEADER */
header{
  background:#0f766e;
  color:white;
  text-align:center;
  padding:12px;
  font-weight:bold;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
  padding:10px;
}

/* CARD SMALL */
.card{
  background:white;
  border-radius:10px;
  padding:10px;
  font-size:13px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:8px;
}

/* BUTTONS */
.btn{
  width:48%;
  padding:8px;
  border:none;
  border-radius:6px;
  color:white;
  font-size:12px;
}

.approve{background:green;}
.reject{background:red;}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
}
</style>
</head>

<body>

<header>💰 Payment Approval Panel</header>

<div class="grid" id="list"></div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* LOAD PAYMENTS */
db.ref("payments").on("value",snap=>{

  let html="";

  snap.forEach(child=>{
    let d = child.val();
    let key = child.key;

    if(d.status === "approved") return;

    html += `
    <div class="card">
      <img src="${d.screenshot}">
      <b>${d.name}</b><br>
      Age: ${d.age}<br>
      Amount: ₹${d.amount}<br>

      <div class="row">
        <button class="btn approve" onclick="approve('${key}')">Approve</button>
        <button class="btn reject" onclick="reject('${key}')">Reject</button>
      </div>
    </div>`;
  });

  document.getElementById("list").innerHTML = html;

});

/* APPROVE */
function approve(id){
  db.ref("payments/"+id).update({
    status:"approved"
  });
}

/* REJECT */
function reject(id){
  db.ref("payments/"+id).remove();
}

</script>

</body>
</html>
