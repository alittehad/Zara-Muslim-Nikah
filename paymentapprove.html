<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Approval Panel</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background:#111;
  color:white;
  text-align:center;
  padding:12px;
  font-size:16px;
  font-weight:bold;
}

/* GRID RESPONSIVE */
.container{
  padding:10px;
  display:grid;
  grid-template-columns:repeat(1,1fr);
  gap:10px;
}

@media(min-width:768px){
  .container{
    grid-template-columns:repeat(4,1fr);
  }
}

/* CARD */
.card{
  background:white;
  border-radius:8px;
  padding:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
  font-size:13px;
}

/* IMAGE FIX */
.card img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:6px;
  margin-top:5px;
}

/* STATUS */
.status{
  margin-top:5px;
  font-size:12px;
  font-weight:bold;
}

/* BUTTONS */
.btn{
  padding:5px 7px;
  border:none;
  border-radius:5px;
  margin-top:6px;
  margin-right:3px;
  cursor:pointer;
  color:white;
  font-size:11px;
}

.approve{background:green;}
.reject{background:red;}
.delete{background:#444;}
</style>
</head>

<body>

<header>👑 Payment Approval Panel</header>

<div class="container" id="list"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* LOAD PAYMENTS */
db.ref("payments").on("value", snap => {

  let html = "";

  snap.forEach(child => {

    let d = child.val();
    let id = child.key;

    html += `
      <div class="card">

        <b>👤 Name:</b> ${d.name || ""}<br>
        <b>🎂 Age:</b> ${d.age || ""}<br>
        <b>💰 Fee:</b> ₹${d.amount || "N/A"}<br>

        ${d.screenshot ? `<img src="${d.screenshot}">` : ""}

        <div class="status">Status: ${d.status || "pending"}</div>

        <button class="btn approve" onclick="approve('${id}')">✔</button>
        <button class="btn reject" onclick="reject('${id}')">✖</button>
        <button class="btn delete" onclick="del('${id}')">🗑</button>

      </div>
    `;
  });

  document.getElementById("list").innerHTML =
    html || "<p style='text-align:center'>No Payments Found</p>";
});

/* APPROVE */
function approve(id){
  db.ref("payments/"+id).update({status:"approved"});
}

/* REJECT */
function reject(id){
  db.ref("payments/"+id).update({status:"rejected"});
}

/* DELETE */
function del(id){
  if(confirm("Delete this record?")){
    db.ref("payments/"+id).remove();
  }
}

</script>

</body>
</html>
