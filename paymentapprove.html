<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Approval</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{font-family:sans-serif;background:#f4f6f9;padding:10px;}
.card{
  background:#fff;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  font-size:14px;
}
img{width:100%;border-radius:8px;}
button{
  width:48%;
  padding:8px;
  margin-top:5px;
  border:none;
  border-radius:6px;
}
.approve{background:green;color:white;}
.reject{background:red;color:white;}
</style>
</head>

<body>

<h3>👑 Payment Approval Panel</h3>

<div id="list"></div>

<script>

firebase.initializeApp({
  apiKey:"YOUR_KEY",
  authDomain:"YOUR_DOMAIN",
  databaseURL:"YOUR_DB"
});

const db = firebase.database();

db.ref("payments").on("value",snap=>{
  let html="";

  snap.forEach(c=>{
    let d = c.val();

    html+=`
    <div class="card">
      <b>${d.name}</b> | Age: ${d.age}<br>
      <img src="${d.screenshot}">
      <p>Status: <b>${d.status}</b></p>

      <button class="approve" onclick="approve('${c.key}')">Approve</button>
      <button class="reject" onclick="reject('${c.key}')">Reject</button>
    </div>`;
  });

  document.getElementById("list").innerHTML=html;
});

function approve(id){
  db.ref("payments/"+id).update({status:"approved"});
}

function reject(id){
  db.ref("payments/"+id).update({status:"rejected"});
}

</script>

</body>
</html>
