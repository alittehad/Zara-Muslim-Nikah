<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Approval</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{font-family:sans-serif;background:#f4f6f9;padding:10px;}

.card{
  background:#fff;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  font-size:14px;
}

img{
  width:100%;
  border-radius:8px;
  margin-top:5px;
}

.btns{
  display:flex;
  gap:10px;
  margin-top:8px;
}

button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
</style>
</head>

<body>

<h3>👑 Payment Approval Panel</h3>

<div id="list"></div>

<script>

/* 🔥 REAL CONFIG DALNA */
firebase.initializeApp({
  apiKey:"YOUR_KEY",
  authDomain:"YOUR_DOMAIN",
  databaseURL:"YOUR_DB"
});

const db = firebase.database();

/* LOAD */
db.ref("payments").on("value",snap=>{

  let html="";

  snap.forEach(c=>{

    let d = c.val();
    let id = c.key;

    html+=`
    <div class="card">
      <b>नाम:</b> ${d.name || ""}<br>
      <b>Age:</b> ${d.age || ""}<br>

      ${d.screenshot ? `<img src="${d.screenshot}">` : ""}

      <p>Status: <b>${d.status || "pending"}</b></p>

      <div class="btns">
        <button class="approve" onclick="approve('${id}')">Approve</button>
        <button class="reject" onclick="reject('${id}')">Reject</button>
      </div>

    </div>`;
  });

  document.getElementById("list").innerHTML=html || "<p>No data</p>";
});

/* ACTION */
function approve(id){
  db.ref("payments/"+id).update({status:"approved"});
}

function reject(id){
  db.ref("payments/"+id).update({status:"rejected"});
}

</script>

</body>
</html>
