<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Received Interests</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:10px;
}

.btn3d{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  box-shadow:0 5px 0 #0b5c56;
}

.card{
  background:#fff;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

button{
  padding:7px;
  margin-top:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.lock{
  color:red;
  font-weight:bold;
  margin:10px 0;
}
.ok{
  color:green;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>Received Interests</h2>

<button class="btn3d" onclick="window.location='payment.html'">
💰 रजिस्ट्रेशन फीस जमा करें
</button>

<div id="msg" class="lock"></div>
<div id="list"></div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let paid = false;

/* CHECK PAYMENT */
function checkPayment(uid){

  db.ref("payments").on("value",snap=>{

    paid = false;

    snap.forEach(s=>{
      let d = s.val();
      if(d.uid === uid && d.status === "approved"){
        paid = true;
      }
    });

    document.getElementById("msg").innerHTML =
      paid ? "✔ आप registered हो गए हैं" : "👉 पहले registration fees जमा करें";
  });
}

/* LOAD INTERESTS */
function loadInterests(uid){

  db.ref("interests").on("value",snap=>{

    let html = "";
    let found = false;

    snap.forEach(s=>{

      let d = s.val();

      if(!d || !d.receiverId) return;

      if(d.receiverId === uid){
        found = true;

        html += `
        <div class="card">
          <b>From:</b> ${d.senderId || "Unknown"}<br>
          <b>Status:</b> ${d.status || "pending"}<br>

          <button onclick="accept('${s.key}')">✔ Accept</button>
          <button onclick="reject('${s.key}')">✖ Reject</button>

          <button onclick="submitProfile()">
            📩 Submit Profile
          </button>
        </div>`;
      }
    });

    document.getElementById("list").innerHTML =
      found ? html : "<p>No Interests Found</p>";
  });
}

/* ACTIONS */
function accept(id){
 db.ref("interests/"+id).update({status:"accepted"});
}

function reject(id){
 db.ref("interests/"+id).update({status:"rejected"});
}

function submitProfile(){

 if(!paid){
   alert("❗ पहले fees जमा करें");
   return;
 }

 alert("✔ सबमिट हो गया");
}

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
    return;
  }

  checkPayment(user.uid);
  loadInterests(user.uid);
});

</script>

</body>
</html>
