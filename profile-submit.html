<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marriage Profile</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:10px;
}

.box{
  max-width:450px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

#preview{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 Marriage Profile</h2>

<input id="name" placeholder="पूरा नाम">
<input id="age" placeholder="उम्र">
<select id="gender">
  <option value="">Gender चुनें</option>
  <option>Male</option>
  <option>Female</option>
</select>

<input id="phone" placeholder="मोबाइल नंबर">
<input id="city" placeholder="शहर">
<input id="religion" placeholder="धर्म">
<input id="education" placeholder="शिक्षा">
<input id="job" placeholder="नौकरी">
<textarea id="about" placeholder="अपने बारे में लिखें"></textarea>

<p>📷 Photo</p>
<input type="file" id="file">
<img id="preview">

<button onclick="saveProfile()">💾 Save Profile</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

/* IMAGE PREVIEW */
document.getElementById("file").onchange = function(e){
  let reader = new FileReader();
  reader.onload = function(){
    let img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display="block";
  };
  reader.readAsDataURL(e.target.files[0]);
};

/* IMGBB */
async function uploadImg(file){
  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* SAVE FIXED */
async function saveProfile(){

  let user = auth.currentUser;

  if(!user){
    alert("Login required");
    return;
  }

  // 🔥 CLEAN VALUES (IMPORTANT FIX)
  let nameVal = name.value.trim();
  let ageVal = age.value.trim();
  let genderVal = gender.value.trim();
  let phoneVal = phone.value.trim();
  let cityVal = city.value.trim();
  let religionVal = religion.value.trim();
  let educationVal = education.value.trim();
  let jobVal = job.value.trim();
  let aboutVal = about.value.trim();

  let file = document.getElementById("file").files[0];

  // ✔ PROPER VALIDATION FIXED
  if(
    nameVal==="" ||
    ageVal==="" ||
    genderVal==="" ||
    phoneVal==="" ||
    cityVal==="" ||
    religionVal==="" ||
    educationVal==="" ||
    jobVal==="" ||
    aboutVal==="" ||
    !file
  ){
    alert("❗ सभी fields भरें");
    return;
  }

  alert("Uploading...");

  let imgUrl = await uploadImg(file);

  await db.ref("profiles").push({
    uid:user.uid,
    name:nameVal,
    age:ageVal,
    gender:genderVal,
    phone:phoneVal,
    city:cityVal,
    religion:religionVal,
    education:educationVal,
    job:jobVal,
    about:aboutVal,
    photo:imgUrl,
    time:Date.now()
  });

  alert("✔ Profile Saved Successfully");

  // 🔥 OPEN PAYMENT PAGE (FIXED)
  window.location.href = "payment.html";
}

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
  }
});

</script>

</body>
</html>
