<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marriage Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:10px;
}

.box{
  max-width:450px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

.btn3d{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  box-shadow:0 5px 0 #0b5c56;
}

.submitBtn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.locked{background:gray;color:white;}
.unlocked{background:green;color:white;}

.msg{
  text-align:center;
  font-weight:bold;
  margin:10px 0;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 शादी प्रोफाइल फॉर्म</h2>

<input id="name" placeholder="पूरा नाम">
<input id="age" placeholder="उम्र">
<select id="gender">
  <option value="">Gender चुनें</option>
  <option>Male</option>
  <option>Female</option>
</select>

<input id="phone" placeholder="मोबाइल नंबर">
<input id="city" placeholder="शहर">
<input id="religion" placeholder="धर्म">
<input id="education" placeholder="शिक्षा">
<input id="job" placeholder="नौकरी / काम">
<textarea id="bio" placeholder="अपने बारे में लिखें"></textarea>

<!-- PAYMENT -->
<button class="btn3d" onclick="goPayment()">
💰 Registration Fees जमा करें
</button>

<div id="status" class="msg">Checking payment...</div>

<button id="submitBtn" class="submitBtn locked" onclick="submitProfile()">
🔒 Submit Profile
</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let isPaid = false;

/* PAYMENT PAGE */
function goPayment(){
  window.location="payment.html";
}

/* CHECK PAYMENT */
function checkPayment(uid){

  db.ref("payments").on("value",snap=>{
    isPaid = false;

    snap.forEach(s=>{
      let d = s.val();
      if(d.uid === uid && d.status === "approved"){
        isPaid = true;
      }
    });

    if(isPaid){
      document.getElementById("status").innerHTML = "✔ आप registered हैं";
      document.getElementById("submitBtn").classList.remove("locked");
      document.getElementById("submitBtn").classList.add("unlocked");
    }else{
      document.getElementById("status").innerHTML =
      "❗ पहले registration fees जमा करें";
    }
  });
}

/* SUBMIT PROFILE (ONLY ADMIN DATA) */
function submitProfile(){

  if(!isPaid){
    alert("❗ पहले payment करें");
    return;
  }

  let user = auth.currentUser;

  let data = {
    uid: user.uid,
    name: name.value,
    age: age.value,
    gender: gender.value,
    phone: phone.value,
    city: city.value,
    religion: religion.value,
    education: education.value,
    job: job.value,
    bio: bio.value,
    visibility: "admin",   // 👈 IMPORTANT (index में show नहीं होगा)
    time: Date.now()
  };

  if(!data.name || !data.age || !data.phone){
    alert("Required fields fill करें");
    return;
  }

  db.ref("profiles_admin").push(data);

  alert("✔ Profile Admin को भेज दिया गया है");
}

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
    return;
  }

  checkPayment(user.uid);
});

</script>

</body>
</html>
