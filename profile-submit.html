<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:15px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

/* 3D BUTTON */
.btn3d{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  box-shadow:0 5px 0 #0b5c56;
  cursor:pointer;
}

.btn3d:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #0b5c56;
}

/* SUBMIT */
.submitBtn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  margin-top:10px;
}

.locked{
  background:gray;
  color:white;
  cursor:not-allowed;
}

.unlocked{
  background:green;
  color:white;
  cursor:pointer;
}

/* MSG */
.msg{
  text-align:center;
  font-weight:bold;
  margin:10px 0;
}

.lock{
  color:red;
}

.ok{
  color:green;
}
</style>
</head>

<body>

<div class="box">

<h2>👤 Profile Submit</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="city" placeholder="City">

<!-- 💰 PAYMENT BUTTON -->
<button class="btn3d" onclick="goPayment()">
💰 Registration Fees जमा करें
</button>

<!-- STATUS -->
<div id="status" class="msg lock">Checking payment...</div>

<!-- SUBMIT -->
<button id="submitBtn" class="submitBtn locked" onclick="submitProfile()">
🔒 Submit Profile
</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let isPaid = false;

/* PAYMENT PAGE */
function goPayment(){
  window.location = "payment.html";
}

/* CHECK PAYMENT */
function checkPayment(uid){

  db.ref("payments").on("value", snap=>{

    isPaid = false;

    snap.forEach(s=>{
      let d = s.val();

      if(d.uid === uid && d.status === "approved"){
        isPaid = true;
      }
    });

    if(isPaid){
      document.getElementById("status").innerHTML = "✔ आप registered हैं";
      document.getElementById("status").className = "msg ok";

      document.getElementById("submitBtn").classList.remove("locked");
      document.getElementById("submitBtn").classList.add("unlocked");

    }else{
      document.getElementById("status").innerHTML =
      "❗ पहले registration fees जमा करें";

      document.getElementById("submitBtn").classList.add("locked");
    }
  });
}

/* SUBMIT */
function submitProfile(){

  if(!isPaid){
    alert("❗ पहले payment करें");
    return;
  }

  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let city = document.getElementById("city").value;

  if(!name || !age || !city){
    alert("Fill all fields");
    return;
  }

  alert("✔ Profile Submitted Successfully");

  db.ref("profiles").push({
    name,
    age,
    city,
    uid: firebase.auth().currentUser.uid,
    time: Date.now()
  });
}

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
    return;
  }

  checkPayment(user.uid);
});

</script>

</body>
</html>
