<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Received Interests</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  padding:10px;
  background:#f4f6f9;
}

/* 3D BUTTON */
.btn3d{
  background:#0f766e;
  color:white;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 0 #0b5c56;
  width:100%;
}

.btn3d:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #0b5c56;
}

/* CARD */
.card{
  background:white;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* BUTTON */
button{
  margin:5px 0;
  padding:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* MSG */
.lock-msg{
  color:red;
  font-weight:bold;
  margin:10px 0;
}

/* EMPTY */
.empty{
  text-align:center;
  color:gray;
  margin-top:20px;
}
</style>
</head>

<body>

<h2>Received Interests</h2>

<!-- 💰 PAYMENT BUTTON -->
<button class="btn3d" onclick="goPayment()">
💰 रजिस्ट्रेशन फीस जमा करें
</button>

<div id="payMsg" class="lock-msg"></div>

<!-- 🔥 IMPORTANT FIX: container always exists -->
<div id="receivedList"></div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth=firebase.auth();
const db=firebase.database();

let isPaid=false;

/* PAYMENT PAGE */
function goPayment(){
  window.location="payment.html";
}

/* CHECK PAYMENT */
function checkPayment(uid){

  db.ref("payments").orderByChild("uid").equalTo(uid).on("value",snap=>{

    isPaid=false;

    snap.forEach(c=>{
      let d=c.val();
      if(d.status==="approved"){
        isPaid=true;
      }
    });

    document.getElementById("payMsg").innerText =
      isPaid
      ? "✔ Payment Verified"
      : "👉 पहले Registration Fees जमा करें";
  });
}

/* LOGIN */
auth.onAuthStateChanged(user=>{

 if(!user){
   window.location="index.html";
   return;
 }

 checkPayment(user.uid);

 db.ref("interests").on("value",snap=>{

   let html="";

   snap.forEach(child=>{

     let d=child.val();

     if(d.receiverId===user.uid){

       html+=`
       <div class="card">

         <b>From:</b> ${d.senderId || "Unknown"}<br>
         <b>Status:</b> ${d.status || "pending"}<br>

         <button onclick="accept('${child.key}')">✔ Accept</button>
         <button onclick="reject('${child.key}')">✖ Reject</button>

         <button onclick="submitProfile('${child.key}')">
           📩 Submit Profile
         </button>

       </div>`;
     }
   });

   document.getElementById("receivedList").innerHTML =
     html || "<div class='empty'>No Requests Found</div>";
 });
});

/* ACCEPT */
function accept(id){
 db.ref("interests/"+id).update({status:"accepted"});
}

/* REJECT */
function reject(id){
 db.ref("interests/"+id).update({status:"rejected"});
}

/* SUBMIT LOCK */
function submitProfile(id){

 if(!isPaid){
   alert("❗ पहले Registration Fees जमा करें");
   return;
 }

 alert("✔ Profile Submitted Successfully");
 db.ref("interests/"+id).update({submitted:true});
}

</script>

</body>
</html>
