<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:10px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

/* 3D BUTTON */
.btn3d{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  box-shadow:0 5px 0 #0b5c56;
  cursor:pointer;
}

.btn3d:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #0b5c56;
}

/* SUBMIT */
.submitBtn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  font-weight:bold;
}

.locked{background:gray;color:white;}
.unlocked{background:green;color:white;}

/* MSG */
.msg{
  text-align:center;
  font-weight:bold;
  margin:10px 0;
}
.lock{color:red;}
.ok{color:green;}

/* IMAGE PREVIEW SMALL */
#preview{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  margin-top:5px;
  display:none;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<div class="box">

<h3>👤 Profile Submit</h3>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="city" placeholder="City">
<input id="phone" placeholder="Mobile Number">

<p>📷 Photo Upload</p>
<input type="file" id="file">
<img id="preview">

<!-- PAYMENT -->
<button class="btn3d" onclick="goPayment()">
💰 Registration Fees जमा करें
</button>

<div id="status" class="msg lock">Checking payment...</div>

<button id="submitBtn" class="submitBtn locked" onclick="submitProfile()">
🔒 Submit Profile
</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let isPaid = false;

/* PREVIEW (SMALL) */
document.getElementById("file").onchange = function(e){
  let file = e.target.files[0];
  let reader = new FileReader();

  reader.onload = function(){
    let img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display = "block";
  };

  reader.readAsDataURL(file);
};

/* IMGBB UPLOAD */
async function uploadImg(file){
  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* PAYMENT PAGE */
function goPayment(){
  window.location="payment.html";
}

/* CHECK PAYMENT */
function checkPayment(uid){

  db.ref("payments").on("value", snap=>{

    isPaid = false;

    snap.forEach(s=>{
      let d = s.val();

      if(d.uid === uid && d.status === "approved"){
        isPaid = true;
      }
    });

    if(isPaid){
      document.getElementById("status").innerHTML = "✔ आप registered हो गए हैं";
      document.getElementById("status").className="msg ok";

      document.getElementById("submitBtn").classList.remove("locked");
      document.getElementById("submitBtn").classList.add("unlocked");

    }else{
      document.getElementById("status").innerHTML = "⏳ Wait for approval";
      document.getElementById("submitBtn").classList.add("locked");
    }
  });
}

/* SUBMIT */
async function submitProfile(){

  if(!isPaid){
    alert("पहले payment करें");
    return;
  }

  let user = auth.currentUser;

  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let city = document.getElementById("city").value;
  let phone = document.getElementById("phone").value;
  let file = document.getElementById("file").files[0];

  if(!name || !age || !city || !phone || !file){
    alert("Required fields fill करें");
    return;
  }

  let imgUrl = await uploadImg(file);

  db.ref("profiles").push({
    uid:user.uid,
    name,
    age,
    city,
    phone,
    photo:imgUrl,
    time:Date.now()
  });

  alert("✔ Profile Submitted");
}

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
    return;
  }
  checkPayment(user.uid);
});

</script>

</body>
</html>
