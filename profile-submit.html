<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:10px;
}

.box{
  max-width:450px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

/* IMAGE PREVIEW SMALL */
#preview{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 Profile Submit</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="phone" placeholder="Phone">
<input id="city" placeholder="City">
<input id="job" placeholder="Job">

<p>📷 Photo</p>
<input type="file" id="file">
<img id="preview">

<button onclick="saveProfile()">💾 Save Profile</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let imageURL = "";

/* PREVIEW */
document.getElementById("file").onchange = function(e){
  let reader = new FileReader();
  reader.onload = function(){
    let img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display="block";
  };
  reader.readAsDataURL(e.target.files[0]);
};

/* IMG UPLOAD */
async function uploadImg(file){

  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* SAVE PROFILE */
async function saveProfile(){

  const user = auth.currentUser;

  if(!user){
    alert("Login required");
    return;
  }

  let file = document.getElementById("file").files[0];

  if(!file){
    alert("Photo जरूरी है");
    return;
  }

  if(!name.value || !age.value || !phone.value || !city.value){
    alert("Required fields fill करें");
    return;
  }

  alert("Saving profile...");

  imageURL = await uploadImg(file);

  await db.ref("profiles").push({
    uid: user.uid,
    name: name.value,
    age: age.value,
    phone: phone.value,
    city: city.value,
    job: job.value,
    photo: imageURL,
    time: Date.now()
  });

  alert("✔ Profile Saved");

  // 🔥 IMPORTANT: redirect to payment page
  window.location.href = "payment.html";
}

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
  }
});

</script>

</body>
</html>
