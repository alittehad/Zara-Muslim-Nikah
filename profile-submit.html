<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marriage Profile Form</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:10px;
}

.box{
  max-width:450px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  color:#0f766e;
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  margin-top:8px;
}

/* CARD */
.card{
  background:white;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* IMAGE SMALL */
.card img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 शादी प्रोफाइल फॉर्म</h2>

<!-- BASIC DETAILS -->
<input id="name" placeholder="पूरा नाम">
<input id="age" placeholder="उम्र">
<select id="gender">
  <option value="">Gender चुनें</option>
  <option>Male</option>
  <option>Female</option>
</select>

<input id="phone" placeholder="मोबाइल नंबर">
<input id="city" placeholder="शहर">
<input id="religion" placeholder="धर्म">
<input id="education" placeholder="शिक्षा">
<input id="job" placeholder="नौकरी / काम">
<textarea id="about" placeholder="अपने बारे में लिखें"></textarea>

<!-- PHOTO -->
<p>📷 Profile Photo</p>
<input type="file" id="file">
<img id="preview" style="width:90px;height:90px;display:none;border-radius:8px;margin-top:5px;">

<button onclick="submitProfile()">💾 Save Profile</button>

</div>

<!-- USER DATA -->
<div id="list"></div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let imageURL = "";

/* PREVIEW */
document.getElementById("file").onchange = function(e){
  let reader = new FileReader();
  reader.onload = function(){
    let img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display="block";
  };
  reader.readAsDataURL(e.target.files[0]);
};

/* IMGBB UPLOAD */
async function uploadImg(file){

  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* SUBMIT */
async function submitProfile(){

  let user = auth.currentUser;

  if(!user){
    alert("Login करें");
    return;
  }

  let file = document.getElementById("file").files[0];

  if(!file){
    alert("Photo जरूरी है");
    return;
  }

  imageURL = await uploadImg(file);

  let data = {
    uid:user.uid,
    name:name.value,
    age:age.value,
    gender:gender.value,
    phone:phone.value,
    city:city.value,
    religion:religion.value,
    education:education.value,
    job:job.value,
    about:about.value,
    photo:imageURL,
    time:Date.now()
  };

  db.ref("profiles").push(data);

  alert("✔ Profile Saved Successfully");
}

/* LOAD (NO DELETE ON REFRESH) */
auth.onAuthStateChanged(user=>{

  if(!user){
    window.location="index.html";
    return;
  }

  db.ref("profiles").on("value", snap=>{

    let html="";

    snap.forEach(c=>{

      let d=c.val();

      // ONLY USER DATA
      if(d.uid !== user.uid) return;

      html+=`
      <div class="card">

        <img src="${d.photo}">

        <b>${d.name}</b><br>
        🎂 ${d.age}<br>
        🚻 ${d.gender}<br>
        📱 ${d.phone}<br>
        🏙 ${d.city}<br>
        📚 ${d.education}<br>
        💼 ${d.job}<br>
        ❤️ ${d.about}<br>

      </div>`;
    });

    document.getElementById("list").innerHTML =
    html || "<p style='text-align:center'>No Profile Found</p>";
  });

});

</script>

</body>
</html>
