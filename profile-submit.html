<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marriage Profile Form</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:10px;
}

.box{
  max-width:450px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  color:#0f766e;
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

#preview{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
  display:none;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 शादी प्रोफाइल फॉर्म</h2>

<!-- FULL FORM -->
<input id="name" placeholder="पूरा नाम">
<input id="age" placeholder="उम्र">
<select id="gender">
  <option value="">Gender चुनें</option>
  <option>Male</option>
  <option>Female</option>
</select>

<input id="phone" placeholder="मोबाइल नंबर">
<input id="city" placeholder="शहर">
<input id="religion" placeholder="धर्म">
<input id="education" placeholder="शिक्षा">
<input id="job" placeholder="नौकरी">
<textarea id="about" placeholder="अपने बारे में लिखें"></textarea>

<p>📷 फोटो अपलोड करें</p>
<input type="file" id="file">
<img id="preview">

<button onclick="saveProfile()">💾 Save Profile</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let imageURL = "";

/* IMAGE PREVIEW */
document.getElementById("file").onchange = function(e){
  let reader = new FileReader();
  reader.onload = function(){
    let img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display="block";
  };
  reader.readAsDataURL(e.target.files[0]);
};

/* IMGBB UPLOAD */
async function uploadImg(file){

  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* SAVE PROFILE (FIXED) */
async function saveProfile(){

  let user = auth.currentUser;

  if(!user){
    alert("Login करें");
    return;
  }

  // validation
  if(
    !name.value ||
    !age.value ||
    !gender.value ||
    !phone.value ||
    !city.value ||
    !religion.value ||
    !education.value ||
    !job.value ||
    !about.value
  ){
    alert("❗ सभी fields भरें");
    return;
  }

  let file = document.getElementById("file").files[0];

  if(!file){
    alert("❗ Photo जरूरी है");
    return;
  }

  alert("Uploading image...");

  imageURL = await uploadImg(file);

  await db.ref("profiles").push({
    uid:user.uid,
    name:name.value,
    age:age.value,
    gender:gender.value,
    phone:phone.value,
    city:city.value,
    religion:religion.value,
    education:education.value,
    job:job.value,
    about:about.value,
    photo:imageURL,
    time:Date.now()
  });

  alert("✔ Profile Saved Successfully");

  // 🔥 redirect after save
  window.location.href = "payment.html";
}

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
  }
});

</script>

</body>
</html>
