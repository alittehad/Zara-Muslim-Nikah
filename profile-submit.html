<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:10px;
}

.box{
  max-width:450px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

.btn3d{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  box-shadow:0 5px 0 #0b5c56;
  cursor:pointer;
}

.submitBtn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.locked{background:gray;color:white;cursor:not-allowed;}
.unlocked{background:green;color:white;cursor:pointer;}

.msg{
  text-align:center;
  font-weight:bold;
  margin:10px 0;
}

.card{
  background:white;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>👤 Profile Submit</h2>

<input id="name" placeholder="पूरा नाम">
<input id="age" placeholder="उम्र">
<input id="phone" placeholder="मोबाइल नंबर">
<input id="city" placeholder="शहर">

<p>📷 Profile Photo</p>
<input type="file" id="file">

<img id="preview" style="width:100%;display:none;border-radius:10px;margin-top:5px;">

<!-- PAYMENT BUTTON -->
<button class="btn3d" onclick="goPayment()">
💰 Registration Fees जमा करें
</button>

<div id="status" class="msg">Checking payment...</div>

<button id="submitBtn" class="submitBtn locked" onclick="submitProfile()">
🔒 Submit Profile
</button>

</div>

<!-- USER DATA -->
<div id="list"></div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let isPaid = false;
let imageURL = "";

/* PAYMENT PAGE */
function goPayment(){
  window.location = "payment.html";
}

/* IMAGE PREVIEW */
document.getElementById("file").onchange = function(e){
  let reader = new FileReader();
  reader.onload = function(){
    document.getElementById("preview").src = reader.result;
    document.getElementById("preview").style.display="block";
  }
  reader.readAsDataURL(e.target.files[0]);
};

/* IMGBB UPLOAD */
async function uploadToImgBB(file){

  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72", {
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* CHECK PAYMENT */
function checkPayment(uid){

  db.ref("payments").on("value", snap=>{

    isPaid = false;

    snap.forEach(s=>{
      let d = s.val();

      if(d.uid === uid && d.status === "approved"){
        isPaid = true;
      }
    });

    if(isPaid){
      document.getElementById("status").innerHTML =
      "✔ आप registered हैं";

      document.getElementById("submitBtn").classList.remove("locked");
      document.getElementById("submitBtn").classList.add("unlocked");

    }else{
      document.getElementById("status").innerHTML =
      "❗ पहले registration fees जमा करें";
    }
  });
}

/* SUBMIT PROFILE */
async function submitProfile(){

  if(!isPaid){
    alert("❗ पहले payment करें");
    return;
  }

  let user = auth.currentUser;

  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let phone = document.getElementById("phone").value;
  let city = document.getElementById("city").value;
  let file = document.getElementById("file").files[0];

  if(!name || !age || !phone || !city || !file){
    alert("Required fields fill करें");
    return;
  }

  alert("Image upload हो रहा है...");

  imageURL = await uploadToImgBB(file);

  db.ref("profiles_admin").push({
    uid: user.uid,
    name,
    age,
    phone,
    city,
    image: imageURL,
    time: Date.now()
  });

  alert("✔ Profile Submit हो गया");
}

/* SHOW ONLY OWN DATA */
auth.onAuthStateChanged(user=>{

  if(!user){
    window.location="index.html";
    return;
  }

  checkPayment(user.uid);

  db.ref("profiles_admin").on("value", snap=>{

    let html = "";

    snap.forEach(c=>{

      let d = c.val();

      // 🔒 ONLY OWN USER DATA
      if(d.uid !== user.uid) return;

      html += `
      <div class="card">

        <img src="${d.image}">

        <b>${d.name}</b><br>
        🎂 ${d.age}<br>
        📱 ${d.phone}<br>
        🏙 ${d.city}<br>

      </div>`;
    });

    document.getElementById("list").innerHTML =
    html || "<p style='text-align:center'>No Data Found</p>";
  });

});

</script>

</body>
</html>
