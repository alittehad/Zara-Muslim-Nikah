<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{font-family:sans-serif;background:#f4f6f9;padding:15px;}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
}

/* INPUT */
input,select,textarea,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

/* MAIN BUTTON */
button{
  background:#0f766e;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

/* 🔥 3D HOME BUTTON */
.homeBtn{
  background:#111;
  color:white;
  font-weight:bold;
  box-shadow:0 5px 0 #000;
  transition:0.1s;
}

.homeBtn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #000;
}

/* IMAGE */
.preview{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<div class="box">

<!-- 🏠 3D HOME BUTTON -->
<button class="homeBtn" onclick="goHome()">🏠 Home</button>

<h2>👤 Profile Form</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">

<select id="gender">
  <option value="">Gender</option>
  <option>Male</option>
  <option>Female</option>
</select>

<input id="city" placeholder="City">
<input id="phone" placeholder="Phone">
<input id="education" placeholder="Education">
<input id="profession" placeholder="Profession">
<textarea id="bio" placeholder="Bio"></textarea>

<p>📷 Image Upload</p>
<input type="file" id="file">
<img id="preview" class="preview">

<button onclick="submitProfile()">Submit & Payment</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

let user = null;

/* LOGIN */
auth.onAuthStateChanged(u=>{
  if(!u){
    window.location="index.html";
  }else{
    user = u;
  }
});

/* 🏠 HOME FUNCTION */
function goHome(){
  window.location="index.html";
}

/* IMAGE PREVIEW */
document.getElementById("file").onchange = e=>{
  let reader = new FileReader();
  reader.onload = ()=>{
    let img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display="block";
  }
  reader.readAsDataURL(e.target.files[0]);
};

/* IMGBB UPLOAD */
async function uploadImage(file){
  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data?.url || "";
}

/* SUBMIT */
async function submitProfile(){

  if(!user){
    alert("Login required");
    return;
  }

  let nameVal = document.getElementById("name").value;
  let ageVal = document.getElementById("age").value;
  let genderVal = document.getElementById("gender").value;
  let cityVal = document.getElementById("city").value;
  let phoneVal = document.getElementById("phone").value;

  let educationVal = document.getElementById("education").value;
  let professionVal = document.getElementById("profession").value;
  let bioVal = document.getElementById("bio").value;

  if(!nameVal || !ageVal || !genderVal || !cityVal || !phoneVal){
    alert("❗ सभी fields भरें");
    return;
  }

  let file = document.getElementById("file").files[0];
  let imgUrl = "";

  if(file){
    imgUrl = await uploadImage(file);
  }

  let profile = {
    uid:user.uid,
    name:nameVal,
    age:ageVal,
    gender:genderVal,
    city:cityVal,
    phone:phoneVal,
    education:educationVal,
    profession:professionVal,
    bio:bioVal,
    photo:imgUrl,
    status:"pending",
    time:Date.now()
  };

  try{
    await db.ref("users").push(profile);

    alert("✔ Profile Saved Successfully");

    window.location="payment.html";

  }catch(err){
    alert("❌ Firebase error");
    console.log(err);
  }
}

</script>

</body>
</html>
