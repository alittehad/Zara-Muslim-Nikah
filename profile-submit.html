<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:15px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input, select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#0f766e;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* IMAGE PREVIEW FIX (SMALL) */
.preview{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:10px;
  margin-top:8px;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="box">

<h2>👤 Profile Form</h2>

<input id="name" placeholder="पूरा नाम">
<input id="age" placeholder="उम्र">
<input id="city" placeholder="शहर">
<input id="phone" placeholder="मोबाइल नंबर">
<input id="religion" placeholder="धर्म">
<input id="education" placeholder="शिक्षा">

<p>📷 फोटो अपलोड करें</p>
<input type="file" id="image">

<img id="preview" class="preview" style="display:none;">

<button onclick="submitProfile()">💾 Save Profile</button>

</div>

<script>

const firebaseConfig = {
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
  }
});

/* IMAGE PREVIEW SMALL */
document.getElementById("image").onchange = function(e){
  let file = e.target.files[0];
  let reader = new FileReader();

  reader.onload = function(){
    document.getElementById("preview").src = reader.result;
    document.getElementById("preview").style.display = "block";
  }

  reader.readAsDataURL(file);
};

/* IMGBB UPLOAD */
async function uploadImage(file){

  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* SAVE PROFILE */
async function submitProfile(){

  const user = auth.currentUser;

  if(!user){
    alert("Login करें");
    return;
  }

  let name = document.getElementById("name").value.trim();
  let age = document.getElementById("age").value.trim();
  let city = document.getElementById("city").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let religion = document.getElementById("religion").value.trim();
  let education = document.getElementById("education").value.trim();
  let file = document.getElementById("image").files[0];

  /* FIX: proper validation */
  if(!name || !age || !city || !phone || !religion || !education){
    alert("❗ सभी fields भरें");
    return;
  }

  let imageUrl = "";

  if(file){
    imageUrl = await uploadImage(file);
  }

  let newProfile = db.ref("profiles").push();

  await newProfile.set({
    uid: user.uid,
    name,
    age,
    city,
    phone,
    religion,
    education,
    image: imageUrl,
    time: Date.now()
  });

  alert("✔ Profile Saved Successfully");

  /* REDIRECT TO PAYMENT */
  window.location = "payment.html";
}

</script>

</body>
</html>
