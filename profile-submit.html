<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{font-family:sans-serif;background:#f4f6f9;padding:15px;}
.box{max-width:420px;margin:auto;background:white;padding:15px;border-radius:12px;}

input,select,textarea,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

button{
  background:#0f766e;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.preview{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<div class="box">

<h2>👤 Profile Form</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">

<select id="gender">
  <option value="">Select Gender</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select>

<input id="city" placeholder="City">
<input id="phone" placeholder="Phone">
<input id="education" placeholder="Education">
<input id="profession" placeholder="Profession">
<textarea id="bio" placeholder="Bio"></textarea>

<p>📷 Image Upload</p>
<input type="file" id="file">
<img id="preview" class="preview">

<button onclick="submitProfile()">Submit & Go Payment</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

let user = null;

/* LOGIN */
auth.onAuthStateChanged(u=>{
  if(!u){
    window.location="index.html";
  }else{
    user = u;
  }
});

/* IMAGE PREVIEW */
document.getElementById("file").onchange = function(e){
  let file = e.target.files[0];
  let reader = new FileReader();

  reader.onload = function(){
    let img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display="block";
  }

  reader.readAsDataURL(file);
};

/* IMGBB UPLOAD FIXED */
async function uploadImage(file){

  try{
    let form = new FormData();
    form.append("image", file);

    let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
      method:"POST",
      body:form
    });

    let data = await res.json();

    if(!data || !data.data){
      throw "Upload failed";
    }

    return data.data.url;

  }catch(err){
    alert("Image upload failed");
    return "";
  }
}

/* SUBMIT FIXED */
async function submitProfile(){

  if(!user){
    alert("Login required");
    return;
  }

  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let gender = document.getElementById("gender").value;
  let city = document.getElementById("city").value;
  let phone = document.getElementById("phone").value;

  if(!name || !age || !gender || !city || !phone){
    alert("❗ सभी fields भरें");
    return;
  }

  let file = document.getElementById("file").files[0];

  if(!file){
    alert("Image जरूरी है");
    return;
  }

  alert("Uploading image...");

  let imgUrl = await uploadImage(file);

  if(!imgUrl){
    alert("Submit failed (image issue)");
    return;
  }

  let data = {
    uid:user.uid,
    name,age,gender,city,phone,
    education:document.getElementById("education").value,
    profession:document.getElementById("profession").value,
    bio:document.getElementById("bio").value,
    photo:imgUrl,
    time:Date.now()
  };

  db.ref("profiles").push(data);

  alert("✔ Profile Saved Successfully");

  window.location="payment.html";
}

</script>

</body>
</html>
