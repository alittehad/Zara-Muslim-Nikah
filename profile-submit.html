<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:15px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#0f766e;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.preview{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>👤 शादी प्रोफाइल फॉर्म</h2>

<input id="name" placeholder="नाम">
<input id="age" placeholder="उम्र">
<input id="gender" placeholder="लिंग">
<input id="city" placeholder="शहर">
<input id="phone" placeholder="मोबाइल नंबर">
<input id="education" placeholder="शिक्षा">
<input id="profession" placeholder="पेशा">

<textarea id="bio" placeholder="अपने बारे में लिखें"></textarea>

<p>📷 फोटो अपलोड करें</p>
<input type="file" id="image">

<img id="preview" class="preview" style="display:none;">

<button onclick="submitProfile()">💾 Save Profile</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
  }else{
    currentUser = user;
  }
});

/* IMAGE PREVIEW */
document.getElementById("image").onchange = function(e){
  let file = e.target.files[0];
  let reader = new FileReader();
  reader.onload = function(){
    let img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display="block";
  }
  reader.readAsDataURL(file);
};

/* IMGBB UPLOAD */
async function uploadImage(file){

  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* SUBMIT PROFILE */
async function submitProfile(){

  if(!currentUser){
    alert("Login required");
    return;
  }

  let file = document.getElementById("image").files[0];
  if(!file){
    alert("Image जरूरी है");
    return;
  }

  let imgUrl = await uploadImage(file);

  let profile = {
    uid: currentUser.uid,
    name: document.getElementById("name").value,
    age: document.getElementById("age").value,
    gender: document.getElementById("gender").value,
    city: document.getElementById("city").value,
    phone: document.getElementById("phone").value,
    education: document.getElementById("education").value,
    profession: document.getElementById("profession").value,
    bio: document.getElementById("bio").value,
    photo: imgUrl,
    status: "pending",
    time: Date.now()
  };

  db.ref("users/"+currentUser.uid).set(profile);

  alert("✔ Profile saved!");

  // 👉 payment page open
  window.location = "payment.html";
}

</script>

</body>
</html>
