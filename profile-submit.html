<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstaticjs.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:15px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
}

input,select,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  background:#0f766e;
  color:white;
  border:none;
  font-weight:bold;
}

.preview{
  width:100%;
  max-height:150px;
  object-fit:cover;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>👤 Marriage Profile Form</h2>

<input id="name" placeholder="पूरा नाम">
<input id="age" placeholder="उम्र">

<!-- 🔥 GENDER DROPDOWN -->
<select id="gender">
  <option value="">लिंग चुनें</option>
  <option value="Male">पुरुष</option>
  <option value="Female">महिला</option>
</select>

<input id="city" placeholder="शहर">
<input id="phone" placeholder="मोबाइल नंबर">
<input id="education" placeholder="शिक्षा">
<input id="profession" placeholder="पेशा">
<textarea id="bio" placeholder="अपने बारे में लिखें"></textarea>

<!-- IMAGE -->
<p>📷 फोटो अपलोड करें</p>
<input type="file" id="file">
<img id="preview" class="preview" style="display:none;">

<button onclick="submitProfile()">📩 Submit & Continue Payment</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

let user = null;

/* LOGIN CHECK */
auth.onAuthStateChanged(u=>{
  if(!u){
    window.location="index.html";
  }else{
    user = u;
  }
});

/* IMAGE PREVIEW */
document.getElementById("file").onchange = function(e){
  let reader = new FileReader();
  reader.onload = function(){
    document.getElementById("preview").src = reader.result;
    document.getElementById("preview").style.display="block";
  }
  reader.readAsDataURL(e.target.files[0]);
};

/* IMGBB UPLOAD */
async function upload(file){

  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* SUBMIT */
async function submitProfile(){

  if(!user){
    alert("Login required");
    return;
  }

  let file = document.getElementById("file").files[0];

  if(!file){
    alert("Image required");
    return;
  }

  let imgUrl = await upload(file);

  let data = {
    uid:user.uid,
    name:document.getElementById("name").value,
    age:document.getElementById("age").value,
    gender:document.getElementById("gender").value,
    city:document.getElementById("city").value,
    phone:document.getElementById("phone").value,
    education:document.getElementById("education").value,
    profession:document.getElementById("profession").value,
    bio:document.getElementById("bio").value,
    photo:imgUrl,
    time:Date.now()
  };

  db.ref("profiles").push(data);

  alert("✔ Profile Saved");

  // 🔥 GO PAYMENT PAGE
  window.location="payment.html";
}

</script>

</body>
</html>
