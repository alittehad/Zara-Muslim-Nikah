<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:10px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

.btn{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.lock{
  background:gray;
  cursor:not-allowed;
}

img.preview{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 शादी प्रोफाइल फॉर्म</h2>

<input id="name" placeholder="पूरा नाम">
<input id="age" placeholder="उम्र">
<input id="city" placeholder="शहर">
<input id="phone" placeholder="मोबाइल नंबर">
<input id="education" placeholder="शिक्षा">
<input id="job" placeholder="नौकरी / काम">
<textarea id="about" placeholder="अपने बारे में लिखें"></textarea>

<p>📷 फोटो अपलोड करें</p>
<input type="file" id="file">
<img id="preview" class="preview" style="display:none;">

<br>

<button class="btn" onclick="submitProfile()">💾 Save Profile</button>

</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain:"zara-muslim-nikah.firebaseapp.com",
  databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId:"zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* IMAGE PREVIEW SMALL FIX */
document.getElementById("file").onchange = function(e){
  let reader = new FileReader();
  reader.onload = function(){
    document.getElementById("preview").src = reader.result;
    document.getElementById("preview").style.display = "block";
  }
  reader.readAsDataURL(e.target.files[0]);
};

/* IMGBB UPLOAD */
async function uploadImg(file){
  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72", {
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* SAVE PROFILE */
async function submitProfile(){

  const user = auth.currentUser;

  if(!user){
    alert("Login करें पहले");
    return;
  }

  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let city = document.getElementById("city").value;
  let phone = document.getElementById("phone").value;
  let education = document.getElementById("education").value;
  let job = document.getElementById("job").value;
  let about = document.getElementById("about").value;
  let file = document.getElementById("file").files[0];

  /* FIX ERROR */
  if(!name || !age || !city || !phone || !education || !job || !about || !file){
    alert("❗ सभी fields भरें");
    return;
  }

  alert("Uploading...");

  let imgUrl = await uploadImg(file);

  let newRef = db.ref("profiles").push();

  await newRef.set({
    uid: user.uid,
    name,
    age,
    city,
    phone,
    education,
    job,
    about,
    photo: imgUrl,
    time: Date.now()
  });

  alert("✔ Profile Saved");

  /* PAYMENT PAGE OPEN */
  window.location = "payment.html";
}

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
  }
});

</script>

</body>
</html>
