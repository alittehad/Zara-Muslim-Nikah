<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Submit</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{font-family:sans-serif;background:#f4f6f9;padding:20px;}
.box{max-width:400px;margin:auto;background:white;padding:15px;border-radius:10px;}
input,button{width:100%;padding:10px;margin:8px 0;border-radius:8px;}
button{background:#0f766e;color:white;border:none;}
.lock{background:gray;}
</style>
</head>

<body>

<div class="box">
<h2>👤 Profile Form</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="city" placeholder="City">
<input id="phone" placeholder="Phone">

<button onclick="goPayment()">💰 Payment करें</button>

<button id="submitBtn" class="lock" onclick="submitProfile()" disabled>
🔒 Submit (Locked)
</button>

</div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

let userId = null;

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="index.html";
  }else{
    userId = user.uid;
    checkPayment();
  }
});

/* PAYMENT PAGE */
function goPayment(){
  window.location="payment.html";
}

/* PAYMENT CHECK */
function checkPayment(){
  db.ref("payments").on("value",snap=>{
    let approved = false;

    snap.forEach(s=>{
      let d = s.val();
      if(d.uid === userId && d.status==="approved"){
        approved = true;
      }
    });

    if(approved){
      document.getElementById("submitBtn").disabled = false;
      document.getElementById("submitBtn").classList.remove("lock");
    }
  });
}

/* SUBMIT PROFILE (PRIVATE - NOT SHOWN IN INDEX) */
function submitProfile(){

  if(!userId) return;

  db.ref("users").push({
    uid:userId,
    name:document.getElementById("name").value,
    age:document.getElementById("age").value,
    city:document.getElementById("city").value,
    phone:document.getElementById("phone").value,
    time:Date.now(),
    visibleToIndex:false
  });

  alert("✔ Profile Saved Successfully");

  // 👉 payment page open after submit
  window.location="payment.html";
}

</script>

</body>
</html>
