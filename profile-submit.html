<!DOCTYPE html>
<html>
<head>
  <title>Create Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    /* Basic Body */
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* Form Container */
    .form-container {
      background: #fff;
      margin: 20px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 420px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #0f766e;
    }

    /* Inputs & Textarea */
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-shadow: 0 3px #ddd;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0f766e;
      box-shadow: 0 5px #0a4f46;
    }
    textarea {
      resize: vertical;
    }

    /* Buttons */
    .btn {
      background: #0f766e;
      color: white;
      border: none;
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      box-shadow: 0 5px #0a4f46;
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px #0a4f46;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 3px #0a4f46;
    }

    /* Home Button */
    #homeBtn {
      margin-bottom: 20px;
    }

    /* Responsive for very small screens */
    @media (max-width: 360px) {
      .form-container {
        padding: 15px;
      }
      input, select, textarea, .btn {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

<div class="form-container">
  <!-- Home Button -->
  <button class="btn" id="homeBtn" onclick="goHome()">🏠 Home</button>

  <h2>Create Profile</h2>

  <input id="name" placeholder="Full Name" required>
  <input id="age" placeholder="Age" type="number" required>
  <input id="city" placeholder="City" required>
  <select id="gender">
    <option value="">Select Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
  </select>
  <input id="education" placeholder="Education">
  <input id="profession" placeholder="Profession">
  <input id="phone" placeholder="Phone Number" type="tel">
  <textarea id="bio" placeholder="Short Bio"></textarea>
  <input type="file" id="photo" accept="image/*">
  <button class="btn" onclick="saveProfile()">Submit Profile</button>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain:"zara-muslim-nikah.firebaseapp.com",
  databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId:"zara-muslim-nikah"
});

const auth=firebase.auth();
const db=firebase.database();

function goHome(){
  location="index.html";
}

// Check login
auth.onAuthStateChanged(user=>{
  if(!user){
    alert("Please login first!");
    location="index.html";
  }
});

async function saveProfile(){
  const user=auth.currentUser;
  if(!user){ alert("Login first"); return; }

  const nameVal=document.getElementById("name").value.trim();
  const ageVal=document.getElementById("age").value.trim();
  const cityVal=document.getElementById("city").value.trim();
  const genderVal=document.getElementById("gender").value;
  const educationVal=document.getElementById("education").value.trim();
  const professionVal=document.getElementById("profession").value.trim();
  const phoneVal=document.getElementById("phone").value.trim();
  const bioVal=document.getElementById("bio").value.trim();
  const file=document.getElementById("photo").files[0];

  if(!nameVal || !ageVal || !cityVal || !genderVal || !file){
    alert("Please fill all required fields and select a photo.");
    return;
  }

  try{
    const formData=new FormData();
    formData.append("file",file);
    formData.append("upload_preset","profiles");

    const res=await fetch("https://api.cloudinary.com/v1_1/dlsqxs7zl/image/upload",{method:"POST",body:formData});
    const data=await res.json();

    await db.ref("users/"+user.uid).set({
      name:nameVal,
      age:ageVal,
      city:cityVal,
      gender:genderVal,
      education:educationVal,
      profession:professionVal,
      phone:phoneVal,
      bio:bioVal,
      photo:data.secure_url,
      status:"pending",
      role:"user",
      createdAt: Date.now()
    });

    alert("Profile submitted successfully. Waiting for admin approval.");
    location="index.html"; 
  }catch(err){
    console.error(err);
    alert("Error uploading profile. Try again.");
  }
}
</script>

</body>
</html>
