<!DOCTYPE html>
<html>
<head>
<title>Admin Chat Panel</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

<h2>Admin Panel</h2>

<div id="users"></div>
<div id="chat"></div>

<input id="replyBox" placeholder="Reply...">
<button onclick="sendReply()">Send</button>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let currentUser = "";


// load users list
db.ref("messages").on("value", snap=>{
  let html="";

  snap.forEach(user=>{
    html += `<button onclick="openChat('${user.key}')">
      User: ${user.key}
    </button><br>`;
  });

  users.innerHTML = html;
});

function openChat(uid){
  currentUser = uid;

  db.ref("messages/"+uid).on("value", snap=>{
    let chat = "";

    snap.forEach(m=>{
      chat += `<p><b>${m.sender}:</b> ${m.name || m.text || ""}</p>`;
    });

    document.getElementById("chat").innerHTML = chat;
  });
}

function sendReply(){

  if(!currentUser) return;

  db.ref("messages/"+currentUser).push({
    text: replyBox.value,
    sender: "admin",
    time: Date.now()
  });

  replyBox.value="";
}

</script>

</body>
</html>
