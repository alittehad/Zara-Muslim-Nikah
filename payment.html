<!DOCTYPE html>
<html>
<head>
<title>Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const db = firebase.database();
const auth = firebase.auth();

const pid = new URLSearchParams(location.search).get("pid");
</script>

</head>

<body style="text-align:center;font-family:sans-serif;padding:20px">

<h2>💳 UPI Payment</h2>

<h3>UPI ID: zara@upi</h3>

<p>Pay ₹99 to continue</p>

<button onclick="paid()" style="
background:green;
color:white;
padding:12px;
border:none;
border-radius:8px;
font-size:16px;
">
I Have Paid
</button>

<script>
function paid(){
  const user = auth.currentUser;

  db.ref("interests/"+pid+"/"+user.uid+"/status")
  .set("paid");

  alert("Payment submitted!");

  window.location.href = "index.html";
}
</script>

</body>
</html>
