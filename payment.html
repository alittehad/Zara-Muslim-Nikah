<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Payment</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:20px;
}

/* BOX */
.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

button{
  background:#0f766e;
  color:white;
  border:none;
}

/* 🔥 PREVIEW FIX */
.preview{
  width:100%;
  height:160px;
  object-fit:cover;
  margin-top:10px;
  border-radius:10px;
  display:none;
  border:1px solid #ddd;
}

/* CARD */
.card{
  background:white;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* 🔥 IMAGE FIX (MAIN PROBLEM SOLVED) */
.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 Registration Payment</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="phone" placeholder="Phone">

<p>📷 Screenshot Upload</p>
<input type="file" id="file">

<!-- PREVIEW FIXED -->
<img id="preview" class="preview">

<button onclick="submit()">Send</button>

</div>

<div id="list"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* PREVIEW FIX */
document.getElementById("file").onchange = function(e){
  let file = e.target.files[0];

  if(!file) return;

  let reader = new FileReader();

  reader.onload = function(){
    let img = document.getElementById("preview");
    img.src = reader.result;
    img.style.display = "block";
  }

  reader.readAsDataURL(file);
};

/* IMGBB */
async function uploadImg(file){

  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72", {
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* SUBMIT */
async function submit(){

  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let phone = document.getElementById("phone").value;
  let file = document.getElementById("file").files[0];

  if(!name || !age || !phone || !file){
    alert("Fill all fields");
    return;
  }

  alert("Uploading...");

  let imgUrl = await uploadImg(file);

  db.ref("payments").push({
    name,
    age,
    phone,
    screenshot: imgUrl,
    status:"pending",
    time:Date.now()
  });

  alert("✔ Payment sent");
}

db.ref("payments").on("value", snap=>{

  let html="";

  snap.forEach(c=>{

    let d=c.val();

    html+=`
    <div class="card">
      <b>${d.name}</b><br>
      ${d.age} | ${d.phone}<br>

      <img src="${d.screenshot}">

      <p>Status: ${d.status}</p>
    </div>`;
  });

  document.getElementById("list").innerHTML=html;
});

</script>

</body>
</html>
