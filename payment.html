<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Payment</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:20px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  color:#0f766e;
}

.msg{
  background:#e0f2fe;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
  margin-bottom:10px;
}

.qr{
  text-align:center;
  margin:10px 0;
}

.qr img{
  width:200px;
  border-radius:10px;
  border:1px solid #ddd;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
}

.preview{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 रिश्ता रजिस्ट्रेशन</h2>

<!-- 🔥 HINDI MESSAGE -->
<div class="msg">
👉 रिश्ता करने के लिए Registration Fees भरना अनिवार्य है<br>
👉 Scan करें और Payment करें
</div>

<!-- QR -->
<div class="qr">
  <p><b>📸 QR को स्कैन करें</b></p>
  <img src="https://i.ibb.co/6RkksFjc/qr.png">
</div>

<!-- FORM -->
<input id="name" placeholder="नाम लिखें">
<input id="age" placeholder="उम्र लिखें">
<input id="phone" placeholder="मोबाइल नंबर">

<p><b>📷 Payment का Screenshot Upload करें</b></p>
<input type="file" id="image">

<img id="preview" class="preview" style="display:none;">

<button onclick="submitPayment()">📩 Send करें</button>

</div>

<script>
db.ref("payments").on("value", snap => {

  let html = "";

  snap.forEach(child => {

    let d = child.val();

    html += `
      <div class="card">

        <b>👤 Name:</b> ${d.name}<br>
        <b>📱 Phone:</b> ${d.phone}<br>

        <img src="${d.image}" style="width:100%;border-radius:8px;">

        <p>Status: ${d.status}</p>

        ${d.status === "approved" ? 
          `<p style="color:green;font-weight:bold">
            ${d.message || "आप registered हो गए हैं ✔️"}
          </p>` 
          : `<p style="color:orange">Waiting for approval...</p>`
        }

      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
});
</script>

</body>
</html>
