<!DOCTYPE html>
<html>
<head>
<title>Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  text-align:center;
  font-family:sans-serif;
  padding:20px;
  background:#f4f6f9;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  max-width:420px;
  margin:auto;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

button{
  background:green;
  color:white;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:16px;
  width:100%;
  cursor:pointer;
}
</style>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const db = firebase.database();
const auth = firebase.auth();

const pid = new URLSearchParams(location.search).get("profile");
</script>

</head>

<body>

<div class="card">

<h2>💳 UPI Payment</h2>

<!-- 🔥 Admin changeable UPI image -->
<img id="upiImg" src="https://i.ibb.co/fzQ1WgbN/upi.png">

<h3>UPI ID: zara@upi</h3>
<p>Pay ₹99 to continue</p>

<button onclick="paid()">I Have Paid</button>

</div>

<script>

/* 🔥 ADMIN UPI IMAGE CONTROL */
db.ref("settings/upiImage").on("value",snap=>{
  const img = snap.val();
  if(img){
    document.getElementById("upiImg").src = img;
  }
});

/* ✅ PAYMENT FUNCTION (FULL FIXED SYSTEM) */
function paid(){

  const user = auth.currentUser;

  if(!user){
    alert("Login required");
    return;
  }

  if(!pid){
    alert("Profile not found");
    return;
  }

  /* 🔥 1. ADMIN TRACKING (WHO → WHOM) */
  db.ref("payments").push({
    fromUid: user.uid,
    fromEmail: user.email || "",
    toProfile: pid,
    status: "paid",
    time: Date.now()
  });

  /* 🔥 2. LOCK INTEREST BUTTON UNTIL ADMIN DECISION */
  db.ref("interests/"+pid+"/"+user.uid).set({
    status: "waiting_admin",
    paid: true,
    time: Date.now()
  });

  alert("Payment submitted! Waiting admin approval");

  window.location.href = "index.html";
}

</script>

</body>
</html>
