<!DOCTYPE html>
<html>
<head>
<title>Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  text-align:center;
  font-family:sans-serif;
  padding:20px;
  background:#f4f6f9;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  max-width:420px;
  margin:auto;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

button{
  background:green;
  color:white;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:16px;
  width:100%;
  cursor:pointer;
  margin-top:10px;
}

/* 🔥 Download Button style */
.download-btn{
  background:#2563eb;
}
</style>
</head>

<body>

<div class="card">

<h2>💳 UPI Payment</h2>

<img id="upiImg" src="https://i.ibb.co/fzQ1WgbN/upi.png">

<h3>UPI ID: zara@upi</h3>
<p>Pay ₹99 to continue</p>

<!-- 🔥 DOWNLOAD BUTTON -->
<button class="download-btn" onclick="downloadQR()">⬇️ Download QR Code</button>

<!-- PAYMENT BUTTON -->
<button onclick="paid()">I Have Paid</button>

</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const db = firebase.database();
const auth = firebase.auth();

/* PROFILE ID */
let pid = new URLSearchParams(window.location.search).get("profile");

/* UPI IMAGE CONTROL */
db.ref("settings/upiImage").on("value",snap=>{
  const img = snap.val();
  if(img){
    document.getElementById("upiImg").src = img;
  }
});

/* 🔥 DOWNLOAD FUNCTION */
function downloadQR(){
  const img = document.getElementById("upiImg").src;

  const a = document.createElement("a");
  a.href = img;
  a.download = "upi-qr.png";
  a.click();
}

/* PAYMENT FUNCTION */
function paid(){

  const user = auth.currentUser;

  if(!user){
    alert("Login required");
    return;
  }

  db.ref("payments").push({
    fromUid: user.uid,
    fromEmail: user.email || "",
    toProfile: pid || "unknown",
    status: "paid",
    time: Date.now()
  });

  if(pid){
    db.ref("interests/"+pid+"/"+user.uid).set({
      status: "waiting_admin",
      paid: true,
      time: Date.now()
    });
  }

  alert("Payment submitted successfully ✔️");

  window.location.href = "chat.html";
}
</script>

</body>
</html>
