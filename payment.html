<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:15px;
}

.box{
  max-width:420px;
  margin:auto;
  background:#fff;
  padding:15px;
  border-radius:10px;
}

input,button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  background:#0f766e;
  color:white;
  border:none;
}

.card{
  background:#fff;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:8px;
}

.ok{color:green;font-weight:bold;}
.wait{color:orange;font-weight:bold;}
</style>
</head>

<body>

<div class="box">
<h3>💍 Registration Payment</h3>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="phone" placeholder="Phone">
<input type="file" id="file">

<button onclick="send()">Send Payment</button>
</div>

<div id="list"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const auth = firebase.auth();

/* IMG UPLOAD */
async function upload(file){
  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72", {
    method:"POST",
    body:form
  });

  let data = await res.json();
  return data.data.url;
}

/* SEND PAYMENT */
async function send(){

  let user = auth.currentUser;
  if(!user){
    alert("Login required");
    return;
  }

  let name = name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let phone = document.getElementById("phone").value;
  let file = document.getElementById("file").files[0];

  if(!name || !age || !phone || !file){
    alert("Fill all fields");
    return;
  }

  alert("Uploading...");

  let img = await upload(file);

  db.ref("payments").push({
    uid:user.uid,
    name,
    age,
    phone,
    screenshot:img,
    status:"pending"
  });

  alert("Sent ✔");
}

/* SHOW ONLY USER DATA */
auth.onAuthStateChanged(user=>{

  if(!user){
    document.getElementById("list").innerHTML = "<p>Login required</p>";
    return;
  }

  db.ref("payments").on("value",snap=>{

    let html="";

    snap.forEach(c=>{

      let d=c.val();

      if(d.uid !== user.uid) return;

      html += `
      <div class="card">
        <b>${d.name}</b><br>
        📱 ${d.phone}<br>

        <img src="${d.screenshot}">

        ${d.status === "approved"
          ? `<p class="ok">✔ आप registered हो गए हैं</p>`
          : `<p class="wait">⏳ Wait for approval</p>`
        }
      </div>`;
    });

    document.getElementById("list").innerHTML = html || "No data";
  });
});

</script>

</body>
</html>
