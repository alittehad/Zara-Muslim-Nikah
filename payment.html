<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Payment</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:20px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  color:#0f766e;
}

.msg{
  background:#e0f2fe;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
}

.card{
  background:white;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 रिश्ता रजिस्ट्रेशन</h2>

<div class="msg">
👉 Payment approve होने के बाद ही आप registered होंगे ✔️
</div>

<input id="name" placeholder="नाम">
<input id="age" placeholder="उम्र">
<input id="phone" placeholder="मोबाइल नंबर">
<input type="file" id="image">

<button onclick="submitPayment()">📩 Send करें</button>

</div>

<!-- RESULT AREA -->
<div id="list"></div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* SUBMIT */
function submitPayment(){

  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let phone = document.getElementById("phone").value;
  let file = document.getElementById("image").files[0];

  if(!name || !age || !phone || !file){
    alert("सब fill करें");
    return;
  }

  let reader = new FileReader();

  reader.onload = function(){

    db.ref("payments").push({
      name,
      age,
      phone,
      image: reader.result,
      status:"pending",
      time:Date.now()
    });

    alert("✔️ Payment भेज दिया गया");
  }

  reader.readAsDataURL(file);
}

/* SHOW DATA */
db.ref("payments").on("value", snap => {

  let html = "";

  snap.forEach(child => {

    let d = child.val();

    html += `
      <div class="card">

        <b>👤 Name:</b> ${d.name}<br>
        <b>📱 Phone:</b> ${d.phone}<br>

        <img src="${d.image}">

        <p>Status: <b>${d.status}</b></p>

        ${d.status === "approved" 
          ? `<p style="color:green;font-weight:bold">✔ आप registered हो गए हैं</p>`
          : `<p style="color:orange">Waiting for approval...</p>`
        }

      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;

});

</script>

</body>
</html>
