<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Page</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:20px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
}

.preview{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 Rishta Payment</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="phone" placeholder="Phone">

<input type="file" id="image">

<img id="preview" class="preview" style="display:none;">

<button onclick="submitPayment()">Send Request 💖</button>

</div>

<script>

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* PREVIEW IMAGE */
document.getElementById("image").onchange = function(e){
  let file = e.target.files[0];
  let reader = new FileReader();

  reader.onload = function(){
    document.getElementById("preview").src = reader.result;
    document.getElementById("preview").style.display = "block";
  }

  reader.readAsDataURL(file);
};

/* UPLOAD TO IMGBB */
async function uploadToImgBB(file){

  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72", {
    method: "POST",
    body: form
  });

  let data = await res.json();

  return data.data.url;
}

/* SUBMIT */
async function submitPayment(){

  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let phone = document.getElementById("phone").value;
  let file = document.getElementById("image").files[0];

  if(!name || !age || !phone || !file){
    alert("All fields required");
    return;
  }

  alert("Uploading image...");

  let imageUrl = await uploadToImgBB(file);

  db.ref("payments").push({
    name,
    age,
    phone,
    image: imageUrl,
    status: "pending",
    time: Date.now()
  });

  alert("Payment Sent ✔️ (Waiting Approval)");

  window.location = "index.html";
}

</script>

</body>
</html>
