<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Rishta Kare</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:20px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  color:#0f766e;
}

.info{
  background:#e0f2fe;
  padding:12px;
  border-radius:8px;
  text-align:center;
  margin-bottom:15px;
  font-weight:bold;
}

.qr{
  text-align:center;
  margin:10px 0;
}

.qr img{
  width:220px;
  border-radius:10px;
  border:1px solid #ddd;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>💍 Rishta Payment</h2>

<div class="info">
UPI ID: <b>zara@upi</b><br>
Amount: ₹500 Registration Fee
</div>

<!-- 🔥 QR SCANNER IMAGE -->
<div class="qr">
  <p><b>Scan & Pay</b></p>
  <img src="https://i.ibb.co/6RkksFjc/qr.png" alt="QR Code">
</div>

<input type="text" id="name" placeholder="Your Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="file" id="screenshot">

<button onclick="submitPayment()">Submit Payment</button>

</div>

<script>

/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* GET PROFILE ID */
const params = new URLSearchParams(window.location.search);
const profileId = params.get("id");

/* SUBMIT PAYMENT */
function submitPayment(){

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const file = document.getElementById("screenshot").files[0];

  if(!name || !phone || !file){
    alert("All fields required");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(){

    db.ref("payments").push({
      name,
      phone,
      profileId: profileId || "none",
      screenshot: reader.result,
      status: "pending",
      time: Date.now()
    });

    alert("Payment Submitted ✔️ (Waiting Approval)");

    window.location = "index.html";
  }

  reader.readAsDataURL(file);
}

</script>

</body>
</html>
