<script>

let editId = null; // ✅ FIX

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com/",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* SAVE / UPDATE */
async function save(){

  const name = document.getElementById("name").value;
  const age = document.getElementById("age").value;
  const city = document.getElementById("city").value;
  const desc = document.getElementById("desc").value;
  const photo = document.getElementById("photo").files[0];

  if(!name || !age || !city || !desc){
    alert("Fill all fields");
    return;
  }

  let photoURL = "";

  if(photo){
    // 🔥 ImgBB upload
    let formData = new FormData();
    formData.append("image", photo);

    let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72", {
      method: "POST",
      body: formData
    });

    let data = await res.json();
    photoURL = data.data.url;
  }

  let profile = {
    name,
    age,
    city,
    desc,
    photo: photoURL,
    time: Date.now()
  };

  if(editId){
    await db.ref("profiles/" + editId).update(profile);
    alert("Updated ✔️");
    editId = null;
  }else{
    await db.ref("profiles").push(profile);
    alert("Added ✔️");
  }

  window.location.reload();
}

/* LOAD DATA */
function load(){

  db.ref("profiles").on("value", snap=>{

    let html = "";

    snap.forEach(child=>{
      let p = child.val();
      let id = child.key;

      html += `
      <div style="background:#fff;margin:10px;padding:10px;border-radius:10px;">
        <img src="${p.photo}" style="width:100%;height:150px;object-fit:cover">
        <h3>${p.name}</h3>
        <p>${p.city}</p>

        <button onclick="edit('${id}','${p.name}','${p.age}','${p.city}','${p.desc}')">
          Edit
        </button>

        <button onclick="del('${id}')">
          Delete
        </button>
      </div>
      `;
    });

    document.body.innerHTML += html;
  });
}

/* EDIT */
function edit(id,name,age,city,desc){
  editId = id;

  document.getElementById("name").value = name;
  document.getElementById("age").value = age;
  document.getElementById("city").value = city;
  document.getElementById("desc").value = desc;
}

/* DELETE */
function del(id){
  if(confirm("Delete?")){
    db.ref("profiles/" + id).remove();
  }
}

load();

</script>
