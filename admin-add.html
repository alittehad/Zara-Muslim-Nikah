<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Add Profile</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:20px;
}

.box{
  max-width:420px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

img{
  width:100%;
  border-radius:10px;
  margin-top:10px;
}

.loader{
  display:none;
  text-align:center;
  margin-top:10px;
  font-weight:bold;
  color:#0f766e;
}
</style>
</head>

<body>

<div class="box">
<h2>👑 Admin Add Profile</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="city" placeholder="City">
<textarea id="desc" placeholder="Description"></textarea>

<input type="file" id="photo" onchange="previewImage()">

<img id="preview" style="display:none;">

<div class="loader" id="loader">Uploading...</div>

<button onclick="saveProfile()">Save Profile</button>
</div>

<script>

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 🔍 IMAGE PREVIEW */
function previewImage(){
  const file = document.getElementById("photo").files[0];
  const img = document.getElementById("preview");

  if(file){
    img.src = URL.createObjectURL(file);
    img.style.display = "block";
  }
}

/* 🚀 SAVE PROFILE */
async function saveProfile(){

  const name = document.getElementById("name").value.trim();
  const age  = document.getElementById("age").value.trim();
  const city = document.getElementById("city").value.trim();
  const desc = document.getElementById("desc").value.trim();
  const file = document.getElementById("photo").files[0];

  if(!name || !age || !city || !desc || !file){
    alert("All fields required");
    return;
  }

  document.getElementById("loader").style.display = "block";

  try{

    const reader = new FileReader();

    reader.onloadend = async function(){

      const base64 = reader.result.split(',')[1];

      /* 🔥 Upload to ImgBB */
      const formData = new FormData();
      formData.append("key", "368731d88d58b4fa0bdd5abdd2c47f72");
      formData.append("image", base64);

      const res = await fetch("https://api.imgbb.com/1/upload", {
        method: "POST",
        body: formData
      });

      const data = await res.json();

      if(!data.success){
        alert("Image upload failed");
        return;
      }

      const imageUrl = data.data.url;

      /* 🔥 Save to Firebase */
      await db.ref("profiles").push({
        name,
        age,
        city,
        description: desc,
        photo: imageUrl,
        status: "pending",
        time: Date.now()
      });

      alert("Profile Added ✔️ (Pending Approval)");

      window.location = "admin.html";
    };

    reader.readAsDataURL(file);

  }catch(err){
    console.log(err);
    alert("Error: " + err.message);
  }
}

</script>

</body>
</html>
