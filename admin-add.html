<!DOCTYPE html>
<html>
<head>
<title>Admin Add Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>
body{font-family:sans-serif;background:#f4f6f9;padding:15px;}
.box{max-width:500px;margin:auto;background:white;padding:20px;border-radius:12px;}
input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px;}
button{width:100%;padding:12px;background:#0f766e;color:white;border:none;border-radius:8px;}
</style>
</head>

<body>

<div class="box">
<h2>👑 Admin Add Profile</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="city" placeholder="City">
<textarea id="desc" placeholder="Description"></textarea>

<input type="file" id="photo">
<button onclick="addProfile()">Add Profile</button>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

// ⚠️ IMPORTANT: DON'T INIT storage HERE
let storage;   // lazy init

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="login.html";
    return;
  }

  const ADMIN_EMAIL = "ngogrant454@gmail.com";

  if((user.email||"").toLowerCase() !== ADMIN_EMAIL){
    alert("Only admin allowed");
    window.location.href="index.html";
  }

  // ✅ SAFE INIT HERE (AFTER FIREBASE FULL READY)
  storage = firebase.storage();
});

async function addProfile(){

  const name = document.getElementById("name").value;
  const age = document.getElementById("age").value;
  const city = document.getElementById("city").value;
  const desc = document.getElementById("desc").value;
  const file = document.getElementById("photo").files[0];

  if(!storage){
    alert("Storage not ready, please wait...");
    return;
  }

  if(!name || !age || !city || !file){
    alert("All fields required");
    return;
  }

  try{

    const ref = storage.ref("profiles/" + Date.now() + "_" + file.name);

    await ref.put(file);

    const url = await ref.getDownloadURL();

    await db.ref("profiles").push({
      name,
      age,
      city,
      description: desc,
      photo: url,
      time: Date.now()
    });

    alert("Profile Added ✔️");

  }catch(err){
    console.log(err);
    alert("Error: " + err.message);
  }
}

</script>

</body>
</html>
