<!DOCTYPE html>
<html>
<head>
<title>Admin Add Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:15px;
}

.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>👑 Admin - Add Profile</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="city" placeholder="City">
<input type="file" id="photo">

<button onclick="addProfile()">Add Profile</button>

</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  storageBucket: "zara-muslim-nikah.appspot.com"
});

const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* 🔥 SECURITY CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="login.html";
    return;
  }

  if((user.email||"").toLowerCase() !== ADMIN_EMAIL){
    alert("Only admin allowed");
    window.location.href="index.html";
  }
});

async function addProfile(){

  const file = document.getElementById("photo").files[0];

  if(!file){
    alert("Photo required");
    return;
  }

  const name = document.getElementById("name").value;
  const age = document.getElementById("age").value;
  const city = document.getElementById("city").value;

  try{

    const ref = storage.ref("profiles/"+Date.now()+"_"+file.name);

    await ref.put(file);

    const url = await ref.getDownloadURL();

    await db.ref("profiles").push({
      name: name,
      age: age,
      city: city,
      photo: url,
      time: Date.now()
    });

    alert("Profile Added ✔️");

    location.reload();

  }catch(err){
    alert("Error: "+err.message);
  }
}
</script>

</body>
</html>
