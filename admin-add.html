<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{font-family:sans-serif;background:#f4f6f9;padding:20px;}
.card{
  background:white;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}
img{width:100%;height:200px;object-fit:cover;}
button{margin:5px;padding:8px 12px;border:none;border-radius:6px;color:white;}
.approve{background:green;}
.delete{background:red;}
.edit{background:blue;}
</style>
</head>

<body>

<h2>👑 Admin Panel</h2>

<div id="list"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

function load(){

  db.ref("profiles").on("value",snap=>{
    let html="";

    snap.forEach(child=>{
      let d = child.val();

      html+=`
      <div class="card">
        <img src="${d.photo}">
        <h3>${d.name}</h3>
        <p>${d.city}</p>
        <p>Status: ${d.status}</p>

        <button class="approve" onclick="approve('${child.key}')">Approve</button>
        <button class="edit" onclick="edit('${child.key}')">Edit</button>
        <button class="delete" onclick="del('${child.key}')">Delete</button>
      </div>`;
    });

    document.getElementById("list").innerHTML = html;
  });

}

load();

/* APPROVE */
function approve(id){
  db.ref("profiles/"+id).update({status:"approved"});
}

/* DELETE */
function del(id){
  if(confirm("Delete?")){
    db.ref("profiles/"+id).remove();
  }
}

/* EDIT */
function edit(id){

  let name = prompt("New Name");
  let city = prompt("New City");

  if(name && city){
    db.ref("profiles/"+id).update({name,city});
  }
}

</script>

</body>
</html>
