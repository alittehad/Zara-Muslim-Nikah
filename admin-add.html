<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",

};

firebase.initializeApp(firebaseConfig);

// ✅ DIRECT INIT (FIXED)
const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();   // 🔥 FIX HERE

const ADMIN_EMAIL = "ngogrant454@gmail.com";

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="login.html";
    return;
  }

  if((user.email||"").toLowerCase() !== ADMIN_EMAIL){
    alert("Only admin allowed");
    window.location.href="index.html";
  }
});

async function addProfile(){

  const name = document.getElementById("name").value.trim();
  const age = document.getElementById("age").value.trim();
  const city = document.getElementById("city").value.trim();
  const desc = document.getElementById("desc").value.trim();
  const file = document.getElementById("photo").files[0];

  if(!name || !age || !city || !file){
    alert("All fields required");
    return;
  }

  try{

    const ref = storage.ref("profiles/" + Date.now() + "_" + file.name);

    await ref.put(file);

    const url = await ref.getDownloadURL();

    await db.ref("profiles").push({
      name,
      age,
      city,
      description: desc,
      photo: url,
      time: Date.now()
    });

    alert("Profile Added ✔️");

    // clear form
    document.getElementById("name").value="";
    document.getElementById("age").value="";
    document.getElementById("city").value="";
    document.getElementById("desc").value="";
    document.getElementById("photo").value="";

  }catch(err){
    console.log(err);
    alert("Upload failed: " + err.message);
  }
}

</script>
