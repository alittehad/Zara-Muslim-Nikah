<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:#f4f6f9;
  margin:0;
}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.homeBtn{background:#111;color:white;}
.logoutBtn{background:#dc2626;color:white;}
.addBtn{background:#16a34a;color:white;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:20px;
}

.card{
  background:white;
  padding:10px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
  <div>👑 Admin Panel (No Login)</div>

  <div>
    <button class="addBtn" onclick="goAdd()">➕ Admin Add</button>
    <button class="homeBtn" onclick="goHome()">🏠 Home</button>
  </div>
</header>

<div class="grid" id="list"></div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnxk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const db = firebase.database();

/* LOAD DATA */
function loadData(){
  db.ref("users").on("value", snap=>{
    let html = "";

    snap.forEach(child=>{
      let d = child.val();

      html += `
      <div class="card">
        <img src="${d.photo || ''}">
        <h3>${d.name || '-'}</h3>
        <p>${d.city || '-'}</p>
      </div>`;
    });

    document.getElementById("list").innerHTML = html;
  });
}

/* NAV */
function goAdd(){
  window.location = "admin-add.html";
}

function goHome(){
  window.location = "index.html";
}

/* START */
loadData();

</script>

</body>
</html>
