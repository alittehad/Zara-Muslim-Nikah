<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#e5ddd5;}

header{background:#075e54;color:#fff;padding:15px;}

#box{height:75vh;overflow:auto;padding:10px;}

.msg{
  padding:10px;
  margin:5px;
  border-radius:10px;
  max-width:70%;
}

.me{background:#dcf8c6;margin-left:auto;}
.other{background:#fff;}

.input{
  display:flex;
  padding:10px;
  background:#fff;
}

input{flex:1;padding:10px;border:1px solid #ccc;border-radius:5px;}
button{padding:10px;background:#075e54;color:#fff;border:none;margin-left:5px;}
</style>
</head>

<body>

<header>💬 Chat <span id="status"></span></header>

<div id="box"></div>

<div class="input">
  <input id="msg">
  <button onclick="send()">Send</button>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let chatId = new URLSearchParams(location.search).get("id");

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="login.html";
  }else{
    load(user.email);
  }
});

/* LOAD MESSAGES */
function load(email){

  db.ref("messages/"+chatId).on("value",snap=>{
    let html="";

    snap.forEach(m=>{
      let d = m.val();

      html+=`<div class="msg ${d.sender===email?'me':'other'}">${d.text||''}</div>`;
    });

    document.getElementById("box").innerHTML=html;
    document.getElementById("box").scrollTop=document.getElementById("box").scrollHeight;
  });

  // reset unread
  db.ref("chats/"+chatId+"/unread/"+email).set(0);
}

/* SEND */
function send(){

  let text=document.getElementById("msg").value;
  if(text==="") return;

  let user=auth.currentUser.email;

  db.ref("messages/"+chatId).push({
    text,
    sender:user,
    time:Date.now()
  });

  db.ref("chats/"+chatId).update({
    lastMessage:text
  });

  document.getElementById("msg").value="";
}

</script>

</body>
</html>
