<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#ece5dd;
}

/* HEADER */
header{
  background:#075e54;
  color:white;
  padding:15px;
  font-weight:bold;
  font-size:18px;
}

/* CHAT BOX */
#chatBox{
  height:78vh;
  overflow-y:auto;
  padding:10px;
}

/* MESSAGE */
.msg{
  padding:10px;
  margin:6px;
  border-radius:10px;
  max-width:70%;
  word-wrap:break-word;
}

.me{
  background:#dcf8c6;
  margin-left:auto;
}

.other{
  background:white;
}

/* INPUT */
.inputBox{
  display:flex;
  padding:10px;
  background:white;
}

input{
  flex:1;
  padding:10px;
  border:1px solid #ccc;
  border-radius:5px;
}

button{
  padding:10px 15px;
  background:#075e54;
  color:white;
  border:none;
  margin-left:5px;
  border-radius:5px;
}
</style>
</head>

<body>

<header>💬 Live Chat</header>

<div id="chatBox"></div>

<div class="inputBox">
  <input id="msg" placeholder="Type message">
  <button onclick="send()">Send</button>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com",
  messagingSenderId: "690336186269",
  appId: "1:690336186269:web:8215c1d313c4273c1f7974"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* CHAT ID FROM URL */
let chatId = new URLSearchParams(location.search).get("id");

if(!chatId){
  chatId = "global_chat";
}

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="login.html";
  }else{
    loadMessages(user.email);
  }
});

/* LOAD MESSAGES */
function loadMessages(email){

  db.ref("messages/"+chatId).on("value",snap=>{
    let html="";

    snap.forEach(m=>{
      let msg = m.val();

      html += `
        <div class="msg ${msg.sender===email?'me':'other'}">
          ${msg.text}
        </div>
      `;
    });

    document.getElementById("chatBox").innerHTML = html;
    document.getElementById("chatBox").scrollTop =
      document.getElementById("chatBox").scrollHeight;
  });
}

/* SEND MESSAGE */
function send(){

  let text = document.getElementById("msg").value;
  if(text==="") return;

  let user = auth.currentUser.email;

  // save message
  db.ref("messages/"+chatId).push({
    text:text,
    sender:user,
    time:Date.now()
  });

  // update chat info (IMPORTANT for inbox)
  db.ref("chats/"+chatId).update({
    lastMessage:text,
    updatedAt:Date.now(),
    user:user
  });

  document.getElementById("msg").value="";
}

</script>

</body>
</html>
