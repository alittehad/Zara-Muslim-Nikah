<!DOCTYPE html>
<html>
<head>
<title>Payment Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  background:#f4f6f9;
}

.box{
  text-align:center;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  max-width:400px;
  width:90%;
}

h2{
  font-size:20px;
  margin-bottom:10px;
}

p{
  font-size:14px;
  color:#555;
  margin-bottom:20px;
}

button{
  width:100%;
  padding:14px;
  background:#25D366;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>💳 Payment Done?</h2>

<p>
If you have completed payment,<br>
click below button and send details on WhatsApp.<br><br>

यदि आपने पेमेंट कर दिया है तो नीचे बटन दबाकर SCREEN SHOT भेजें।
</p>

<button onclick="openWhatsApp()">SCREEN SHOT भेजें</button>

</div>

<script>
function openWhatsApp(){

  let number = "7378342192";

  let message =
`Hello,
I have done payment.
I want to continue chat.`;

  let url = "https://wa.me/" + number + "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}
</script>

</body>
</html>
