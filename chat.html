<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#e5e7eb;}

header{
  background:#0ea5e9;
  color:white;
  padding:12px;
}

.chatBox{height:85vh;overflow:auto;padding:10px;}

.msg{
  padding:8px;
  margin:5px;
  max-width:70%;
  border-radius:10px;
}

.me{background:#0ea5e9;color:white;margin-left:auto;}
.other{background:white;}

.input{
  display:flex;
  padding:10px;
  background:white;
}

input{flex:1;padding:10px;}
button{padding:10px;}

.typing{
  font-size:12px;
  color:gray;
  padding:5px;
}
</style>
</head>

<body>

<header id="head">Chat</header>

<div class="typing" id="typing"></div>

<div class="chatBox" id="box"></div>

<div class="input">
  <input id="text" oninput="typing()">
  <button onclick="send()">Send</button>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let me, other;

const uid = new URLSearchParams(location.search).get("uid");

auth.onAuthStateChanged(user=>{
  if(!user) location="login.html";
  me=user;
  other=uid;
  load();
  setOnline(true);
});

/* ONLINE STATUS */
function setOnline(status){
  db.ref("users/"+me.uid).update({
    online:status
  });
}

/* TYPING */
function typing(){
  db.ref("users/"+me.uid).update({typing:true});
  setTimeout(()=>db.ref("users/"+me.uid).update({typing:false}),1000);
}

/* SEND */
function send(){
  let text=document.getElementById("text").value;

  let msg={
    from:me.uid,
    to:other,
    text:text,
    seen:false,
    time:Date.now()
  };

  db.ref("messages").push(msg);
  document.getElementById("text").value="";
}

/* LOAD CHAT */
db.ref("messages").on("value",snap=>{
  let html="";
  snap.forEach(m=>{
    let d=m.val();
    if((d.from==me.uid && d.to==other) || (d.from==other && d.to==me.uid)){

      html+=`
      <div class="msg ${d.from==me.uid?'me':'other'}">
        ${d.text}
        ${d.seen && d.from==me.uid ? "✔✔" : "✔"}
      </div>`;
    }
  });

  document.getElementById("box").innerHTML=html;
});

/* SEEN UPDATE */
db.ref("messages").on("value",snap=>{
  snap.forEach(m=>{
    let d=m.val();
    if(d.to==me.uid){
      db.ref("messages/"+m.key).update({seen:true});
    }
  });
});

</script>

</body>
</html>
