<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f0f2f5;}
header{background:#075e54;color:#fff;padding:15px;text-align:center;font-size:20px;font-weight:bold;}

.item{
  background:#fff;
  margin:10px;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.name{font-weight:bold;}
.last{font-size:12px;color:gray;}
.dot{background:red;color:white;padding:2px 6px;border-radius:50%;font-size:11px;margin-left:5px;}
</style>
</head>

<body>

<header>💬 Messages</header>
<div id="list"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN = "ngogrant454@gmail.com";

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="login.html";
  }else{
    loadChats(user.email);
  }
});

function loadChats(email){

  db.ref("chats").on("value",snap=>{
    let html="";

    snap.forEach(c=>{
      let d = c.val();

      if(email===ADMIN || d.user===email){

        html+=`
        <div class="item" onclick="openChat('${c.key}')">
          <div class="name">
            ${d.user}
            ${d.unread && d.unread[email] ? `<span class="dot">${d.unread[email]}</span>` : ""}
          </div>
          <div class="last">${d.lastMessage||""}</div>
        </div>`;
      }

    });

    document.getElementById("list").innerHTML=html;
  });
}

function openChat(id){
  window.location="chat.html?id="+id;
}

</script>

</body>
</html>
