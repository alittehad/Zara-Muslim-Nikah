<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f0f2f5;
}

header{
  background:#075e54;
  color:white;
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

.chat-list{
  padding:10px;
}

.chat-item{
  background:white;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  cursor:pointer;
}

.chat-item:hover{
  background:#e6f7ff;
}

.name{
  font-weight:bold;
}

.last{
  font-size:12px;
  color:gray;
}
</style>
</head>

<body>

<header>💬 Messages</header>

<div class="chat-list" id="list"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN = "ngogrant454@gmail.com";

/* CHECK LOGIN */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="login.html";
  }else{
    loadChats(user.email);
  }
});

/* LOAD CHAT LIST */
function loadChats(email){

  db.ref("chats").on("value",snap=>{
    let html="";

    snap.forEach(c=>{

      let data = c.val();

      // show only relevant chats
      if(email===ADMIN || data.user===email || data.admin===email){

        html+=`
        <div class="chat-item" onclick="openChat('${c.key}')">
          <div class="name">${data.user}</div>
          <div class="last">${data.lastMessage || "No message yet"}</div>
        </div>`;
      }

    });

    document.getElementById("list").innerHTML = html;
  });
}

function openChat(id){
  window.location="chat.html?id="+id;
}

</script>

</body>
</html>
