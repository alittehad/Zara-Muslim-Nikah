<!DOCTYPE html>
<html>
<head>
<title>User Message</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

<h2>User Message Form</h2>

<input id="name" placeholder="Name"><br>
<input id="age" placeholder="Age"><br>
<input id="address" placeholder="Address"><br>
<input id="whatsapp" placeholder="WhatsApp No"><br>
<input id="income" placeholder="Income"><br>

<button onclick="send()">Send to Admin</button>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

function send(){

  if(!auth.currentUser){
    alert("Login required");
    window.location="login.html";
    return;
  }

  let uid = auth.currentUser.uid;

  db.ref("messages/"+uid).push({
    name: name.value,
    age: age.value,
    address: address.value,
    whatsapp: whatsapp.value,
    income: income.value,
    sender: "user",
    time: Date.now()
  });

  alert("Sent to Admin");
}

</script>

</body>
</html>
