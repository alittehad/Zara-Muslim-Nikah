<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f0f2f5;
}

/* HEADER */
header{
  background:#075e54;
  color:white;
  padding:15px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

/* CHAT LIST */
.list{
  padding:10px;
}

/* CHAT ITEM */
.item{
  background:white;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  cursor:pointer;
  transition:0.2s;
}

.item:hover{
  transform:scale(1.02);
  background:#e8f5e9;
}

/* NAME */
.name{
  font-weight:bold;
  font-size:15px;
}

/* LAST MSG */
.last{
  font-size:12px;
  color:gray;
  margin-top:3px;
}

/* RED DOT */
.dot{
  float:right;
  background:red;
  color:white;
  font-size:12px;
  padding:3px 7px;
  border-radius:50%;
}
</style>
</head>

<body>

<header>💬 Messages</header>

<div class="list" id="list"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com",
  messagingSenderId: "690336186269",
  appId: "1:690336186269:web:8215c1d313c4273c1f7974"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN = "ngogrant454@gmail.com";

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location="login.html";
  }else{
    loadChats(user.email);
  }
});

/* LOAD CHAT LIST */
function loadChats(email){

  db.ref("chats").on("value",snap=>{
    let html="";

    snap.forEach(c=>{
      let data = c.val();

      // show only relevant chats
      if(email===ADMIN || data.user===email){

        html+=`
        <div class="item" onclick="openChat('${c.key}')">

          <div class="name">
            ${data.user || "User"}
            
            ${data.unread && data.unread[email] > 0
              ? `<span class="dot">${data.unread[email]}</span>`
              : ""
            }
          </div>

          <div class="last">
            ${data.lastMessage || "No messages yet"}
          </div>

        </div>`;
      }
    });

    document.getElementById("list").innerHTML = html;
  });
}

/* OPEN CHAT */
function openChat(id){
  window.location="chat.html?id="+id;
}

</script>

</body>
</html>
