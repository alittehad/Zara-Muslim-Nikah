<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  color: white;
  text-align: center;
  padding: 18px 12px;
  font-weight: 900;
  font-size: 26px;
  letter-spacing: 2px;
  position: sticky;
  top: 0;
  z-index: 1000;
  text-shadow:
    1px 1px 0 #064e46,
    2px 2px 0 #064e46,
    3px 3px 0 #03332f,
    4px 4px 6px rgba(0,0,0,0.35);
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:8px;
  padding:10px;
  flex-wrap:wrap;
  background:white;
}

select, input[type="range"]{
  padding:6px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

/* CARD */
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  cursor:pointer;
  border:2px solid #d1d5db;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.03);
}

/* MODAL */
.modal{
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: flex-start;
  background: rgba(0,0,0,0.6);
  z-index: 9999;
  overflow-y: auto;
  padding: 20px 10px;
}

.modal-content{
  background: #fff;
  width: 90%;
  max-width: 600px;
  margin: 30px auto;
  border-radius: 12px;
  padding: 20px;
}

</style>
</head>

<body>

<header>Zara Nikah Service</header>

<!-- FILTER -->
<div class="topbar">

  <select id="genderFilter">
    <option value="">Gender</option>
    <option>Male</option>
    <option>Female</option>
  </select>

  <select id="cityFilter"></select>
  <select id="religionFilter"></select>
  <select id="educationFilter"></select>

  <input type="range" min="18" max="60" value="60" id="ageFilter">
  <span id="ageText">Age: 60</span>

</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let allProfiles = [];
const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(user){
    loadProfiles();
  }else{
    document.getElementById("grid").innerHTML = "Login Required";
  }
});

/* LOAD */
function loadProfiles(){
  db.ref("profiles").on("value",snap=>{
    allProfiles = [];

    snap.forEach(child=>{
      let d = child.val();
      d.id = child.key;
      allProfiles.push(d);
    });

    renderProfiles(allProfiles);
  });
}

/* RENDER */
function renderProfiles(list){
  let html = "";
  list.forEach(d=>{
    html += `
    <div class="card" onclick="openModal('${d.id}')">
      <img src="${d.photo}" style="width:100%;height:200px;object-fit:cover;">
      <div style="padding:10px;">
        <h3>${d.name}</h3>
        <p>${d.city}</p>
      </div>
    </div>`;
  });
  document.getElementById("grid").innerHTML = html;
}

/* MODAL */
function openModal(id){
  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();
    document.getElementById("modalBody").innerHTML =
      `<h2>${d.name}</h2><p>${d.city}</p>`;
    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
