<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background: linear-gradient(135deg, #38bdf8, #0ea5e9, #e0f2fe);
  color: white;
  text-align: center;
  padding: 10px;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo{
  font-weight: 900;
  font-size: 22px;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
}

.marquee{
  overflow:hidden;
  white-space:nowrap;
  margin-top:5px;
}

#scrollText{
  display:inline-block;
  padding-left:100%;
  animation:scroll 12s linear infinite;
  font-weight:bold;
  color:#003049;
}

@keyframes scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

/* BUTTON */
.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.add{background:#1d4ed8;}
.admin{background:#111;}

/* ADMIN BUTTON BOX */
#adminText{
  margin-top:5px;
  display:none;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  border:2px solid #d1d5db;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.03);
  border:2px solid #14b8a6;
  box-shadow:0 10px 25px rgba(20,184,166,0.35);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

.like{background:#16a34a;}
.edit{background:#1d4ed8;}
.delete{background:#dc2626;}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  z-index:9999;
  padding:15px;
}

.modal-content{
  background:white;
  width:92%;
  max-width:500px;
  padding:18px;
  border-radius:12px;
  max-height:85vh;
  overflow-y:auto;
}
</style>
</head>

<body>

<header>

  <div class="logo">🕋 Zara Nikah Service 🕌</div>

  <div class="marquee">
    <div id="scrollText">
      💍 Nikah Service | Best Muslim Profiles | Trusted Matching | 24x7 Support 💍
    </div>
  </div>

  <!-- ADMIN BUTTONS AREA -->
  <div id="adminText"></div>

</header>

<div class="topbar">
  <button class="btn add" onclick="goAdd()">प्रोफ़ाइल जोड़ें</button>

  <button class="btn admin" id="adminPanelBtn" style="display:none" onclick="goAdmin()">
    👑 Admin Panel
  </button>

  <button class="btn admin" id="adminAddBtn" style="display:none" onclick="goAdminAdd()">
    ➕ Admin Add
  </button>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

let isAdmin = false;

auth.onAuthStateChanged(user=>{
  if(user){

    isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL;

    if(isAdmin){
      document.getElementById("adminPanelBtn").style.display="inline-block";
      document.getElementById("adminAddBtn").style.display="inline-block";

      // ✅ BUTTONS (NO TEXT)
      document.getElementById("adminText").style.display="block";
      document.getElementById("adminText").innerHTML = `
        <button onclick="goAdd()" style="
          background:#16a34a;
          color:white;
          padding:8px 12px;
          border:none;
          border-radius:8px;
          margin-right:6px;
          cursor:pointer;
          font-weight:bold;
        ">✏ Add Profile</button>

        <button onclick="deleteMode()" style="
          background:#dc2626;
          color:white;
          padding:8px 12px;
          border:none;
          border-radius:8px;
          cursor:pointer;
          font-weight:bold;
        ">🗑 Delete Mode</button>
      `;
    }

    loadProfiles();

  }else{
    document.getElementById("grid").innerHTML = "<p style='text-align:center'>Login Required</p>";
  }
});

function deleteMode(){
  alert("Delete mode ON");
}

function loadProfiles(){

  db.ref("profiles").on("value",snap=>{

    let html="";

    snap.forEach(child=>{
      let d = child.val();

      html+=`
      <div class="card">
        <img src="${d.photo}" onclick="openModal('${child.key}')">

        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>

          <button class="like" onclick="goPayment()">💍 रिश्ता करें</button>

          ${isAdmin ? `
            <button class="edit" onclick="editProfile('${child.key}')">✏ Edit</button>
            <button class="delete" onclick="deleteProfile('${child.key}')">🗑 Delete</button>
          ` : ""}

        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

function goPayment(){ window.location="payment.html"; }

function deleteProfile(id){
  if(confirm("Delete profile?")){
    db.ref("profiles/"+id).remove();
  }
}

function editProfile(id){
  window.location="admin-add.html?id="+id;
}

function openModal(id){
  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();

    document.getElementById("modalBody").innerHTML = `
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%;border-radius:10px;">
      <p>${d.city}</p>
      <p>${d.bio}</p>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function goAdd(){ window.location="profile-submit.html"; }
function goAdmin(){ window.location="admin.html"; }
function goAdminAdd(){ window.location="admin-add.html"; }

</script>

</body>
</html>
