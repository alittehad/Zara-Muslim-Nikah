<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f9;}
header{background:linear-gradient(135deg,#38bdf8,#0ea5e9,#e0f2fe);color:white;text-align:center;padding:16px;font-weight:900;font-size:24px;position:sticky;top:0;}
.topbar{display:flex;justify-content:center;gap:10px;padding:10px;flex-wrap:wrap;}
.btn{padding:10px 16px;border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer;}
.add{background:#1d4ed8;}
.logout{background:#dc2626;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;padding:15px;}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.card img{width:100%;height:250px;object-fit:contain;cursor:pointer;}
.card-body{text-align:center;padding:10px;}
.like{background:#16a34a;}
.modal{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,0.6);}
.modal-content{background:white;width:92%;max-width:500px;padding:18px;border-radius:12px;}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar">
  <button class="btn add" onclick="login()">🔐 Login with Google</button>
  <button class="btn logout" onclick="logout()">🚪 Logout</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

/* 🔥 Firebase CONFIG (FIXED) */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com",
  messagingSenderId: "690336186269",
  appId: "1:690336186269:web:8215c1d313c4273c1f7974"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* ======================
   LOGIN
====================== */
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .catch(err => alert(err.message));
}

/* ======================
   LOGOUT
====================== */
function logout(){
  auth.signOut();
}

/* ======================
   AUTH STATE
====================== */
let userLoggedIn = null;

auth.onAuthStateChanged(user => {
  userLoggedIn = user;
});

/* ======================
   LOAD PROFILES
====================== */
loadProfiles();

function loadProfiles(){

  db.ref("profiles").on("value", snap => {

    let html = "";

    snap.forEach(child => {
      let d = child.val();

      html += `
      <div class="card">

        <img src="${d.photo}" onclick="checkLogin('${child.key}')">

        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>

          <button class="like" onclick="checkLogin('${child.key}')">
            💍 रिश्ता करें
          </button>

        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* ======================
   LOGIN CHECK (MAIN FIX)
====================== */
function checkLogin(id){

  if(!userLoggedIn){
    alert("Please login first");
    return;
  }

  openModal(id);
}

/* ======================
   MODAL
====================== */
function openModal(id){

  db.ref("profiles/"+id).once("value").then(snap => {

    let d = snap.val();

    document.getElementById("modalBody").innerHTML = `
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%;border-radius:10px;">
      <p>${d.city}</p>
      <p>${d.bio || ''}</p>
    `;

    document.getElementById("modal").style.display = "flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
