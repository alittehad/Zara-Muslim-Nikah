<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

header{
  background:linear-gradient(135deg,#38bdf8,#0ea5e9,#0369a1);
  color:white;
  text-align:center;
  padding:16px;
  font-weight:900;
  font-size:24px;
  position:sticky;
  top:0;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.add{background:#1d4ed8;}
.admin{background:#111;}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  padding:15px;
}

@media(max-width:768px){
  .grid{grid-template-columns:1fr;}
}

.card{
  border-radius:18px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.card img{
  width:100%;
  height:260px;
  object-fit:contain;
  background:#f8fafc;
  padding:8px;
}

.card-body{
  text-align:center;
  padding:14px;
}

.like{
  margin-top:10px;
  width:90%;
  background:linear-gradient(180deg,#22c55e,#16a34a);
  color:white;
  border:none;
  padding:12px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

/* delete button */
.delete-btn{
  margin-top:10px;
  width:90%;
  background:#dc2626;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* modal */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  display:none;
  justify-content:center;
  align-items:flex-start;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:600px;
  padding:15px;
  border-radius:15px;
  margin-top:30px;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar">
  <button class="btn add" onclick="goAdd()">प्रोफ़ाइल जोड़ें</button>
  <button class="btn admin" id="adminPanelBtn" style="display:none" onclick="goAdmin()">👑 Admin</button>
</div>

<div class="grid" id="grid"></div>

<!-- modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnxk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com",
  messagingSenderId: "690336186269",
  appId: "1:690336186269:web:8215c1d313c4273c1f7974"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let isAdmin = false;

/* 🔥 SESSION FIX */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* AUTH CHECK */
auth.onAuthStateChanged(user => {

  isAdmin = user && (user.email || "").toLowerCase() === ADMIN_EMAIL;

  document.getElementById("adminPanelBtn").style.display =
    isAdmin ? "inline-block" : "none";

  loadProfiles();
});

/* LOAD PROFILES */
function loadProfiles(){
  db.ref("profiles").on("value", snap => {

    let html = "";

    snap.forEach(child => {
      let d = child.val();

      html += `
      <div class="card">

        <img src="${d.photo}" onclick="requireLogin('modal','${child.key}')">

        <div class="card-body">

          <h3>${d.name}</h3>
          <p>${d.city}</p>

          <button class="like" onclick="requireLogin('payment')">
            💍 रिश्ता करें
          </button>

          ${isAdmin ? `
            <button class="delete-btn"
              onclick="deleteProfile('${child.key}')">
              🗑 Delete
            </button>
          ` : ""}

        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* LOGIN SAFE CHECK */
function requireLogin(type,id){

  const user = auth.currentUser;

  if(!user){
    const unsub = auth.onAuthStateChanged(u=>{
      unsub();
      if(!u){
        window.location="login.html";
      }else{
        handleAction(type,id);
      }
    });
    return;
  }

  handleAction(type,id);
}

function handleAction(type,id){

  if(type==="payment"){
    window.location="payment.html";
  }

  if(type==="modal"){
    openModal(id);
  }
}

/* MODAL */
function openModal(id){
  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();

    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%;border-radius:10px;">
      <p><b>City:</b> ${d.city}</p>
      <p>${d.bio || ""}</p>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* NAV */
function goAdd(){
  if(!auth.currentUser){
    window.location="login.html";
    return;
  }
  window.location="profile-submit.html";
}

function goAdmin(){
  window.location="admin.html";
}

/* DELETE */
function deleteProfile(id){
  if(confirm("Delete this profile?")){
    db.ref("profiles/"+id).remove();
  }
}

</script>

</body>
</html>
