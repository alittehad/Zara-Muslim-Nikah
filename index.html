<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

header{
  background:linear-gradient(90deg,#0f766e,#14b8a6);
  color:white;
  text-align:center;
  padding:14px;
  font-weight:900;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,0.2);
}

.btn:active{
  transform:translateY(3px);
}

.admin{background:#000;}
.add{background:#1d4ed8;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar">
  <button class="btn admin" onclick="goAdmin()">👑 Admin Add</button>
</div>

<div class="grid" id="grid"></div>

<script>

/* LOAD DATA */
function load(){
  let data = JSON.parse(localStorage.getItem("profiles") || "[]");

  let html="";

  data.forEach(p=>{
    html+=`
    <div class="card">
      <img src="${p.photo}">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p>Age: ${p.age}</p>
        <p>City: ${p.city}</p>
        <p>${p.desc}</p>
      </div>
    </div>`;
  });

  document.getElementById("grid").innerHTML = html;
}

load();

function goAdmin(){
  window.location="admin-add.html";
}

</script>

</body>
</html>
