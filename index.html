<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f9;}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.section{padding:15px;}

.card{
  background:white;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.btn{
  padding:7px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin:3px;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
</style>
</head>

<body>

<header>
  <h3>🔥 Admin Dashboard</h3>
  <button onclick="logout()">Logout</button>
</header>

<div class="section">
<h2>❤️ Interest Requests (Live)</h2>
<div id="box"></div>
</div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user || user.email !== ADMIN_EMAIL){
    location="index.html";
  } else {
    listenInterests();
  }
});

/* 🔥 REALTIME LISTENER (OPTIMIZED) */
function listenInterests(){

  db.ref("interests").on("value",snap=>{

    let html = "";

    snap.forEach(profile=>{

      const pid = profile.key;

      profile.forEach(userSnap=>{

        const uid = userSnap.key;
        const d = userSnap.val();

        const status = d.status || "pending";

        let btn = "";

        // 🔴 PENDING → APPROVE BUTTON
        if(status === "pending"){
          btn = `<button class="btn approve" onclick="setStatus('${pid}','${uid}','approved')">Approve</button>`;
        }

        // 🟢 APPROVED → REJECT BUTTON
        if(status === "approved"){
          btn = `<button class="btn reject" onclick="setStatus('${pid}','${uid}','rejected')">Reject</button>`;
        }

        // ❌ REJECTED → REMOVE FROM UI
        if(status === "rejected") return;

        html += `
        <div class="card">
          <b>Profile:</b> ${pid}<br>
          <b>User:</b> ${uid}<br>
          <b>Status:</b> ${status}<br>
          ${btn}
        </div>
        `;
      });
    });

    document.getElementById("box").innerHTML = html;
  });
}

/* 🔥 UPDATE STATUS */
function setStatus(pid,uid,status){
  db.ref("interests/"+pid+"/"+uid).update({
    status:status,
    time:Date.now()
  });
}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location="index.html");
}

</script>

</body>
</html>
