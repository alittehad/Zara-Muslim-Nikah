<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background:linear-gradient(90deg,#0f766e,#14b8a6);
  color:white;
  text-align:center;
  padding:14px;
  font-weight:900;
}

/* TOP BAR */
.topbar{
  display:none;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.topbar button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#adminBtn{background:#000;}
#logoutBtn{background:#dc2626;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
  padding:15px;
}

/* CARD */
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  cursor:pointer;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  padding:10px;
}

.modal-content{
  background:white;
  width:100%;
  max-width:400px;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar" id="topbar">
  <button id="adminBtn" style="display:none">Admin</button>
  <button id="logoutBtn" onclick="logout()">Logout</button>
</div>

<div class="grid" id="profileGrid"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

let currentUser = null;

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  currentUser = user;

  if(!user){
    window.location.href="login.html";
    return;
  }

  document.getElementById("topbar").style.display="flex";

  if((user.email||"").toLowerCase()===ADMIN_EMAIL){
    document.getElementById("adminBtn").style.display="inline-block";
  }

  loadPosts();
});

/* LOAD PROFILES */
function loadPosts(){
  db.ref("users").once("value").then(snap=>{
    const grid = document.getElementById("profileGrid");
    grid.innerHTML="";

    snap.forEach(child=>{
      const d = child.val();

      if(d && d.status==="approved"){
        grid.innerHTML += `
        <div class="card" onclick="openModal('${child.key}')">
          <img src="${d.photo || ''}">
          <div class="card-body">
            <h3>${d.name || ''}</h3>
            <p>${d.city || ''}</p>
          </div>
        </div>`;
      }
    });
  });
}

/* OPEN PROFILE */
function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d = snap.val();

    document.getElementById("modalBody").innerHTML = `
      <img src="${d.photo}" style="width:100%;border-radius:10px;">
      <h2>${d.name}</h2>
      <p><b>Age:</b> ${d.age}</p>
      <p><b>City:</b> ${d.city}</p>

      <button onclick="goPayment('${id}')"
      style="
        width:100%;
        padding:12px;
        margin-top:10px;
        border:none;
        border-radius:8px;
        background:#e11d48;
        color:white;
        font-weight:bold;
        cursor:pointer;
      ">
        ❤️ Rishta Pasand Hai
      </button>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

/* PAYMENT PAGE */
function goPayment(id){
  window.location.href = "payment.html?id=" + id;
}

/* CLOSE MODAL */
function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>{
    window.location.href="login.html";
  });
}

</script>

</body>
</html>
