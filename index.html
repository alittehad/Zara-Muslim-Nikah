<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f9;}
header{background:#0f766e;color:white;padding:15px;text-align:center;}
.topbar{display:flex;justify-content:center;gap:10px;padding:10px;}
.topbar button{padding:10px;border:none;border-radius:6px;color:white;cursor:pointer;}
#loginBtn{background:#0f766e;}
#adminBtn{background:black;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;padding:15px;}
.card{background:white;border-radius:10px;overflow:hidden;cursor:pointer;}
.card img{width:100%;height:200px;object-fit:cover;}
.card-body{text-align:center;padding:10px;}
</style>
</head>

<body>

<header>🌙 Zara Nikah Service ⭐</header>

<div class="topbar">
  <button id="loginBtn" onclick="handleAuth()">Login</button>
  <button id="adminBtn" onclick="goAdmin()" style="display:none">Admin Panel</button>
</div>

<div class="grid" id="profileGrid"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let user = null;

// Login
function handleAuth(){
  if(user){ auth.signOut(); }
  else{
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider);
  }
}

// Auth Check
auth.onAuthStateChanged(u=>{
  user = u;
  loginBtn.innerText = user ? "Logout" : "Login";

  if(user && user.email === "ngogrant454@gmail.com"){
    adminBtn.style.display="inline-block";
  } else {
    adminBtn.style.display="none";
  }

  loadPosts();
});

// Load Profiles
function loadPosts(){
  db.ref("profiles").on("value",snap=>{
    profileGrid.innerHTML="";
    snap.forEach(child=>{
      const p = child.val();
      profileGrid.innerHTML += `
        <div class="card">
          <img src="${p.photo}">
          <div class="card-body">
            <h3>${p.name}</h3>
            <p>${p.city}</p>
          </div>
        </div>`;
    });
  });
}

// Go Admin
function goAdmin(){
  window.location.href="admin.html";
}
</script>

</body>
</html>
