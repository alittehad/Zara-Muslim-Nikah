<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background: linear-gradient(135deg, #38bdf8, #0ea5e9, #e0f2fe);
  color: white;
  text-align: center;
  padding: 16px 12px;

  font-weight: 900;
  font-size: 24px;
  letter-spacing: 2px;

  position: sticky;
  top: 0;
  z-index: 1000;

  text-shadow:
    1px 1px 0 #0b3d3a,
    2px 2px 0 #0b3d3a,
    3px 3px 0 #062b29,
    4px 4px 6px rgba(0,0,0,0.25);

  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  border-bottom: 2px solid rgba(255,255,255,0.3);
}

/* SCROLL TEXT */
.marquee{
  background: linear-gradient(90deg,#0ea5e9,#38bdf8,#0ea5e9);
  color:white;
  font-weight:bold;
  padding:6px 0;
  overflow:hidden;
  white-space:nowrap;
}

.marquee span{
  display:inline-block;
  padding-left:100%;
  animation:scrollText 12s linear infinite;
}

@keyframes scrollText{
  0% { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.add{background:#1d4ed8;}
.admin{background:#111;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  cursor:pointer;
  border:2px solid #d1d5db;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.03);
  border:2px solid #14b8a6;
  box-shadow:0 10px 25px rgba(20,184,166,0.35);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

/* MODAL FIX (MAIN ISSUE FIXED) */
.modal{
  position: fixed;
  inset: 0;
  display: none;

  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,0.65);
  z-index: 9999;

  padding: 20px;
}

.modal-content{
  background: white;
  width: 95%;
  max-width: 500px;

  border-radius: 12px;
  padding: 15px;

  /* ⭐ FIX HERE (NO CUT ANYMORE) */
  max-height: 90vh;
  overflow-y: auto;

  box-shadow: 0 10px 30px rgba(0,0,0,0.3);

  display:flex;
  flex-direction:column;
}

.modal-content img{
  width:100%;
  height:auto;
  border-radius:10px;
  margin-bottom:10px;
}

.close-btn{
  align-self:flex-end;
  cursor:pointer;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="marquee">
  <span>💍 Welcome to Zara Nikah Service | Safe Marriage Platform | Verified Profiles | Trusted Rishta Service 💍</span>
</div>

<div class="topbar">
  <button class="btn add" onclick="goAdd()">प्रोफ़ाइल जोड़ें</button>
  <button class="btn admin" id="adminPanelBtn" style="display:none" onclick="goAdmin()">👑 Admin Panel</button>
  <button class="btn admin" id="adminAddBtn" style="display:none" onclick="goAdminAdd()">➕ Admin Add</button>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="close-btn" onclick="closeModal()">✖</div>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let isAdmin = false;

auth.onAuthStateChanged(user=>{
  if(user){
    isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL;

    if(isAdmin){
      document.getElementById("adminPanelBtn").style.display="inline-block";
      document.getElementById("adminAddBtn").style.display="inline-block";
    }

    loadProfiles();
  } else {
    document.getElementById("grid").innerHTML="<p style='text-align:center'>Login Required</p>";
  }
});

function loadProfiles(){
  db.ref("profiles").on("value",snap=>{
    let html="";
    snap.forEach(child=>{
      let d=child.val();

      html+=`
      <div class="card">
        <img src="${d.photo}" onclick="openModal('${child.key}')">

        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>

          <button class="like" onclick="goPayment()">💍 रिश्ता करें</button>

          ${isAdmin ? `
            <button class="edit" onclick="editProfile('${child.key}')">✏ Edit</button>
            <button class="delete" onclick="deleteProfile('${child.key}')">🗑 Delete</button>
          ` : ""}
        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML=html;
  });
}

function goPayment(){ window.location="payment.html"; }
function deleteProfile(id){ if(confirm("Delete?")) db.ref("profiles/"+id).remove(); }
function editProfile(id){ window.location="admin-add.html?id="+id; }

function openModal(id){
  db.ref("profiles/"+id).once("value").then(snap=>{
    let d=snap.val();

    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}">
      <p><b>City:</b> ${d.city}</p>
      <p><b>Phone:</b> ${d.phone || ''}</p>
      <p><b>Bio:</b> ${d.bio || ''}</p>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function goAdd(){ window.location="profile-submit.html"; }
function goAdmin(){ window.location="admin.html"; }
function goAdminAdd(){ window.location="admin-add.html"; }

</script>

</body>
</html>
