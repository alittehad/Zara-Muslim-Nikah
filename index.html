<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#f4f6f9;
}

header{
  width:100%;
  background: linear-gradient(90deg, #0f766e, #14b8a6);
  color:white;
  text-align:center;
  font-size:22px;
  font-weight:900;
  padding:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  transition:0.3s;
}
.card:hover{transform:translateY(-4px);}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:10px;
  width:90%;
  max-width:420px;
}

/* BUTTON */
.interest{
  background:#e11d48;
  color:white;
  padding:10px;
  border:none;
  border-radius:8px;
  width:100%;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}
.interest:hover{
  background:#be123c;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="grid" id="profileGrid"></div>

<!-- MODAL -->
<div class="modal" id="profileModal" onclick="closeModal(event)">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

// Firebase init
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;

/* LOGIN SAFE */
auth.onAuthStateChanged(user=>{
  currentUser = user || null;
  loadPosts();
});

/* LOAD PROFILES */
function loadPosts(){
  db.ref("users").once("value").then(snap=>{
    const grid = document.getElementById("profileGrid");
    grid.innerHTML = "";

    snap.forEach(child=>{
      const d = child.val() || {};

      if(d.status === "approved"){
        grid.innerHTML += `
        <div class="card" onclick="openModal('${child.key}')">
          <img src="${d.photo || 'https://via.placeholder.com/300'}">
          <div class="card-body">
            <h3>${d.name || 'Unknown'}</h3>
            <p>${d.city || '-'}</p>
          </div>
        </div>`;
      }
    });
  });
}

/* OPEN MODAL */
function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d = snap.val() || {};

    document.getElementById("modalBody").innerHTML = `
      <img src="${d.photo || 'https://via.placeholder.com/300'}"
           style="width:100%;border-radius:10px">
      <h2>${d.name || ''}</h2>
      <p>City: ${d.city || ''}</p>
      <p>Age: ${d.age || ''}</p>

      <button class="interest" onclick="goPayment('${id}')">
        ❤️ Send Interest & Pay
      </button>
    `;

    document.getElementById("profileModal").style.display = "flex";
  });
}

/* PAYMENT REDIRECT */
function goPayment(id){
  if(!currentUser){
    alert("Please login first");
    return;
  }

  window.location.href = "payment.html?profile=" + id;
}

/* CLOSE MODAL FIX */
function closeModal(e){
  if(!e || e.target.id === "profileModal"){
    document.getElementById("profileModal").style.display = "none";
  }
}

</script>

</body>
</html>
