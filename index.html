<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background: linear-gradient(135deg, #38bdf8, #0ea5e9, #e0f2fe);
  color: white;
  text-align: center;
  padding: 16px 12px;

  font-weight: 900;
  font-size: 24px;
  letter-spacing: 2px;

  position: sticky;
  top: 0;
  z-index: 1000;

  text-shadow:
    1px 1px 0 #0b3d3a,
    2px 2px 0 #0b3d3a,
    3px 3px 0 #062b29,
    4px 4px 6px rgba(0,0,0,0.25);

  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  border-bottom: 2px solid rgba(255,255,255,0.3);
}

/* SCROLL TEXT */
.marquee{
  background: linear-gradient(90deg,#0ea5e9,#38bdf8,#0ea5e9);
  color:white;
  font-weight:bold;
  padding:6px 0;
  overflow:hidden;
  white-space:nowrap;
}

.marquee span{
  display:inline-block;
  padding-left:100%;
  animation:scrollText 12s linear infinite;
}

@keyframes scrollText{
  0% { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  cursor:pointer;
  border:2px solid #d1d5db;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.03);
  border:2px solid #14b8a6;
  box-shadow:0 10px 25px rgba(20,184,166,0.35);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

.like{background:#16a34a;}
.edit{background:#1d4ed8;}
.delete{background:#dc2626;}

/* MODAL */
.modal{
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.6);
  z-index: 9999;
  padding: 15px;
}

.modal-content{
  background: white;
  width: 92%;
  max-width: 500px;
  padding: 18px;
  border-radius: 12px;
  max-height: 85vh;
  overflow-y: auto;
}

/* POPUP AD */
#popupAd{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:85%;
  max-width:350px;
  background:white;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  display:none;
  z-index:99999;
  overflow:hidden;
}

#popupAd img{
  width:100%;
  cursor:pointer;
}

#popupAd span{
  position:absolute;
  top:5px;
  right:10px;
  font-size:22px;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="marquee">
  <span>💍 Welcome to Zara Nikah Service | Best Islamic Marriage Platform | Admin Approved Profiles 💍</span>
</div>

<div class="grid" id="grid"></div>

<!-- POPUP -->
<div id="popupAd">
  <span onclick="closePopup()">✖</span>
  <img id="popupImg" onclick="openPopupLink()">
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* PROFILE LOAD */
auth.onAuthStateChanged(user=>{
  if(user){
    loadProfiles();
    loadPopup();
  }
});

function loadProfiles(){
  db.ref("profiles").on("value",snap=>{
    let html="";
    snap.forEach(child=>{
      let d=child.val();

      html+=`
      <div class="card">
        <img src="${d.photo}">
        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>
          <button class="like">💍 रिश्ता करें</button>
        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML=html;
  });
}

/* POPUP SYSTEM */
let popupLink="";

function loadPopup(){
  db.ref("popup").on("value",snap=>{
    let d=snap.val();
    if(d){
      document.getElementById("popupImg").src=d.image||"";
      popupLink=d.link||"";
    }
  });
}

function showPopup(){
  document.getElementById("popupAd").style.display="block";
  setTimeout(()=>closePopup(),5000);
}

function closePopup(){
  document.getElementById("popupAd").style.display="none";
}

function openPopupLink(){
  if(popupLink){
    window.open(popupLink,"_blank");
  }
}

/* 30 sec popup */
setInterval(()=>{
  showPopup();
},30000);

</script>

</body>
</html>
