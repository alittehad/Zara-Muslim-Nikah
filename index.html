<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- 🔥 BUTTON CSS -->
<link rel="stylesheet" href="buttons.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f9;}

header{
  background:linear-gradient(90deg,#0f766e,#14b8a6);
  color:white;
  text-align:center;
  padding:14px;
  font-weight:900;
}

.topbar{
  display:none;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:400px;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar" id="topbar">
  <button class="btn btn-home" onclick="location.reload()">Home</button>
  <button class="btn btn-add" onclick="goAdd()">रिश्ता जोड़ें</button>
  <button class="btn btn-admin" id="adminBtn" style="display:none" onclick="goAdmin()">Admin Panel</button>
  <button class="btn btn-logout" onclick="logout()">Logout</button>
</div>

<div class="grid" id="profileGrid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

let currentUser = null;
let currentProfileId = null;

/* 🔥 LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="login.html";
    return;
  }

  currentUser = user;
  document.getElementById("topbar").style.display="flex";

  // ADMIN CHECK
  if((user.email || "").toLowerCase() === ADMIN_EMAIL){
    document.getElementById("adminBtn").style.display="inline-block";
  }

  loadProfiles();
});

/* 🔥 LOAD PROFILES */
function loadProfiles(){
  db.ref("profiles").once("value").then(snap=>{
    const grid = document.getElementById("profileGrid");
    grid.innerHTML = "";

    if(!snap.exists()){
      grid.innerHTML = "<p style='text-align:center;'>No profiles available</p>";
      return;
    }

    snap.forEach(child=>{
      const d = child.val();

      if(!d) return;

      grid.innerHTML += `
      <div class="card" onclick="openModal('${child.key}')">
        <img src="${d.photo || 'https://via.placeholder.com/300'}">
        <div class="card-body">
          <h3>${d.name || 'No Name'}</h3>
          <p>${d.city || ''}</p>
        </div>
      </div>`;
    });
  });
}

/* 🔥 OPEN PROFILE */
function openModal(id){
  currentProfileId = id;

  db.ref("profiles/"+id).once("value").then(snap=>{
    const d = snap.val();

    if(!d){
      alert("Profile not found");
      return;
    }

    document.getElementById("modalBody").innerHTML = `
      <h2>${d.name || ''}</h2>
      <img src="${d.photo || ''}" style="width:100%;border-radius:10px;">
      <p><b>Age:</b> ${d.age || ''}</p>
      <p><b>City:</b> ${d.city || ''}</p>

      <button class="btn btn-like" onclick="goPayment()">❤️ रिश्ता पसंद है</button>
    `;

    document.getElementById("modal").style.display = "flex";
  });
}

/* 🔥 GO PAYMENT (FIXED) */
function goPayment(){
  if(!currentProfileId){
    alert("No profile selected");
    return;
  }

  window.location.href = "payment.html?profile=" + currentProfileId;
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

function logout(){
  auth.signOut();
}

function goAdd(){
  window.location = "profile-submit.html";
}

function goAdmin(){
  window.location = "admin-add.html";
}

</script>

</body>
</html>
