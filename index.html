<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f9;}

header{
  background:linear-gradient(90deg,#0f766e,#14b8a6);
  color:white;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-btns{display:flex;gap:10px;}

.btn{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.my{background:#111;}
.logout{background:#dc2626;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{text-align:center;padding:10px;}

.like{background:#16a34a;}
</style>
</head>

<body>

<header>
  <div>🕋 Zara Nikah Service 🕌</div>

  <div class="header-btns">
    <button class="btn my" onclick="goMyProfile()">👤 My Profile</button>
    <button class="btn logout" onclick="logout()">🚪 Logout</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<script>

/* Firebase */
firebase.initializeApp({
  apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain:"zara-muslim-nikah.firebaseapp.com",
  databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

let profileRef = null;

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{

  if(!user){
    // IMPORTANT: replace → back नहीं आएगा
    window.location.replace("index.html");
    return;
  }

  loadProfiles();
});

/* LOAD DATA */
function loadProfiles(){

  // 🔥 OLD LISTENER REMOVE
  if(profileRef){
    profileRef.off();
  }

  profileRef = db.ref("profiles");

  profileRef.on("value",snap=>{

    let html="";

    snap.forEach(child=>{
      let d = child.val();

      html+=`
      <div class="card">
        <img src="${d.photo || 'https://via.placeholder.com/300'}">

        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>

          <button class="btn like">💍 रिश्ता करें</button>
        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* NAVIGATION */
function goMyProfile(){
  window.location = "my-profile.html";
}

/* ✅ FINAL LOGOUT FIX */
function logout(){

  // 🔥 STEP 1: listener बंद
  if(profileRef){
    profileRef.off();
  }

  // 🔥 STEP 2: auth observer बंद
  auth.onAuthStateChanged(()=>{}); 

  // 🔥 STEP 3: signout
  auth.signOut().then(()=>{

    // 🔥 STEP 4: redirect without reload loop
    setTimeout(()=>{
      window.location.replace("index.html");
    },300);

  }).catch(err=>{
    alert("Logout error");
    console.log(err);
  });
}

</script>

</body>
</html>
