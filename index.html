<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>

body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

header{
  background:linear-gradient(135deg,#38bdf8,#0ea5e9,#0369a1);
  color:white;
  text-align:center;
  padding:16px;
  font-weight:900;
  font-size:24px;
  position:sticky;
  top:0;
  z-index:1000;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.add{background:#1d4ed8;}
.admin{background:#111;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:250px;
  object-fit:contain;
  background:#eee;
}

.card-body{
  text-align:center;
  padding:10px;
}

.like{
  background:#22c55e;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* ========================= */
/* 🔥 FLOATING CHAT BUTTON FIXED */
/* ========================= */

.chat-btn{
  position:fixed;
  right:20px;
  bottom:25px;

  width:65px;
  height:65px;

  border:none;
  border-radius:50%;

  background:linear-gradient(135deg,#0ea5e9,#0369a1);
  color:white;
  font-size:26px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 8px 0 #075985,
    0 15px 25px rgba(0,0,0,0.3);

  z-index:9999;

  animation:pulse 2s infinite;
  transition:0.2s ease;
}

.chat-btn:hover{
  transform:scale(1.1);
}

.chat-btn:active{
  transform:scale(0.95);
  box-shadow:
    0 3px 0 #075985,
    0 8px 15px rgba(0,0,0,0.2);
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:500px;
  padding:15px;
  border-radius:10px;
}

</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar">
  <button class="btn add" onclick="goAdd()">प्रोफ़ाइल जोड़ें</button>
  <button class="btn admin" id="adminPanelBtn" style="display:none" onclick="goAdmin()">👑 Admin</button>
</div>

<!-- ✅ FLOATING CHAT BUTTON -->
<button class="chat-btn" onclick="openChat()">💬</button>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com",
  messagingSenderId: "690336186269",
  appId: "1:690336186269:web:8215c1d313c4273c1f7974"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let isAdmin = false;

loadProfiles();

auth.onAuthStateChanged(user=>{
  if(user){
    isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL;
    if(isAdmin){
      document.getElementById("adminPanelBtn").style.display="inline-block";
    }
  } else {
    isAdmin = false;
  }
});

function loadProfiles(){
  db.ref("profiles").on("value",snap=>{
    let html="";
    snap.forEach(child=>{
      let d = child.val();

      html+=`
      <div class="card">
        <img src="${d.photo}" onclick="requireLogin('modal','${child.key}')">
        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>
          <button class="like" onclick="requireLogin('payment')">💍 रिश्ता करें</button>
        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

function requireLogin(type,id){
  if(!auth.currentUser){
    window.location="login.html";
    return;
  }

  if(type==="payment"){
    window.location="payment.html";
  }

  if(type==="modal"){
    openModal(id);
  }
}

function openModal(id){
  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();

    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%;border-radius:10px;">
      <p>${d.city}</p>
      <p>${d.bio}</p>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function goAdd(){
  if(!auth.currentUser){
    window.location="login.html";
    return;
  }
  window.location="profile-submit.html";
}

function goAdmin(){
  window.location="admin.html";
}

/* ✅ CHAT FIXED SAFE */
function openChat(){
  if(!auth.currentUser){
    window.location="login.html";
    return;
  }
  window.location="profile-submit.html";
}

</script>

</body>
</html>
