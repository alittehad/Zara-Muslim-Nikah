<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

header{
  background: linear-gradient(135deg, #38bdf8, #0ea5e9, #e0f2fe);
  color: white;
  text-align: center;
  padding: 16px 12px;
  font-weight: 900;
  font-size: 24px;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.add{background:#1d4ed8;}
.admin{background:#111;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  border:2px solid #ddd;
  transition:0.3s;
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

.like{
  background:#16a34a;
  padding:6px 10px;
  border:none;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:500px;
  padding:15px;
  border-radius:12px;
}

</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar">

  <!-- ✔ ALWAYS ALLOWED -->
  <button class="btn add" onclick="goAdd()">➕ Profile जोड़ें</button>

  <button class="btn admin" onclick="goLogin()">🔑 Login</button>

  <button class="btn admin" onclick="goPayment()">💍 Payment</button>

</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnx2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let currentUser = null;
let isAdmin = false;

/* 🔥 NO LOGIN REDIRECT (IMPORTANT FIX) */
auth.onAuthStateChanged(user=>{
  currentUser = user;

  if(user){
    isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL;
  } else {
    isAdmin = false;
  }

  loadProfiles();
});

/* 🚀 LOGIN PAGE OPEN (YOUR REQUIREMENT) */
function goLogin(){
  window.location.href = "login.html";
}

/* 🔒 REQUIRE LOGIN ON CLICK */
function requireLogin(action){
  if(!currentUser){
    goLogin();
    return;
  }
  action();
}

/* LOAD PROFILES */
function loadProfiles(){

  db.ref("profiles").on("value",snap=>{

    let html="";

    snap.forEach(child=>{
      let d = child.val();

      html+=`
      <div class="card">

        <img src="${d.photo}" onclick="requireLogin(()=>openModal('${child.key}'))">

        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>

          <button class="like" onclick="requireLogin(goPayment)">
            💍 रिश्ता करें
          </button>

          ${isAdmin ? `
            <button onclick="editProfile('${child.key}')">✏ Edit</button>
            <button onclick="deleteProfile('${child.key}')">🗑 Delete</button>
          ` : ""}

        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* ACTIONS */
function goPayment(){ window.location="payment.html"; }
function goAdd(){ window.location="profile-submit.html"; }
function editProfile(id){ window.location="admin-add.html?id="+id; }

function deleteProfile(id){
  if(confirm("Delete?")){
    db.ref("profiles/"+id).remove();
  }
}

/* MODAL */
function openModal(id){

  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();

    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%">
      <p>${d.city}</p>
      <p>${d.phone}</p>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
