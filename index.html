<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>

body{margin:0;font-family:sans-serif;background:#f4f6f9;}
header{...}
.topbar{...}
.grid{...}

/* 👇 यहाँ paste करो */
.chat-btn{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  padding:15px 25px;
  font-size:18px;
  font-weight:bold;

  border:none;
  border-radius:12px;

  background:linear-gradient(135deg,#0ea5e9,#0369a1);
  color:white;
  cursor:pointer;

  box-shadow:
    0 6px 0 #075985,
    0 15px 25px rgba(0,0,0,0.25);

  transition:0.2s;
}

.chat-btn:hover{
  transform:translate(-50%,-50%) scale(1.05);
}

.chat-btn:active{
  transform:translate(-50%,-50%) scale(0.95);
  box-shadow:
    0 3px 0 #075985,
    0 8px 15px rgba(0,0,0,0.2);
}

</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar">
  <button class="btn add" onclick="goAdd()">प्रोफ़ाइल जोड़ें</button>
  <button class="btn admin" id="adminPanelBtn" style="display:none" onclick="goAdmin()">👑 Admin</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com",
  messagingSenderId: "690336186269",
  appId: "1:690336186269:web:8215c1d313c4273c1f7974"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let isAdmin = false;

/* LOAD PROFILES ALWAYS */
loadProfiles();

/* AUTH ONLY FOR ADMIN UI */
auth.onAuthStateChanged(user=>{
  if(user){
    isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL;

    if(isAdmin){
      document.getElementById("adminPanelBtn").style.display="inline-block";
    }
  } else {
    isAdmin = false;
  }
});

/* LOAD DATA */
function loadProfiles(){
  db.ref("profiles").on("value",snap=>{
    let html="";

    snap.forEach(child=>{
      let d = child.val();

      html+=`
      <div class="card">

        <img src="${d.photo}" onclick="requireLogin('modal','${child.key}')">

        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>

          <button class="like" onclick="requireLogin('payment')">💍 रिश्ता करें</button>

          ${isAdmin ? `
            <button class="edit" onclick="editProfile('${child.key}')">✏ Edit</button>
            <button class="delete" onclick="deleteProfile('${child.key}')">🗑 Delete</button>
          ` : ""}

        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* 🔐 LOGIN CHECK ON CLICK */
function requireLogin(type,id){

  if(!auth.currentUser){
    window.location="login.html";
    return;
  }

  if(type==="payment"){
    window.location="payment.html";
  }

  if(type==="modal"){
    openModal(id);
  }
}

/* MODAL */
function openModal(id){
  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();

    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%;border-radius:10px;">
      <p>${d.city}</p>
      <p>${d.bio}</p>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* NAV */
function goAdd(){
  if(!auth.currentUser){
    window.location="login.html";
    return;
  }
  window.location="profile-submit.html";
}

function goAdmin(){
  window.location="admin.html";
}

function editProfile(id){
  window.location="admin-add.html?id="+id;
}

function deleteProfile(id){
  db.ref("profiles/"+id).remove();
}



function openChat(){
  window.location="chat.html";
}



  
</script>

</body>
</html>
