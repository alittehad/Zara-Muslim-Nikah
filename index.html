<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background:linear-gradient(90deg,#0f766e,#14b8a6);
  color:white;
  text-align:center;
  padding:14px;
  font-weight:900;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

/* 3D BUTTON */
.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,0.25);
  transition:0.2s;
}

.btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 rgba(0,0,0,0.25);
}

.add{background:#1d4ed8;}
.admin{background:#111;}
.logout{background:#dc2626;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

/* CARD */
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:400px;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar">

  <button class="btn add" onclick="goAdd()">➕ रिश्ता जोड़ें</button>

  <!-- ADMIN BUTTON (ONLY SHOW IF LOGIN) -->
  <button class="btn admin" id="adminBtn" onclick="goAdmin()" style="display:none">
    👑 Admin Panel
  </button>

</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

/* =========================
   ADMIN LOGIN (SIMPLE)
   ========================= */
const ADMIN_PASSWORD = "1234"; // change this

let isAdmin = localStorage.getItem("isAdmin") === "true";

/* show admin button */
if(isAdmin){
  document.getElementById("adminBtn").style.display="inline-block";
}

/* fake admin login prompt (demo) */
if(!isAdmin){
  let pass = prompt("Enter Admin Password (or cancel for user mode)");

  if(pass === ADMIN_PASSWORD){
    localStorage.setItem("isAdmin","true");
    isAdmin = true;
    document.getElementById("adminBtn").style.display="inline-block";
  }
}

/* =========================
   LOCAL STORAGE DATA
   ========================= */
function getData(){
  return JSON.parse(localStorage.getItem("profiles") || "[]");
}

function load(){
  let data = getData();

  let html="";

  data.forEach((p,i)=>{
    html+=`
    <div class="card" onclick="openModal(${i})">
      <img src="${p.photo}">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p>${p.city}</p>
      </div>
    </div>`;
  });

  document.getElementById("grid").innerHTML = html;
}

load();

/* =========================
   OPEN PROFILE
   ========================= */
function openModal(i){

  let data = getData();
  let p = data[i];

  document.getElementById("modalBody").innerHTML=`
    <h2>${p.name}</h2>
    <img src="${p.photo}" style="width:100%;border-radius:10px;">
    <p><b>Age:</b> ${p.age}</p>
    <p><b>City:</b> ${p.city}</p>
    <p>${p.desc || ""}</p>
  `;

  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* =========================
   NAVIGATION
   ========================= */
function goAdd(){
  window.location="profile-submit.html";
}

function goAdmin(){
  window.location="admin.html";
}

</script>

</body>
</html>
