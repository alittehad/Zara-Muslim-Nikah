<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background:linear-gradient(90deg,#0f766e,#14b8a6);
  color:white;
  text-align:center;
  padding:14px;
  font-weight:900;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:12px;
  padding:12px;
  flex-wrap:wrap;
}

/* 3D BUTTON */
.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  color:white;
  font-weight:bold;
  box-shadow:0 5px 0 rgba(0,0,0,0.2);
  transition:0.2s;
}

.btn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 rgba(0,0,0,0.2);
}

.home{background:#10b981;}
.add{background:#2563eb;}
.admin{background:#f59e0b;}
.logout{background:#ef4444;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

/* CARD */
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

.card button{
  margin:5px;
  padding:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:white;
}

.like{background:#e11d48;}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:10px;
  width:90%;
  max-width:400px;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar">
  <button class="btn home" onclick="location.reload()">Home</button>
  <button class="btn add" onclick="goAdd()">➕ Add Profile</button>
  <button class="btn admin" onclick="openAdmin()">👑 Admin Panel</button>
  <button class="btn logout" onclick="logout()">Logout</button>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>

    <input id="name" placeholder="Name"><br>
    <input id="age" placeholder="Age"><br>
    <input id="city" placeholder="City"><br>
    <input id="photo" placeholder="Photo URL"><br>

    <button class="btn add" onclick="saveProfile()">Save Profile</button>
  </div>
</div>

<script>

/* 🔥 LOAD DATA */
function load(){
  let data = JSON.parse(localStorage.getItem("profiles") || "[]");

  let html = "";

  data.forEach((p,i)=>{
    html += `
    <div class="card">
      <img src="${p.photo}">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p>${p.age} | ${p.city}</p>

        <button class="like" onclick="like('${p.name}','${p.age}','${p.city}')">
          ❤️ Like
        </button>
      </div>
    </div>`;
  });

  document.getElementById("grid").innerHTML = html;
}

load();

/* 🔥 ADMIN OPEN */
function openAdmin(){
  document.getElementById("modal").style.display="flex";
}

/* 🔥 SAVE PROFILE (NO FIREBASE) */
function saveProfile(){

  let data = JSON.parse(localStorage.getItem("profiles") || "[]");

  let obj = {
    name: document.getElementById("name").value,
    age: document.getElementById("age").value,
    city: document.getElementById("city").value,
    photo: document.getElementById("photo").value
  };

  if(!obj.name || !obj.photo){
    alert("Fill all fields");
    return;
  }

  data.push(obj);

  localStorage.setItem("profiles", JSON.stringify(data));

  alert("Profile Added ✔️");

  closeModal();
  load();
}

/* CLOSE */
function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* WHATSAPP */
function like(name,age,city){
  let msg = `I like this profile:
Name:${name}
Age:${age}
City:${city}`;

  window.open("https://wa.me/7378342192?text="+encodeURIComponent(msg));
}

/* NAV */
function goAdd(){
  alert("Admin panel se add kare");
}

function logout(){
  alert("Logged out");
}

</script>

</body>
</html>
