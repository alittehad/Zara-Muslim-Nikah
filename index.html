<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Muslim Nikah</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f4f6f9}
header{background:#0f766e;color:white;padding:15px;text-align:center;font-size:22px}

.topbar{text-align:center;padding:10px}
button{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  background:#0f766e;
  color:white;
  cursor:pointer;
  transition:all 0.2s;
  box-shadow:0 6px #0b5e57;
}
button:hover{background:#0b5e57;transform:translateY(-2px);box-shadow:0 4px #0b5e57;}
button:active{transform:translateY(2px);box-shadow:0 2px #0b5e57;}

#adminBtn{background:black;margin-left:8px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:14px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
overflow:hidden;
cursor:pointer;
transition:0.3s;
}
.card:hover{transform:translateY(-5px)}

.card img{
width:100%;
height:260px;
object-fit:contain;
background:#eee;
}

.card-body{text-align:center;padding:12px}
.name{font-weight:bold;font-size:18px}
.city{color:gray;font-size:14px}
.badge{font-size:13px;margin-top:4px}
.premium{color:gold}
.featured{color:red}

.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
width:95%;
max-width:500px;
max-height:90vh;
overflow-y:auto;
border-radius:12px;
padding:20px;
position:relative;
}

.close{
position:absolute;
top:10px;
right:15px;
font-size:18px;
cursor:pointer;
}
</style>
</head>
<body>

<header>Zara Muslim Nikah</header>

<div class="topbar">
<button id="loginBtn" onclick="handleAuth()">Login</button>
<button onclick="goAdd()">रिश्ता जोड़ें</button>
<button id="adminBtn" onclick="goAdmin()" style="display:none">Admin Panel</button>
</div>

<div class="grid" id="profileGrid"></div>

<div class="modal" id="profileModal">
<div class="modal-content" id="modalContent"></div>
</div>

<script>
// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com",
  messagingSenderId: "690336186269",
  appId: "1:690336186269:web:8215c1d313c4273c1f7974"
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL = "ngogrant454@gmail.com";

let currentUser = null;

// ✅ LOGIN / LOGOUT
function handleAuth(){
  if(currentUser){ 
    auth.signOut(); 
  } else {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider);
  }
}

// ✅ AUTH STATE
auth.onAuthStateChanged(user => {
  currentUser = user;
  document.getElementById("loginBtn").innerText = user ? "Logout" : "Login";

  if(user){
    // सही email निकालो: auth.currentUser.email या providerData से fallback
    const email = (user.email || (user.providerData[0] && user.providerData[0].email) || "").toLowerCase().trim();
    if(email === ADMIN_EMAIL){
      document.getElementById("adminBtn").style.display = "inline-block";
    } else {
      document.getElementById("adminBtn").style.display = "none";
    }
  } else {
    document.getElementById("adminBtn").style.display = "none";
  }
});

// ✅ ADMIN PANEL
function goAdmin(){
  if(!currentUser){
    alert("Login required");
    return;
  }
  const email = (currentUser.email || (currentUser.providerData[0] && currentUser.providerData[0].email) || "").toLowerCase().trim();
  if(email !== ADMIN_EMAIL){
    alert("Access denied (Not admin)");
    return;
  }
  window.location.href="admin.html";
}
</script>
</body>
</html>
