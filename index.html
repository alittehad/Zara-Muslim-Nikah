<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Muslim Nikah</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f4f6f9}
header{background:#0f766e;color:white;padding:15px;text-align:center}

.topbar{text-align:center;padding:10px}
button{padding:10px;border:none;border-radius:8px;background:#0f766e;color:white;cursor:pointer}

#adminBtn{background:black;display:none}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:14px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
cursor:pointer;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}
</style>
</head>
<body>

<header>Zara Muslim Nikah</header>

<div class="topbar">
<button id="loginBtn" onclick="handleAuth()">Login</button>
<button onclick="goAdd()">रिश्ता जोड़ें</button>
<button id="adminBtn" onclick="goAdmin()">Admin Panel</button>
</div>

<div class="grid" id="profileGrid"></div>

<script>

// Firebase
firebase.initializeApp({
 apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
 authDomain:"zara-muslim-nikah.firebaseapp.com",
 databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com",
 projectId:"zara-muslim-nikah"
});

const auth=firebase.auth();
const db=firebase.database();

const ADMIN="ngogrant454@gmail.com";

// LOGIN
function handleAuth(){
 if(auth.currentUser){auth.signOut();}
 else{
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
 }
}

// AUTH CHECK
auth.onAuthStateChanged(user=>{
 document.getElementById("loginBtn").innerText=user?"Logout":"Login";

 if(user){
   let email = user.email || (user.providerData[0] && user.providerData[0].email);

   if(email && email.toLowerCase().trim() === ADMIN){
     document.getElementById("adminBtn").style.display="inline-block";
   }else{
     document.getElementById("adminBtn").style.display="none";
   }

 }else{
   document.getElementById("adminBtn").style.display="none";
 }
});

// ADMIN CLICK (SECURE)
function goAdmin(){

 const user = auth.currentUser;

 if(!user){
   alert("Login required");
   return;
 }

 let email = user.email || (user.providerData[0] && user.providerData[0].email);

 if(!email || email.toLowerCase().trim() !== ADMIN){
   alert("Access denied (Not admin)");
   return;
 }

 window.location="admin.html";
}

// ADD PAGE
function goAdd(){
 if(!auth.currentUser){
   alert("Login required");
   return;
 }
 window.location="poster.html";
}

// LOAD PROFILES
db.ref("users").on("value",snap=>{
 const grid=document.getElementById("profileGrid");
 grid.innerHTML="";

 snap.forEach(child=>{
   const d=child.val();

   if(d.status==="approved"){
     grid.innerHTML+=`
     <div class="card">
       <img src="${d.photo}">
       <div style="padding:10px">
         <b>${d.name}</b><br>
         ${d.city}
       </div>
     </div>`;
   }
 });

});

</script>

</body>
</html>
