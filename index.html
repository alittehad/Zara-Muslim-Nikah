<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f4f6f9;}

header{
  background:#0f766e;
  color:white;
  text-align:center;
  padding:15px;
  font-size:22px;
  position:sticky;
  top:0;
  z-index:10;
}

/* Topbar */
.topbar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:10px;
}

.topbar button{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#loginBtn{background:#0f766e;}
#addPostBtn{background:#1d4ed8;}
#adminBtn{background:#000;}
#homeBtn{background:#dc2626;}

#afterLoginBtns{
  display:flex;
  gap:10px;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

/* Login Screen */
#loginScreen{
  display:none;
  position:relative;
}

#loginScreen img{
  width:100%;
  height:100vh;
  object-fit:cover;
}

/* Center Login Button */
.center-login{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* Modal */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:400px;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>🌙 Zara Nikah Service ⭐</header>

<div class="topbar">
  <button id="loginBtn" onclick="handleAuth()">Login</button>

  <div id="afterLoginBtns" style="display:none;">
    <button id="addPostBtn" onclick="goAdd()">रिश्ता जोड़ें</button>
    <button id="adminBtn" onclick="goAdmin()" style="display:none">Admin Panel</button>
    <button id="homeBtn" onclick="loadPosts()">Home</button>
  </div>
</div>

<!-- 🔥 Login Image Screen -->
<div id="loginScreen">
  <img src="https://images.unsplash.com/photo-1529634891331-7d0f4c4b4c8b?q=80&w=1200">
  
  <div class="center-login">
    <button onclick="handleAuth()" style="padding:15px 25px;font-size:18px;background:#0f766e;color:white;border:none;border-radius:8px;">
      Login to Continue
    </button>
  </div>
</div>

<!-- Profiles -->
<div class="grid" id="profileGrid"></div>

<!-- Modal -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let currentUser = null;

// Login
function handleAuth(){
  if(currentUser){ auth.signOut(); }
  else{ auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
}

// Auth State
auth.onAuthStateChanged(user=>{
  currentUser = user;

  const loginBtn = document.getElementById("loginBtn");
  const adminBtn = document.getElementById("adminBtn");
  const afterBtns = document.getElementById("afterLoginBtns");
  const loginScreen = document.getElementById("loginScreen");
  const grid = document.getElementById("profileGrid");

  loginBtn.innerText = user ? "Logout" : "Login";

  if(user){
    // Login state
    afterBtns.style.display = "flex";
    loginScreen.style.display = "none";
    grid.style.display = "grid";

    if((user.email||"").toLowerCase() === ADMIN_EMAIL){
      adminBtn.style.display = "inline-block";
    } else {
      adminBtn.style.display = "none";
    }

    loadPosts();

  } else {
    // Logout state
    afterBtns.style.display = "none";
    loginScreen.style.display = "block";
    grid.style.display = "none";
  }
});

// Load Profiles
function loadPosts(){
  db.ref("users").once("value").then(snap=>{
    const grid=document.getElementById("profileGrid");
    grid.innerHTML="";
    snap.forEach(child=>{
      const d = child.val();
      if(d && d.status==="approved"){
        grid.innerHTML+=`
        <div class="card" onclick="openModal('${child.key}')">
          <img src="${d.photo||'https://via.placeholder.com/300'}">
          <div class="card-body">
            <h3>${d.name||'Unknown'}</h3>
            <p>${d.city||'-'}</p>
          </div>
        </div>`;
      }
    });
  });
}

// Modal
function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d = snap.val();
    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%">
      <p>City: ${d.city}</p>
      <p>Age: ${d.age}</p>
    `;
    document.getElementById("profileModal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("profileModal").style.display="none";
}

// Pages
function goAdmin(){ window.location.href="admin.html"; }
function goAdd(){ window.location.href="profile-submit.html"; }

</script>

</body>
</html>
