<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  color: white;
  text-align: center;
  padding: 16px 12px;
  font-weight: 900;
  font-size: 24px;
  letter-spacing: 2px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  position: sticky;
  top: 0;
  z-index: 1000;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:8px;
  padding:10px;
  flex-wrap:wrap;
  background:white;
}

/* FILTER BOX */
select, input[type="range"]{
  padding:6px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* BUTTON */
.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.add{background:#1d4ed8;}
.admin{background:#111;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

/* CARD */
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  cursor:pointer;
  border:2px solid #d1d5db;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.03);
  border:2px solid #14b8a6;
  box-shadow:0 10px 25px rgba(20,184,166,0.35);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

.like{background:#16a34a;color:white;border:none;padding:6px;border-radius:6px;}
.edit{background:#1d4ed8;color:white;border:none;padding:6px;border-radius:6px;}
.delete{background:#dc2626;color:white;border:none;padding:6px;border-radius:6px;}

.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  z-index:999;
}

.modal-content{
  background:white;
  width:90%;
  max-width:600px;
  padding:20px;
  border-radius:12px;
  max-height:90vh;
  overflow-y:auto;

  /* ✨ better look */
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* profile image */
.modal-content img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:12px;
}

/* text spacing */
.modal-content p{
  margin:6px 0;
  font-size:14px;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<!-- 🔥 FILTER SECTION -->
<div class="topbar">

  <select id="genderFilter" onchange="applyFilters()">
    <option value="">Gender</option>
    <option>Male</option>
    <option>Female</option>
  </select>

  <select id="cityFilter" onchange="applyFilters()">
    <option value="">City</option>
  </select>

  <select id="religionFilter" onchange="applyFilters()">
    <option value="">Religion</option>
  </select>

  <select id="educationFilter" onchange="applyFilters()">
    <option value="">Education</option>
  </select>

  <input type="range" min="18" max="60" value="60" id="ageFilter" oninput="applyFilters()">
  <span id="ageText">Age: 60</span>

</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

let allProfiles = [];
const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(user){
    loadProfiles();
  }else{
    document.getElementById("grid").innerHTML = "Login Required";
  }
});

/* LOAD */
function loadProfiles(){
  db.ref("profiles").on("value",snap=>{
    allProfiles = [];

    snap.forEach(child=>{
      let d = child.val();
      d.id = child.key;
      allProfiles.push(d);
    });

    fillFilters(allProfiles);
    renderProfiles(allProfiles);
  });
}

/* RENDER */
function renderProfiles(list){

  let html = "";

  list.forEach(d=>{

    html += `
    <div class="card" onclick="openModal('${d.id}')">

      <img src="${d.photo}">

      

      <div class="card-body">
        <h3>${d.name}</h3>
        <p>${d.city}</p>

        <button class="like">💍 रिश्ता करें</button>
      </div>

    </div>`;
  });

  document.getElementById("grid").innerHTML = html;
}

/* FILTER */
function applyFilters(){

  let gender = document.getElementById("genderFilter").value;
  let city = document.getElementById("cityFilter").value;
  let religion = document.getElementById("religionFilter").value;
  let education = document.getElementById("educationFilter").value;
  let age = document.getElementById("ageFilter").value;

  document.getElementById("ageText").innerText = "Age: " + age;

  let filtered = allProfiles.filter(p=>{

    return (
      (gender=="" || p.gender==gender) &&
      (city=="" || p.city==city) &&
      (religion=="" || p.religion==religion) &&
      (education=="" || p.education==education) &&
      (!p.age || parseInt(p.age) <= age)
    );

  });

  renderProfiles(filtered);
}

/* FILL DROPDOWN */
function fillFilters(data){

  let cities = new Set();
  let religions = new Set();
  let educations = new Set();

  data.forEach(d=>{
    if(d.city) cities.add(d.city);
    if(d.religion) religions.add(d.religion);
    if(d.education) educations.add(d.education);
  });

  fill("cityFilter", cities);
  fill("religionFilter", religions);
  fill("educationFilter", educations);
}

function fill(id, set){
  let el = document.getElementById(id);
  el.innerHTML = `<option value="">All</option>`;
  set.forEach(v=>{
    el.innerHTML += `<option>${v}</option>`;
  });
}

/* MODAL */
function openModal(id){
  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();

    document.getElementById("modalBody").innerHTML = `
      <h2>${d.name || ''}</h2>

      <img src="${d.photo || ''}" style="width:100%;border-radius:10px;margin-bottom:10px;">

      <p><b>Age:</b> ${d.age || '-'}</p>
      <p><b>Gender:</b> ${d.gender || '-'}</p>
      <p><b>City:</b> ${d.city || '-'}</p>
      <p><b>Religion:</b> ${d.religion || '-'}</p>
      <p><b>Education:</b> ${d.education || '-'}</p>
      <p><b>Profession:</b> ${d.profession || '-'}</p>
      <p><b>Phone:</b> ${d.phone || '-'}</p>
      <p><b>Marital Status:</b> ${d.marital || '-'}</p>
      <p><b>Height:</b> ${d.height || '-'}</p>

      <p><b>Bio:</b><br>${d.bio || '-'}</p>
    `;

    document.getElementById("modal").style.display = "flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
