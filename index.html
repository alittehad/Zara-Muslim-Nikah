<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background: linear-gradient(135deg, #38bdf8, #0ea5e9, #e0f2fe);
  color:white;
  text-align:center;
  padding:10px 12px;
  font-weight:900;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

/* SCROLL TEXT */
.marquee{
  background:rgba(0,0,0,0.25);
  padding:5px;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
}
.marquee span{
  display:inline-block;
  padding-left:100%;
  animation:scroll 12s linear infinite;
  color:#fff;
}
@keyframes scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

/* BUTTON */
.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.add{background:#1d4ed8;}
.admin{background:#111;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  border:2px solid #d1d5db;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  z-index:9999;
  padding:15px;
}

.modal-content{
  background:white;
  width:92%;
  max-width:500px;
  padding:18px;
  border-radius:12px;
  max-height:85vh;
  overflow-y:auto;
}

/* IMAGE */
.modal-content img{
  width:100%;
  height:auto;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  🕋 Zara Nikah Service 🕌

  <!-- SCROLL TEXT -->
  <div class="marquee">
    <span id="scrollText">💍 Welcome to Zara Nikah Service - Find your perfect match 💍</span>
  </div>
</header>

<div class="topbar">
  <button class="btn add" onclick="goAdd()">प्रोफ़ाइल जोड़ें</button>

  <button class="btn admin" id="adminPanelBtn" style="display:none" onclick="changeScrollText()">
    ✏ Add / Edit Text
  </button>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(user){
    if((user.email||"").toLowerCase() === ADMIN_EMAIL){
      document.getElementById("adminPanelBtn").style.display="inline-block";
    }
    loadScrollText();
  }
});

/* LOAD TEXT */
function loadScrollText(){
  db.ref("scrollText").on("value",snap=>{
    let txt = snap.val();
    if(txt){
      document.getElementById("scrollText").innerText = txt;
    }
  });
}

/* CHANGE TEXT */
function changeScrollText(){
  let newText = prompt("Enter scrolling text:");
  if(newText){
    db.ref("scrollText").set(newText);
  }
}

/* SIMPLE NAV */
function goAdd(){
  window.location="profile-submit.html";
}

/* PLACEHOLDER FUNCTIONS */
function loadProfiles(){}
function openModal(){}
function closeModal(){}

</script>

</body>
</html>
