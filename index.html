<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>

body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

header{
  background:linear-gradient(135deg,#38bdf8,#0ea5e9,#e0f2fe);
  color:white;
  text-align:center;
  padding:16px;
  font-size:24px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:1000;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:10px;
}

.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.add{background:#1d4ed8;}
.admin{background:#111;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

.like{
  background:#16a34a;
  padding:6px 10px;
  border:none;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  z-index:9999;
}

.modal-content{
  background:white;
  width:90%;
  max-width:500px;
  padding:15px;
  border-radius:12px;
}

</style>

</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar">

  <button class="btn add" onclick="requireLogin(goAdd)">➕ Profile Add</button>

  <button class="btn admin" onclick="loginUser()" id="loginBtn">🔑 Login</button>

  <button class="btn admin" onclick="logoutUser()" id="logoutBtn" style="display:none">🚪 Logout</button>

  <button class="btn admin" onclick="requireLogin(goPayment)">💍 Payment</button>

</div>

<div id="grid" class="grid">
  <div style="text-align:center;padding:20px;">Loading...</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnx2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;

/* 🔥 LOGIN FIXED (POPUP + REDIRECT FALLBACK) */
function loginUser(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .catch(()=>{
    auth.signInWithRedirect(provider);
  });
}

/* HANDLE REDIRECT LOGIN */
auth.getRedirectResult().catch(()=>{});

/* LOGOUT */
function logoutUser(){
  auth.signOut();
}

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
  currentUser = user;

  document.getElementById("loginBtn").style.display = user ? "none" : "inline-block";
  document.getElementById("logoutBtn").style.display = user ? "inline-block" : "none";

  loadProfiles();
});

/* REQUIRE LOGIN */
function requireLogin(callback){
  if(!currentUser){
    alert("Login required 🔑");
    loginUser();
    return;
  }
  callback();
}

/* LOAD PROFILES */
function loadProfiles(){

  db.ref("profiles").on("value",snap=>{

    let html = "";

    if(!snap.exists()){
      document.getElementById("grid").innerHTML = "<div style='text-align:center;color:red;'>No Profiles Found</div>";
      return;
    }

    snap.forEach(child=>{
      let d = child.val();

      html += `
      <div class="card">

        <img src="${d.photo}" onclick="requireLogin(()=>openModal('${child.key}'))">

        <div class="card-body">
          <h3>${d.name || ''}</h3>
          <p>${d.city || ''}</p>

          <button class="like" onclick="requireLogin(goPayment)">💍 Rishta</button>
        </div>

      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* MODAL */
function openModal(id){

  if(!currentUser){
    loginUser();
    return;
  }

  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();

    document.getElementById("modalBody").innerHTML = `
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%;border-radius:10px;">
      <p>Age: ${d.age}</p>
      <p>City: ${d.city}</p>
      <p>Phone: ${d.phone}</p>
      <p>Bio: ${d.bio}</p>
    `;

    document.getElementById("modal").style.display = "flex";
    document.body.style.overflow = "hidden";
  });
}

/* CLOSE MODAL */
function closeModal(){
  document.getElementById("modal").style.display = "none";
  document.body.style.overflow = "auto";
}

/* NAV */
function goPayment(){ window.location="payment.html"; }
function goAdd(){ window.location="profile-submit.html"; }

</script>

</body>
</html>
