<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f4f6f9;}

/* Header */
header{
  background:#0f766e;
  color:white;
  text-align:center;
  padding:15px;
  font-size:22px;
}

/* Topbar */
.topbar{
  display:none;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.topbar button{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#addPostBtn{background:#1d4ed8;}
#adminBtn{background:#000;}
#homeBtn{background:#dc2626;}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

/* LOGIN SCREEN */
#loginScreen{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:url('https://i.ibb.co/B5wzJpm6/nikah-wall.png') no-repeat center center;
  background-size:contain;
  background-color:black;
  overflow:hidden;
}

/* glow background */
#loginScreen::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background: radial-gradient(circle at 20% 20%, rgba(20,184,166,0.25), transparent 40%),
              radial-gradient(circle at 80% 80%, rgba(15,118,110,0.25), transparent 40%);
  animation: bgMove 6s infinite alternate;
}

@keyframes bgMove{
  from{transform:scale(1);}
  to{transform:scale(1.1);}
}

/* particles */
#loginScreen::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background-image: radial-gradient(circle, rgba(255,255,255,0.4) 2px, transparent 3px);
  background-size: 50px 50px;
  animation: floatParticles 10s linear infinite;
  opacity:0.25;
}

@keyframes floatParticles{
  from{transform:translateY(0);}
  to{transform:translateY(-100px);}
}

/* center */
.center-login{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:2;
}

/* ⭐ SMALL 3D LOGIN BUTTON (UPDATED) */
.login-btn{
  padding:7px 14px;
  font-size:12px;
  font-weight:600;
  color:white;

  background: linear-gradient(145deg, #0f766e, #14b8a6);
  border:none;
  border-radius:10px;
  cursor:pointer;

  box-shadow: 0 4px 0 #0b5c55, 0 8px 18px rgba(0,0,0,0.35);

  transition: all 0.2s ease;
  animation: glow 2s infinite alternate;
}

/* glow */
@keyframes glow{
  from{box-shadow:0 4px 0 #0b5c55, 0 6px 15px rgba(0,0,0,0.25);}
  to{box-shadow:0 4px 0 #0b5c55, 0 0 18px rgba(20,184,166,0.7);}
}

/* hover */
.login-btn:hover{
  transform: translateY(-2px) scale(1.03);
}

/* click */
.login-btn:active{
  transform: translateY(1px) scale(0.98);
  box-shadow:0 2px 0 #0b5c55;
}

/* Modal */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:400px;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>🌙 Zara Nikah Service ⭐</header>

<!-- Topbar -->
<div class="topbar" id="topbar">
  <button id="addPostBtn" onclick="goAdd()">रिश्ता जोड़ें</button>
  <button id="adminBtn" onclick="goAdmin()" style="display:none">Admin Panel</button>
  <button id="homeBtn" onclick="loadPosts()">Home</button>
  <button onclick="handleAuth()" style="background:#0f766e;">Logout</button>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="center-login">
    <button class="login-btn" onclick="handleAuth()">
      🔐 Login
    </button>
  </div>
</div>

<!-- Grid -->
<div class="grid" id="profileGrid"></div>

<!-- Modal -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let currentUser = null;

function handleAuth(){
  if(currentUser){ auth.signOut(); }
  else{ auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
}

auth.onAuthStateChanged(user=>{
  currentUser = user;

  const adminBtn = document.getElementById("adminBtn");
  const loginScreen = document.getElementById("loginScreen");
  const grid = document.getElementById("profileGrid");
  const topbar = document.getElementById("topbar");

  if(user){
    topbar.style.display = "flex";
    loginScreen.style.display = "none";
    grid.style.display = "grid";

    if((user.email||"").toLowerCase() === ADMIN_EMAIL){
      adminBtn.style.display = "inline-block";
    } else {
      adminBtn.style.display = "none";
    }

    loadPosts();
  } else {
    topbar.style.display = "none";
    loginScreen.style.display = "block";
    grid.style.display = "none";
  }
});

function loadPosts(){
  db.ref("users").once("value").then(snap=>{
    const grid=document.getElementById("profileGrid");
    grid.innerHTML="";
    snap.forEach(child=>{
      const d = child.val();
      if(d && d.status==="approved"){
        grid.innerHTML+=`
        <div class="card" onclick="openModal('${child.key}')">
          <img src="${d.photo||'https://via.placeholder.com/300'}">
          <div class="card-body">
            <h3>${d.name||'Unknown'}</h3>
            <p>${d.city||'-'}</p>
          </div>
        </div>`;
      }
    });
  });
}

function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d = snap.val();
    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%">
      <p>City: ${d.city}</p>
      <p>Age: ${d.age}</p>
    `;
    document.getElementById("profileModal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("profileModal").style.display="none";
}

function goAdmin(){ window.location.href="admin.html"; }
function goAdd(){ window.location.href="profile-submit.html"; }
</script>

</body>
</html>
