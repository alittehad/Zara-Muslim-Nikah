<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f4f6f9;}

header{
  background: linear-gradient(90deg,#0f766e,#14b8a6);
  color:white;text-align:center;font-size:22px;font-weight:900;padding:14px;
}

.topbar{
  display:flex;justify-content:center;gap:10px;padding:10px;
}

.topbar button{
  padding:10px 16px;border:none;border-radius:8px;
  font-weight:bold;cursor:pointer;color:white;
}

#loginBtn{background:#0f766e;}
#logoutBtn{background:black;}
#adminBtn{background:#1e40af;}
#addBtn{background:#dc2626;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;padding:15px;
}

.card{
  background:white;border-radius:12px;overflow:hidden;
  cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.1);
  transition:0.3s;
}
.card:hover{transform:translateY(-4px);}

.card img{width:100%;height:200px;object-fit:cover;}

.card-body{text-align:center;padding:10px;}

.modal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  display:none;justify-content:center;align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;padding:20px;border-radius:10px;
  width:90%;max-width:420px;max-height:90%;overflow-y:auto;
}

.btn{
  padding:10px;border:none;border-radius:8px;
  width:100%;margin-top:8px;font-weight:bold;cursor:pointer;
}

.interest{background:#e11d48;color:white;}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<!-- TOPBAR -->
<div class="topbar">
  <button id="loginBtn" onclick="login()">Login</button>
  <button id="addBtn" onclick="goAdd()" style="display:none">रिश्ता जोड़ें</button>
  <button id="adminBtn" onclick="goAdmin()" style="display:none">Admin</button>
  <button id="logoutBtn" onclick="logout()" style="display:none">Logout</button>
</div>

<!-- ✅ WELCOME IMAGE -->
<div id="welcomeBox" style="text-align:center;padding:20px;">
  <img src="https://i.ibb.co/fzQ1WgbN/your-image-name.jpg"
       style="width:95%;max-width:420px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.2);">
  <h2>Welcome to Zara Nikah Service</h2>
  <p>Please login to view profiles</p>
</div>

<!-- GRID -->
<div class="grid" id="profileGrid"></div>

<!-- MODAL -->
<div class="modal" id="profileModal" onclick="closeModal(event)">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

// Firebase
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let currentUser = null;

/* LOGIN */
function login(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
}

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
  currentUser = user;

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const addBtn = document.getElementById("addBtn");
  const adminBtn = document.getElementById("adminBtn");
  const welcomeBox = document.getElementById("welcomeBox");

  if(user){
    welcomeBox.style.display = "none";

    loginBtn.style.display="none";
    logoutBtn.style.display="inline-block";
    addBtn.style.display="inline-block";

    if((user.email||"").toLowerCase() === ADMIN_EMAIL.toLowerCase()){
      adminBtn.style.display="inline-block";
    }

    loadPosts();

  } else {
    welcomeBox.style.display = "block";

    loginBtn.style.display="inline-block";
    logoutBtn.style.display="none";
    addBtn.style.display="none";
    adminBtn.style.display="none";

    document.getElementById("profileGrid").innerHTML = "";
  }
});

/* LOAD PROFILES */
function loadPosts(){

  db.ref("users").off();

  db.ref("users").on("value",snap=>{
    const grid = document.getElementById("profileGrid");
    grid.innerHTML = "";

    snap.forEach(child=>{
      const d = child.val() || {};

      if(d.status === "approved"){
        grid.innerHTML += `
        <div class="card" onclick="openModal('${child.key}')">
          <img src="${d.photo || 'https://via.placeholder.com/300'}">
          <div class="card-body">
            <h3>${d.name || 'Unknown'}</h3>
            <p>${d.city || '-'}</p>
          </div>
        </div>`;
      }
    });
  });
}

/* OPEN PROFILE */
function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d = snap.val() || {};

    document.getElementById("modalBody").innerHTML = `
      <img src="${d.photo || 'https://via.placeholder.com/300'}" style="width:100%;border-radius:10px">

      <h2>${d.name || ''}</h2>

      <p><b>Age:</b> ${d.age || '-'}</p>
      <p><b>City:</b> ${d.city || '-'}</p>
      <p><b>Gender:</b> ${d.gender || '-'}</p>
      <p><b>Education:</b> ${d.education || '-'}</p>
      <p><b>Profession:</b> ${d.profession || '-'}</p>
      <p><b>Bio:</b> ${d.bio || '-'}</p>

      <button class="btn interest" onclick="goPayment('${id}')">
        ❤️ Send Interest & Pay
      </button>
    `;

    document.getElementById("profileModal").style.display = "flex";
  });
}

/* PAYMENT CHECK */
function goPayment(id){
  if(!currentUser){
    alert("Login required");
    return;
  }

  db.ref("interests/"+id+"/"+currentUser.uid).once("value")
  .then(snap=>{
    if(snap.exists()){
      alert("You already sent interest!");
    } else {
      window.location.href = "payment.html?profile=" + id;
    }
  });
}

/* CLOSE MODAL */
function closeModal(e){
  if(!e || e.target.id === "profileModal"){
    document.getElementById("profileModal").style.display = "none";
  }
}

/* NAV */
function logout(){ auth.signOut(); }
function goAdmin(){ window.location.href="admin.html"; }
function goAdd(){ window.location.href="profile-submit.html"; }

</script>

</body>
</html>
