<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* ADMIN EMAIL */
const ADMIN_EMAIL = "ngogrant454@gmail.com";

let currentUser = null;
let isAdmin = false;

/* ================= AUTH ================= */
auth.onAuthStateChanged(user=>{
  currentUser = user;

  if(user){

    isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL;

    if(isAdmin){
      document.getElementById("adminPanelBtn").style.display="inline-block";
      document.getElementById("adminAddBtn").style.display="inline-block";
    }

    loadProfiles();

  } else {
    document.getElementById("grid").innerHTML = "<p style='text-align:center'>Login Required</p>";
  }
});

/* ================= LOAD PROFILES ================= */
function loadProfiles(){

  db.ref("profiles").on("value",snap=>{

    let html="";

    snap.forEach(child=>{
      let d = child.val();

      html+=`
      <div class="card">
        <img src="${d.photo}" onclick="openModal('${child.key}')">

        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>

          ${
            isAdmin ? `
            <button onclick="editProfile('${child.key}')" style="background:#1d4ed8;color:white;padding:6px 10px;border:none;border-radius:6px;margin:5px;">
              ✏ Edit
            </button>

            <button onclick="deleteProfile('${child.key}')" style="background:#dc2626;color:white;padding:6px 10px;border:none;border-radius:6px;">
              🗑 Delete
            </button>
            ` : ""
          }

        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* ================= DELETE ================= */
function deleteProfile(id){

  if(confirm("Delete this profile?")){

    db.ref("profiles/"+id).remove()
    .then(()=>{
      alert("Deleted ✔️");
    })
    .catch(err=>{
      alert("Error: " + err.message);
    });

  }
}

/* ================= EDIT ================= */
function editProfile(id){
  // simple redirect with id
  window.location = "admin-add.html?id=" + id;
}

/* ================= MODAL ================= */
function openModal(id){

  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();

    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%;border-radius:10px;">
      <p><b>Age:</b> ${d.age}</p>
      <p><b>City:</b> ${d.city}</p>
      <p>${d.description || ""}</p>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* ================= NAV ================= */
function goAdd(){
  window.location="profile-submit.html";
}

function goAdmin(){
  window.location="admin.html";
}

function goAdminAdd(){
  window.location="admin-add.html";
}

</script>
