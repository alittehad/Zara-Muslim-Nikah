<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f4f6f9;}

/* ===== 3D HEADER ===== */
.top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 10px;

  background: linear-gradient(145deg, #0f766e, #14b8a6);

  box-shadow:
    0 6px 0 #0b5c55,
    0 15px 25px rgba(0,0,0,0.35);

  border-bottom:3px solid rgba(255,255,255,0.2);

  transform: perspective(800px) rotateX(6deg);
}

/* side blocks */
.side{
  display:flex;
  flex-direction:column;
  align-items:center;
  color:white;
  font-size:11px;
  font-weight:600;
  transition:0.3s;
}

.side img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;

  border:2px solid white;

  box-shadow:
    0 4px 0 rgba(0,0,0,0.3),
    0 10px 20px rgba(0,0,0,0.4);

  transition:0.3s;
}

.side:hover img{
  transform:translateY(-3px) scale(1.05);
  box-shadow:0 12px 25px rgba(0,0,0,0.5);
}

/* title */
.title{
  font-size:18px;
  font-weight:900;
  color:white;
  letter-spacing:1px;

  text-shadow:
    0 3px 0 #0b5c55,
    0 8px 15px rgba(0,0,0,0.4);
}

/* hover effect */
.top-header:hover{
  transform: perspective(800px) rotateX(0deg) translateY(-2px);
}

/* Header mobile */
@media(max-width:500px){
  .title{font-size:14px;}
  .side img{width:38px;height:38px;}
}

/* Topbar */
.topbar{
  display:none;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.topbar button{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#addPostBtn{background:#1d4ed8;}
#adminBtn{background:#000;}
#homeBtn{background:#dc2626;}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

/* LOGIN SCREEN */
#loginScreen{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:url('https://i.ibb.co/B5wzJpm6/nikah-wall.png') no-repeat center center;
  background-size:contain;
  background-color:black;
}

/* login button */
.login-btn{
  padding:7px 14px;
  font-size:12px;
  font-weight:600;
  color:white;
  background: linear-gradient(145deg, #0f766e, #14b8a6);
  border:none;
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 4px 0 #0b5c55, 0 8px 18px rgba(0,0,0,0.35);
}

/* Modal */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:400px;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- 🔥 3D HEADER -->
<header class="top-header">

  <div class="side">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Kaaba_Makkah.jpg">
    <span>Makkah</span>
  </div>

  <div class="title">
    Zara Nikah Service
  </div>

  <div class="side">
    <img src="https://i.ibb.co/XkZNtNw9/madina-removebg-preview-100.png">
    <span>Madinah</span>
  </div>

</header>

<!-- Topbar -->
<div class="topbar" id="topbar">
  <button id="addPostBtn" onclick="goAdd()">रिश्ता जोड़ें</button>
  <button id="adminBtn" onclick="goAdmin()" style="display:none">Admin Panel</button>
  <button id="homeBtn" onclick="loadPosts()">Home</button>
  <button onclick="handleAuth()" style="background:#0f766e;">Logout</button>
</div>

<!-- Login -->
<div id="loginScreen">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
    <button class="login-btn" onclick="handleAuth()">🔐 Login</button>
  </div>
</div>

<!-- Grid -->
<div class="grid" id="profileGrid"></div>

<!-- Modal -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let currentUser = null;

function handleAuth(){
  if(currentUser){ auth.signOut(); }
  else{ auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
}

auth.onAuthStateChanged(user=>{
  currentUser = user;

  const loginScreen = document.getElementById("loginScreen");
  const grid = document.getElementById("profileGrid");
  const topbar = document.getElementById("topbar");

  if(user){
    topbar.style.display = "flex";
    loginScreen.style.display = "none";
    grid.style.display = "grid";
    loadPosts();
  } else {
    topbar.style.display = "none";
    loginScreen.style.display = "block";
    grid.style.display = "none";
  }
});

function loadPosts(){
  db.ref("users").once("value").then(snap=>{
    const grid=document.getElementById("profileGrid");
    grid.innerHTML="";
    snap.forEach(child=>{
      const d = child.val();
      if(d && d.status==="approved"){
        grid.innerHTML+=`
        <div class="card" onclick="openModal('${child.key}')">
          <img src="${d.photo||'https://via.placeholder.com/300'}">
          <div class="card-body">
            <h3>${d.name||'Unknown'}</h3>
            <p>${d.city||'-'}</p>
          </div>
        </div>`;
      }
    });
  });
}

function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d = snap.val();
    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%">
      <p>City: ${d.city}</p>
      <p>Age: ${d.age}</p>
    `;
    document.getElementById("profileModal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("profileModal").style.display="none";
}

function goAdmin(){ window.location.href="admin.html"; }
function goAdd(){ window.location.href="profile-submit.html"; }
</script>

</body>
</html>
