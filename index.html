<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background: linear-gradient(90deg, #0f766e, #14b8a6);
  color:white;
  text-align:center;
  font-size:clamp(16px, 4.5vw, 32px);
  font-weight:900;
  padding:14px;
}

/* TOPBAR */
.topbar{
  display:none;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.topbar button{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#homeBtn{background:#0f766e;}
#addPostBtn{background:#1d4ed8;}
#adminBtn{background:#000;}
#logoutBtn{background:#dc2626;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

/* ================= LOGIN SCREEN FIX (IMPORTANT) ================= */
#loginScreen{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  background:url("https://i.ibb.co/fzQ1WgbN/bg.jpg") no-repeat center center;
  background-size:cover;

  overflow:hidden;
}

/* DARK OVERLAY FIX */
#loginScreen::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:0;
}

/* BUTTON FIX */
.login-btn{
  position:relative;
  z-index:2;
  padding:14px 24px;
  font-size:16px;
  background:#14b8a6;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* MOBILE FIX (no zoom/cut feel) */
@media(max-width:768px){
  #loginScreen{
    background-size:cover;
    background-position:center;
  }
}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:400px;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar" id="topbar">
  <button id="homeBtn" onclick="goHome()">Home</button>
  <button id="addPostBtn" onclick="goAdd()">रिश्ता जोड़ें</button>
  <button id="adminBtn" onclick="goAdmin()" style="display:none">Admin Panel</button>
  <button id="logoutBtn" onclick="handleAuth()">Logout</button>
</div>

<div id="loginScreen">
  <button class="login-btn" onclick="handleAuth()">Login</button>
</div>

<div class="grid" id="profileGrid"></div>

<div class="modal" id="profileModal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>

    <button onclick="interest()"
      style="background:#e11d48;color:white;padding:10px;border:none;border-radius:8px;width:100%;margin-top:10px;font-weight:bold;">
      ❤️ I’m Interested
    </button>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

let currentUser = null;
let currentProfileId = null;

function handleAuth(){
  if(currentUser){
    auth.signOut();
  } else {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }
}

auth.onAuthStateChanged(user=>{
  currentUser = user;

  if(user){
    document.querySelector("header").style.display="block";
    document.getElementById("topbar").style.display="flex";
    document.getElementById("loginScreen").style.display="none";

    if((user.email||"").toLowerCase()===ADMIN_EMAIL){
      document.getElementById("adminBtn").style.display="inline-block";
    }

    loadPosts();

  } else {
    document.querySelector("header").style.display="none";
    document.getElementById("topbar").style.display="none";
    document.getElementById("loginScreen").style.display="flex";
    document.getElementById("profileGrid").innerHTML="";
  }
});

function loadPosts(){
  db.ref("users").once("value").then(snap=>{
    const grid=document.getElementById("profileGrid");
    grid.innerHTML="";

    snap.forEach(child=>{
      const d=child.val();
      if(d && d.status==="approved"){
        grid.innerHTML+=`
        <div class="card" onclick="openModal('${child.key}')">
          <img src="${d.photo||''}">
          <div class="card-body">
            <h3>${d.name}</h3>
            <p>${d.city}</p>
          </div>
        </div>`;
      }
    });
  });
}

function openModal(id){
  currentProfileId = id;

  db.ref("users/"+id).once("value").then(snap=>{
    const d=snap.val();

    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%">
      <p>${d.city}</p>
      <p>${d.age}</p>
    `;

    document.getElementById("profileModal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("profileModal").style.display="none";
}

function interest(){
  if(!currentUser || !currentProfileId) return;

  db.ref("interests/"+currentProfileId+"/"+currentUser.uid).set({
    userId: currentUser.uid,
    name: currentUser.displayName,
    status: "pending"
  });

  alert("Interest Sent ❤️");
}

function goAdmin(){ window.location="admin.html"; }
function goAdd(){ window.location="profile-submit.html"; }

function goHome(){
  window.location.href = "index.html";
}

</script>

</body>
</html>
