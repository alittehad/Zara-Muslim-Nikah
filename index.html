<!DOCTYPE html>
<html>
<head>

<meta name="google-site-verification" content="FaElE6Kh5Ixq0wRBtgIOLdHfW08ZfQQVBDE_3QLx9Ns" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f9;}

header{
  background:linear-gradient(135deg,#38bdf8,#0ea5e9,#e0f2fe);
  color:white;text-align:center;padding:16px;
  font-size:24px;font-weight:bold;
  position:sticky;top:0;z-index:1000;
}

.topbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px;}

.btn{padding:10px 16px;border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer;}
.add{background:#1d4ed8;}
.admin{background:#111;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;padding:15px;}

.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.card img{width:100%;height:250px;object-fit:cover;}

.card-body{text-align:center;padding:10px;}

.like{background:#16a34a;}
.edit{background:#1d4ed8;}
.delete{background:#dc2626;}

.modal{
  position:fixed;inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:500px;
  padding:15px;
  border-radius:10px;
}
</style>

</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<div class="topbar">

  <button class="btn add" onclick="requireLogin(goAdd)">➕ Profile Add</button>

  <button class="btn admin" onclick="loginUser()" id="loginBtn">🔑 Login</button>

  <button class="btn admin" onclick="logoutUser()" id="logoutBtn" style="display:none">🚪 Logout</button>

  <button class="btn admin" onclick="requireLogin(goPayment)">💍 Payment</button>

  <button class="btn admin" id="adminBtn" style="display:none" onclick="requireLogin(goAdmin)">👑 Admin</button>

</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnx2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let isAdmin = false;

/* LOGIN */
function loginUser(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .then(res=>{
    console.log("Login success");
  })
  .catch(err=>{
    alert(err.message);
  });
}

/* LOGOUT */
function logoutUser(){
  auth.signOut();
}

/* AUTH CHECK */
auth.onAuthStateChanged(user=>{

  if(user){
    isAdmin = (user.email||"").toLowerCase() === ADMIN_EMAIL;

    document.getElementById("loginBtn").style.display="none";
    document.getElementById("logoutBtn").style.display="inline-block";

    if(isAdmin){
      document.getElementById("adminBtn").style.display="inline-block";
    }

  } else {
    isAdmin = false;

    document.getElementById("loginBtn").style.display="inline-block";
    document.getElementById("logoutBtn").style.display="none";
    document.getElementById("adminBtn").style.display="none";
  }

  loadProfiles();
});

/* REQUIRE LOGIN */
function requireLogin(callback){
  if(!auth.currentUser){
    alert("पहले Login करें 🔑");
    loginUser();
    return;
  }
  callback();
}

/* LOAD DATA */
function loadProfiles(){
  db.ref("profiles").on("value",snap=>{
    let html="";

    snap.forEach(child=>{
      let d = child.val();

      html+=`
      <div class="card">

        <img src="${d.photo}" onclick="requireLogin(()=>openModal('${child.key}'))">

        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>

          <button class="like" onclick="requireLogin(goPayment)">💍 Rishta</button>
        </div>

      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* MODAL */
function openModal(id){

  if(!auth.currentUser){
    alert("Login required");
    return;
  }

  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();

    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%">
      <p>Age: ${d.age}</p>
      <p>City: ${d.city}</p>
      <p>Phone: ${d.phone}</p>
      <p>Bio: ${d.bio}</p>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* NAVIGATION */
function goPayment(){ window.location="payment.html"; }
function goAdd(){ window.location="profile-submit.html"; }
function goAdmin(){ window.location="admin.html"; }

</script>

</body>
</html>
