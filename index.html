<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f4f6f9;}

header{
  width:100%;
  box-sizing:border-box;
  background: linear-gradient(90deg, #0f766e, #14b8a6);
  color:white;
  text-align:center;
  font-size:clamp(16px, 4.5vw, 32px);
  font-weight:900;
  padding:14px 10px;
  letter-spacing:1px;
  text-shadow:0 3px 0 #0b5c55,0 10px 20px rgba(0,0,0,0.35);
  white-space:nowrap;
  overflow:hidden;
}

.topbar{
  display:none;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.topbar button{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#addPostBtn{background:#1d4ed8;}
#adminBtn{background:#000;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

/* LOGIN */
#loginScreen{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100vh;
  background:black;
  justify-content:center;
  align-items:center;
  color:white;
}

.login-btn{
  padding:10px;
  background:#0f766e;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:400px;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>🕋 Zara Nikah Service 🕌</header>

<!-- Topbar -->
<div class="topbar" id="topbar">
  <button id="addPostBtn" onclick="goAdd()">रिश्ता जोड़ें</button>
  <button id="adminBtn" onclick="goAdmin()" style="display:none">Admin Panel</button>
  <button onclick="handleAuth()" style="background:#0f766e;">Logout</button>
</div>

<!-- Login -->
<div id="loginScreen">
  <button class="login-btn" onclick="handleAuth()">Login</button>
</div>

<!-- Profiles -->
<div class="grid" id="profileGrid"></div>

<!-- Modal -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let currentUser = null;

/* LOGIN */
function handleAuth(){
  if(currentUser){
    auth.signOut();
  } else {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }
}

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
  currentUser = user;

  const topbar = document.getElementById("topbar");
  const loginScreen = document.getElementById("loginScreen");
  const grid = document.getElementById("profileGrid");
  const adminBtn = document.getElementById("adminBtn");

  if(user){
    topbar.style.display="flex";
    loginScreen.style.display="none";
    grid.style.display="grid";

    if((user.email||"").toLowerCase()===ADMIN_EMAIL){
      adminBtn.style.display="inline-block";
    } else {
      adminBtn.style.display="none";
    }

    loadPosts();

  } else {
    topbar.style.display="none";
    loginScreen.style.display="flex";
    grid.style.display="none";
  }
});

/* LOAD PROFILES */
function loadPosts(){
  db.ref("users").once("value").then(snap=>{
    const grid=document.getElementById("profileGrid");
    grid.innerHTML="";

    snap.forEach(child=>{
      const d=child.val();

      if(d && d.status==="approved"){
        grid.innerHTML+=`
        <div class="card" onclick="openModal('${child.key}')">
          <img src="${d.photo||'https://via.placeholder.com/300'}">
          <div class="card-body">
            <h3>${d.name||'Unknown'}</h3>
            <p>${d.city||'-'}</p>
          </div>
        </div>`;
      }
    });
  });
}

/* OPEN MODAL + INTEREST BUTTON */
function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d=snap.val();

    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%">
      <p>City: ${d.city}</p>
      <p>Age: ${d.age}</p>

      <button onclick="sendInterest('${id}')"
      style="
      width:100%;
      margin-top:10px;
      padding:10px;
      background:#e11d48;
      color:white;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
      ">
      ❤️ I’m Interested
      </button>
    `;

    document.getElementById("profileModal").style.display="flex";
  });
}

/* SEND INTEREST */
function sendInterest(profileId){

  if(!currentUser){
    alert("Login required");
    return;
  }

  db.ref("interests/"+profileId+"/"+currentUser.uid).set({
    name: currentUser.displayName || "User",
    email: currentUser.email || "",
    status: "pending",
    time: Date.now()
  });

  alert("❤️ Interest Sent");
}

/* CLOSE MODAL */
function closeModal(){
  document.getElementById("profileModal").style.display="none";
}

/* NAV */
function goAdmin(){ window.location.href="admin.html"; }
function goAdd(){ window.location.href="profile-submit.html"; }

</script>

</body>
</html>
