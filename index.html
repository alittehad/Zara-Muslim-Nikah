<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background: linear-gradient(135deg, #38bdf8, #0ea5e9, #e0f2fe);
  color: white;
  text-align: center;
  padding: 12px;
  font-weight: 900;
  font-size: 24px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* 🔥 SCROLL TEXT (NEW - SAFE ADD) */
.ticker{
  width:100%;
  overflow:hidden;
  background:rgba(0,0,0,0.25);
  color:white;
  font-size:14px;
  padding:5px 0;
  white-space:nowrap;
}

.ticker span{
  display:inline-block;
  padding-left:100%;
  animation:move 12s linear infinite;
}

@keyframes move{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.add{background:#1d4ed8;}
.admin{background:#111;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  border:2px solid #d1d5db;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body{
  text-align:center;
  padding:10px;
}

.like{background:#16a34a;}
.edit{background:#1d4ed8;}
.delete{background:#dc2626;}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
  z-index:9999;
  padding:15px;
}

.modal-content{
  background:white;
  width:92%;
  max-width:500px;
  padding:18px;
  border-radius:12px;
  max-height:85vh;
  overflow-y:auto;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  🕋 Zara Nikah Service 🕌

  <!-- 🔥 SCROLLING TEXT ADDED HERE -->
  <div class="ticker">
    <span id="scrollText">💍 Welcome to Zara Nikah Service - Find your perfect match 💍</span>
  </div>
</header>

<div class="topbar">
  <button class="btn add" onclick="goAdd()">प्रोफ़ाइल जोड़ें</button>
</div>

<div class="grid" id="grid"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* LOAD SCROLL TEXT */
auth.onAuthStateChanged(user=>{
  if(user){
    if((user.email||"").toLowerCase() === ADMIN_EMAIL){
      // admin future use
    }

    db.ref("scrollText").on("value",snap=>{
      let t = snap.val();
      if(t){
        document.getElementById("scrollText").innerText = t;
      }
    });
  }
});

/* NAV */
function goAdd(){
  window.location="profile-submit.html";
}

</script>

</body>
</html>
