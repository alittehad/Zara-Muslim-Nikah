<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara Nikah Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f6f9;
}

/* HEADER */
header{
  background:linear-gradient(90deg,#0f766e,#14b8a6);
  color:white;
  padding:14px;
  font-weight:900;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* LOGO */
.logo{
  font-size:16px;
}

/* RIGHT BUTTONS */
.header-btns{
  display:flex;
  gap:10px;
}

/* BUTTON */
.btn{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:12px;
}

.my{background:#111;}
.logout{background:#dc2626;}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

.add{background:#1d4ed8;}
.admin{background:#111;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  cursor:pointer;
}

.card-body{
  text-align:center;
  padding:10px;
}

.like{background:#16a34a;}
.edit{background:#1d4ed8;}
.delete{background:#dc2626;}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-content{
  background:white;
  width:90%;
  max-width:400px;
  padding:20px;
  border-radius:10px;
}

/* MOBILE FIX */
@media(max-width:600px){
  header{
    flex-direction:column;
    gap:8px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🕋 Zara Nikah Service 🕌</div>

  <div class="header-btns">
    <button class="btn my" onclick="goMyProfile()">👤 My Profile</button>
    <button class="btn logout" onclick="logout()">🚪 Logout</button>
  </div>
</header>

<div class="topbar">
  <button class="btn add" onclick="goAdd()">➕ रिश्ता जोड़ें</button>

  <button class="btn admin" id="adminPanelBtn" style="display:none" onclick="goAdmin()">
    👑 Admin Panel
  </button>

  <button class="btn admin" id="adminAddBtn" style="display:none" onclick="goAdminAdd()">
    ➕ Admin Add
  </button>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";
let isAdmin = false;

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(user){

    isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL;

    if(isAdmin){
      document.getElementById("adminPanelBtn").style.display="inline-block";
      document.getElementById("adminAddBtn").style.display="inline-block";
    }

    loadProfiles();

  }else{
    window.location = "index.html"; // FIXED
  }
});

/* LOAD DATA */
function loadProfiles(){

  db.ref("profiles").on("value",snap=>{

    let html="";

    snap.forEach(child=>{
      let d = child.val();

      html+=`
      <div class="card">

        <img src="${d.photo || 'https://via.placeholder.com/300'}" onclick="openModal('${child.key}')">

        <div class="card-body">
          <h3>${d.name}</h3>
          <p>${d.city}</p>

          <button class="btn like" onclick="goPayment()">💍 रिश्ता करें</button>

          ${isAdmin ? `
            <button class="btn edit" onclick="editProfile('${child.key}')">✏ Edit</button>
            <button class="btn delete" onclick="deleteProfile('${child.key}')">🗑 Delete</button>
          ` : ""}

        </div>
      </div>`;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* FUNCTIONS */
function goPayment(){ window.location="payment.html"; }
function goAdd(){ window.location="profile-submit.html"; }
function goAdmin(){ window.location="admin.html"; }
function goAdminAdd(){ window.location="admin-add.html"; }
function goMyProfile(){ window.location="my-profile.html"; }

function deleteProfile(id){
  if(confirm("Delete profile?")){
    db.ref("profiles/"+id).remove();
  }
}

function editProfile(id){
  window.location = "admin-add.html?id=" + id;
}

function openModal(id){
  db.ref("profiles/"+id).once("value").then(snap=>{
    let d = snap.val();

    document.getElementById("modalBody").innerHTML=`
      <h2>${d.name}</h2>
      <img src="${d.photo}" style="width:100%;border-radius:10px;">
      <p><b>Age:</b> ${d.age}</p>
      <p><b>City:</b> ${d.city}</p>
      <p>${d.bio || ""}</p>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>{
    alert("Logout Successfully");
    window.location="index.html";
  });
}

</script>

</body>
</html>
