<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:Segoe UI;
  background:#f4f6f9;
  margin:0;
}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
  cursor:pointer;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
}

.btn{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  margin:3px;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.premium{background:gold;color:black;}
.featured{background:orange;color:white;}
.iA{background:#16a34a;color:white;}
.iR{background:#dc2626;color:white;}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:400px;
}
</style>
</head>

<body>

<header>
  <h3>🔥 Admin Panel</h3>
  <button onclick="logout()">Logout</button>
</header>

<div class="grid" id="list"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain:"zara-muslim-nikah.firebaseapp.com",
  databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(!user || user.email !== ADMIN_EMAIL){
    location="index.html";
  } else {
    loadUsers();
  }
});

/* LOAD USERS */
function loadUsers(){
  db.ref("users").on("value",snap=>{
    const list = document.getElementById("list");
    list.innerHTML="";

    snap.forEach(child=>{
      const id = child.key;
      const d = child.val();

      // FIX: interest listener per card
      db.ref("interests/"+id).on("value",intSnap=>{

        const data = intSnap.val() || {};
        const status = data.status || "pending";

        let btn = "";

        if(status === "pending"){
          btn = `<button class="btn iA" onclick="event.stopPropagation(); setInterest('${id}','approved')">Approve Interest</button>`;
        }

        if(status === "approved"){
          btn = `<button class="btn iR" onclick="event.stopPropagation(); setInterest('${id}','rejected')">Reject Interest</button>`;
        }

        if(status === "rejected"){
          btn = "";
        }

        list.innerHTML += `
        <div class="card" onclick="openProfile('${id}')">

          <img src="${d.photo || 'https://via.placeholder.com/300'}">

          <h3>${d.name || ''}</h3>
          <p>${d.city || ''}</p>

          <div>
            <button class="btn approve" onclick="event.stopPropagation(); approveUser('${id}')">Approve</button>
            <button class="btn reject" onclick="event.stopPropagation(); deleteUser('${id}')">Delete</button>
            <button class="btn premium" onclick="event.stopPropagation(); premium('${id}')">Premium</button>
            <button class="btn featured" onclick="event.stopPropagation(); featured('${id}')">Featured</button>

            ${btn}
          </div>

        </div>`;
      });
    });
  });
}

/* OPEN PROFILE */
function openProfile(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d = snap.val();

    document.getElementById("modalBody").innerHTML = `
      <img src="${d.photo}" style="width:100%;border-radius:10px">
      <h2>${d.name}</h2>
      <p>Age: ${d.age || "-"}</p>
      <p>City: ${d.city || "-"}</p>
      <p>Phone: ${d.phone || "-"}</p>
      <p>Bio: ${d.bio || "-"}</p>
    `;

    document.getElementById("modal").style.display="flex";
  });
}

/* INTEREST UPDATE */
function setInterest(id,status){
  db.ref("interests/"+id).set({
    status:status,
    time:Date.now()
  });
}

/* USER ACTIONS */
function approveUser(id){
  db.ref("users/"+id+"/status").set("approved");
}

function deleteUser(id){
  if(confirm("Delete user?")){
    db.ref("users/"+id).remove();
  }
}

function premium(id){
  db.ref("users/"+id+"/premium").set(true);
}

function featured(id){
  db.ref("users/"+id+"/featured").set(true);
}

/* MODAL CLOSE */
function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location="index.html");
}

</script>

</body>
</html>
