<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Add</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  background:#f4f6f9;
  padding:20px;
}

.box{
  max-width:420px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:12px;
}

input,textarea,select,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  background:#0f766e;
  color:white;
  border:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h2>👑 Admin Add Profile</h2>

<button onclick="goBack()" style="background:#111">⬅ Back</button>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">
<input id="city" placeholder="City">
<input id="phone" placeholder="Phone">
<textarea id="bio" placeholder="Bio"></textarea>

<input type="file" id="file">

<button onclick="save()">Save</button>

</div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnxk2nFDG_M65Wc",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const db = firebase.database();

/* SAVE */
async function save(){

  let file = document.getElementById("file").files[0];

  let url = "";

  if(file){
    let form = new FormData();
    form.append("image", file);

    let res = await fetch("https://api.imgbb.com/1/upload?key=368731d88d58b4fa0bdd5abdd2c47f72",{
      method:"POST",
      body:form
    });

    let data = await res.json();
    url = data.data.url;
  }

  db.ref("users").push({
    name:document.getElementById("name").value,
    age:document.getElementById("age").value,
    city:document.getElementById("city").value,
    phone:document.getElementById("phone").value,
    bio:document.getElementById("bio").value,
    photo:url,
    status:"approved",
    time:Date.now()
  });

  alert("Saved!");
  window.location="admin.html";
}

/* BACK */
function goBack(){
  window.location="admin.html";
}

</script>

</body>
</html>
