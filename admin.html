<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:'Segoe UI',sans-serif;
  background:#f4f6f9;
  margin:0;
}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  text-align:center;
  font-size:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#home,#logout{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
#home{background:#1e40af;color:white;}
#logout{background:black;color:white;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  padding:10px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  text-align:center;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
}

.card-btn{
  margin:5px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.premium{background:gold;color:black;}
.featured{background:orange;color:white;}

.interest-approve{background:#16a34a;color:white;}
.interest-reject{background:#dc2626;color:white;}

.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:420px;
}
</style>
</head>

<body>

<header>
  <span>Admin Panel</span>
  <div>
    <button id="home" onclick="goHome()">🏠 Home</button>
    <button id="logout" onclick="logout()">Logout</button>
  </div>
</header>

<div class="grid" id="list"></div>

<div class="modal" id="profileModal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
function loadProfiles(){
  db.ref("users").on("value",snap=>{
    const list=document.getElementById("list");
    list.innerHTML="";

    snap.forEach(child=>{
      const userId = child.key;
      const d = child.val() || {};

      db.ref("interests/"+userId).once("value").then(intSnap=>{

        let interestBtn = "";

        if(intSnap.exists()){

          let hasApproved = false;
          let hasPending = false;

          intSnap.forEach(senderSnap=>{
            const data = senderSnap.val();

            if(data.status === "approved") hasApproved = true;
            if(!data.status || data.status === "pending") hasPending = true;
          });

          // ✔ IF ANY APPROVED → show REJECT
          if(hasApproved){
            interestBtn = `
              <button class="card-btn interest-reject"
              onclick="event.stopPropagation(); rejectInterest('${userId}')">
              ❌ Reject Interest
              </button>
            `;
          }

          // ✔ IF PENDING → show APPROVE
          else if(hasPending){
            interestBtn = `
              <button class="card-btn interest-approve"
              onclick="event.stopPropagation(); approveInterest('${userId}')">
              ❤️ Approve Interest
              </button>
            `;
          }
        }

        list.innerHTML += `
        <div class="card" onclick="openModal('${userId}')">

          <img src="${d.photo || 'https://via.placeholder.com/300'}">

          <h3>${d.name || ''}</h3>
          <p>${d.city || ''}</p>

          <div>
            <button class="card-btn approve" onclick="event.stopPropagation(); approve('${userId}')">Approve</button>
            <button class="card-btn reject" onclick="event.stopPropagation(); reject('${userId}')">Reject</button>
            <button class="card-btn premium" onclick="event.stopPropagation(); makePremium('${userId}')">Premium</button>
            <button class="card-btn featured" onclick="event.stopPropagation(); makeFeatured('${userId}')">Featured</button>

            ${interestBtn}
          </div>

        </div>`;
      });
    });
  });
}

/* APPROVE ALL SENDERS */
function approveInterest(profileId){
  db.ref("interests/"+profileId).once("value").then(snap=>{
    snap.forEach(s=>{
      db.ref("interests/"+profileId+"/"+s.key+"/status").set("approved");
    });
  });
}

/* REJECT ALL SENDERS */
function rejectInterest(profileId){
  db.ref("interests/"+profileId).once("value").then(snap=>{
    snap.forEach(s=>{
      db.ref("interests/"+profileId+"/"+s.key+"/status").set("rejected");
    });
  });
}
</script>

</body>
</html>
