<script>

firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user || user.email !== ADMIN_EMAIL){
    location="index.html";
  } else {
    loadProfiles();
  }
});

/* USERS (UNCHANGED UI) */
function loadProfiles(){
 db.ref("users").on("value",snap=>{
   const list=document.getElementById("list");
   list.innerHTML="";

   snap.forEach(child=>{
     const d=child.val();

     list.innerHTML+=`
     <div class="card" onclick="openModal('${child.key}')">
       <img src="${d.photo || 'https://via.placeholder.com/300'}">
       <h3>${d.name || ''}</h3>
       <p>${d.city || ''}</p>

       <div>
         <button class="card-btn approve" onclick="event.stopPropagation(); approve('${child.key}')">Approve</button>
         <button class="card-btn reject" onclick="event.stopPropagation(); reject('${child.key}')">Reject</button>
         <button class="card-btn premium" onclick="event.stopPropagation(); makePremium('${child.key}')">Premium</button>
         <button class="card-btn featured" onclick="event.stopPropagation(); makeFeatured('${child.key}')">Featured</button>

         ${getInterestButton(child.key)}
       </div>
     </div>`;
   });
 });
}

/* 🔥 FIXED INTEREST BUTTON LOGIC */
function getInterestButton(profileId){

  let html = "";

  db.ref("interests/"+profileId).on("value",snap=>{

    let data = snap.val();

    if(!data) return html = "";

    let keys = Object.keys(data);

    let foundPending = false;
    let foundApproved = false;

    keys.forEach(uid=>{
      let d = data[uid];
      if(!d || !d.status) return;

      if(d.status === "pending") foundPending = true;
      if(d.status === "approved") foundApproved = true;
    });

    if(foundPending){
      html = `
      <button class="card-btn approve"
      onclick="approveInterest('${profileId}')">
      ❤️ Approve Interest
      </button>`;
    }

    if(foundApproved){
      html = `
      <button class="card-btn reject"
      onclick="rejectInterest('${profileId}')">
      ❌ Reject Interest
      </button>`;
    }

  });

  return html;
}

/* APPROVE USER */
function approve(id){
  db.ref("users/"+id+"/status").set("approved");
}

/* REJECT USER */
function reject(id){
  db.ref("users/"+id).remove();
}

/* PREMIUM */
function makePremium(id){
  db.ref("users/"+id+"/premium").set(true);
}

/* FEATURED */
function makeFeatured(id){
  db.ref("users/"+id+"/featured").set(true);
}

/* 🔥 INTEREST APPROVE */
function approveInterest(profileId){

  db.ref("interests/"+profileId).once("value").then(snap=>{
    snap.forEach(user=>{
      db.ref("interests/"+profileId+"/"+user.key).update({
        status:"approved",
        time:Date.now()
      });
    });
  });

}

/* 🔥 INTEREST REJECT */
function rejectInterest(profileId){

  db.ref("interests/"+profileId).once("value").then(snap=>{
    snap.forEach(user=>{
      db.ref("interests/"+profileId+"/"+user.key).update({
        status:"rejected",
        time:Date.now()
      });
    });
  });

}

/* MODAL */
function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d=snap.val();

    document.getElementById("modalBody").innerHTML=`
      <img src="${d.photo}">
      <h2>${d.name}</h2>
      <p>${d.city}</p>
    `;

    document.getElementById("profileModal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("profileModal").style.display="none";
}

/* NAV */
function logout(){
  auth.signOut().then(()=>location="index.html");
}

function goHome(){
  location="index.html";
}

</script>
