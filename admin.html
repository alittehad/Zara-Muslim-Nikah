<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{font-family:'Segoe UI';background:#f4f6f9;margin:0;}

header{
  background:#0f766e;color:white;padding:15px;
  display:flex;justify-content:space-between;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;padding:20px;
}

.card{
  background:white;padding:10px;border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  cursor:pointer;
}

.card img{
  width:100%;height:200px;
  object-fit:cover;border-radius:10px;
}

button{
  margin:5px;padding:8px;border:none;
  border-radius:8px;cursor:pointer;font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.premium{background:gold;}
.featured{background:orange;color:white;}
.iA{background:#16a34a;color:white;}
.iR{background:#dc2626;color:white;}

.modal{
  display:none;
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:420px;
  max-height:90%;
  overflow-y:auto;
}
</style>
</head>

<body>

<header>
  <span>Admin Panel</span>

  <div>
    <button onclick="goHome()" style="margin-right:10px;">🏠 Home</button>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div class="grid" id="list"></div>

<div class="modal" id="profileModal" onclick="closeModal(event)">
  <div class="modal-content" id="modalBody"></div>
</div>

<script>

// Firebase config
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();
const ADMIN_EMAIL="ngogrant454@gmail.com";

/* LOGIN */
auth.onAuthStateChanged(user=>{
  if(!user || (user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
    location="index.html";
  } else {
    loadData();
  }
});

/* LOAD USERS */
function loadData(){
  db.ref("users").on("value",snap=>{

    const list=document.getElementById("list");
    list.innerHTML="";

    snap.forEach(child=>{
      const id=child.key;
      const d=child.val()||{};

      let approveBtn = (d.status==="approved")
        ? `<button class="reject" onclick="event.stopPropagation(); unapprove('${id}')">Reject</button>`
        : `<button class="approve" onclick="event.stopPropagation(); approve('${id}')">Approve</button>`;

      list.innerHTML+=`
      <div class="card" onclick="openModal('${id}')">

        <img src="${d.photo || 'https://via.placeholder.com/300'}">

        <h3>${d.name || 'No Name'}</h3>
        <p>${d.city || ''}</p>

        <div>
          ${approveBtn}
          <button class="reject" onclick="event.stopPropagation(); deleteUser('${id}')">Delete</button>
          <button class="premium" onclick="event.stopPropagation(); premium('${id}')">Premium</button>
          <button class="featured" onclick="event.stopPropagation(); featured('${id}')">Featured</button>
        </div>

      </div>`;
    });

  });
}

/* OPEN FULL PROFILE */
function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d=snap.val()||{};

    document.getElementById("modalBody").innerHTML=`
      <img src="${d.photo || 'https://via.placeholder.com/300'}" style="width:100%;border-radius:10px">

      <h2>${d.name || '-'}</h2>

      <p><b>Age:</b> ${d.age || '-'}</p>
      <p><b>City:</b> ${d.city || '-'}</p>
      <p><b>Gender:</b> ${d.gender || '-'}</p>
      <p><b>Education:</b> ${d.education || '-'}</p>
      <p><b>Profession:</b> ${d.profession || '-'}</p>
      <p><b>Phone:</b> ${d.phone || '-'}</p>
      <p><b>Bio:</b> ${d.bio || '-'}</p>

      <hr>

      <p><b>Status:</b> ${d.status || 'pending'}</p>
      <p><b>Premium:</b> ${d.premium ? 'Yes' : 'No'}</p>
      <p><b>Featured:</b> ${d.featured ? 'Yes' : 'No'}</p>
    `;

    document.getElementById("profileModal").style.display="flex";
  });
}

/* CLOSE MODAL */
function closeModal(e){
  if(e.target.id==="profileModal"){
    document.getElementById("profileModal").style.display="none";
  }
}

/* ACTIONS */
function approve(id){ db.ref("users/"+id+"/status").set("approved"); }
function unapprove(id){ db.ref("users/"+id+"/status").set("pending"); }

function deleteUser(id){
  if(confirm("Delete?")){
    db.ref("users/"+id).remove();
  }
}

function premium(id){ db.ref("users/"+id+"/premium").set(true); }
function featured(id){ db.ref("users/"+id+"/featured").set(true); }

function logout(){
  auth.signOut().then(()=>location="index.html");
}

</script>

</body>
</html>
