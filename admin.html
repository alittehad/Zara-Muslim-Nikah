<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  margin:0;
  background:#f4f6f9;
}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

header button{
  margin-left:8px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.addBtn{background:#16a34a;color:white;}
.homeBtn{background:#111;color:white;}
.logoutBtn{background:#dc2626;color:white;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  cursor:pointer;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}

button.action{
  width:100%;
  margin-top:5px;
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.delete{background:#111;color:white;}

.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:15px;
  border-radius:12px;
  width:90%;
  max-width:400px;
}
</style>
</head>

<body>

<header>
  <div><b>👑 Admin Dashboard</b></div>

  <div>
    <button class="addBtn" onclick="goAdd()">➕ Add</button>
    <button class="homeBtn" onclick="goHome()">🏠 Home</button>
    <button class="logoutBtn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-content" id="modalBody"></div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnxk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* LOGIN FIX */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
.then(() => {

  auth.onAuthStateChanged(user => {

    if(!user){
      window.location = "index.html";
      return;
    }

    if(user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
      alert("Admin only");
      auth.signOut();
      window.location = "index.html";
      return;
    }

    loadUsers();
  });

});

/* LOAD USERS */
function loadUsers(){
  db.ref("users").on("value", snap => {

    let html = "";

    snap.forEach(child => {

      let id = child.key;
      let d = child.val();

      html += `
      <div class="card" onclick="openUser('${id}')">
        <img src="${d.photo || 'https://via.placeholder.com/300'}">
        <h3>${d.name}</h3>
        <p>${d.city}</p>

        <button class="action approve" onclick="event.stopPropagation(); approve('${id}')">Approve</button>
        <button class="action reject" onclick="event.stopPropagation(); reject('${id}')">Reject</button>
        <button class="action delete" onclick="event.stopPropagation(); del('${id}')">Delete</button>
      </div>
      `;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* OPEN PROFILE */
function openUser(id){
  db.ref("users/"+id).once("value").then(snap => {
    let d = snap.val();

    document.getElementById("modalBody").innerHTML = `
      <img src="${d.photo}" style="width:100%;border-radius:10px">
      <h3>${d.name}</h3>
      <p>${d.age} | ${d.city}</p>
      <p>${d.phone}</p>
      <p>${d.bio}</p>
    `;

    document.getElementById("modal").style.display = "flex";
  });
}

function closeModal(e){
  if(e.target.id === "modal"){
    document.getElementById("modal").style.display = "none";
  }
}

/* ACTIONS */
function approve(id){
  db.ref("users/"+id+"/status").set("approved");
}

function reject(id){
  db.ref("users/"+id+"/status").set("pending");
}

function del(id){
  if(confirm("Delete user?")){
    db.ref("users/"+id).remove();
  }
}

/* NAV */
function goAdd(){
  window.location = "admin-add.html";
}

function goHome(){
  window.location = "index.html";
}

function logout(){
  auth.signOut().then(()=> {
    window.location = "index.html";
  });
}
</script>

</body>
</html>
