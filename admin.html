<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Interest Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f9;}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.card{
  background:white;
  padding:12px;
  margin:10px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

img{
  width:100%;
  max-height:200px;
  object-fit:cover;
  border-radius:10px;
}

.btn{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin:5px;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.wait{background:orange;color:white;}
</style>
</head>

<body>

<header>
  <h3>🔥 Interest Admin Panel</h3>
  <button onclick="logout()">Logout</button>
</header>

<div id="box"></div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user || user.email !== ADMIN_EMAIL){
    location="index.html";
  } else {
    loadData();
  }
});

function loadData(){

  db.ref("interests").on("value",snap=>{

    let html = "";

    snap.forEach(profileSnap=>{

      let profileId = profileSnap.key;

      let data = profileSnap.val();

      Object.keys(data).forEach(userId=>{

        let d = data[userId];

        // ❌ skip invalid keys
        if(!d || typeof d !== "object") return;

        let status = d.status || "pending";

        let btn = "";

        if(status === "pending" || status === "waiting_admin"){
          btn = `<button class="btn approve" onclick="update('${profileId}','${userId}','approved')">Approve Interest</button>`;
        }

        if(status === "approved"){
          btn = `<button class="btn reject" onclick="update('${profileId}','${userId}','rejected')">Reject Interest</button>`;
        }

        if(status === "rejected"){
          btn = "";
        }

        html += `
        <div class="card">

          <h4>Profile ID: ${profileId}</h4>
          <p>User ID: ${userId}</p>
          <p>Status: ${status}</p>

          ${d.time ? `<small>Time: ${new Date(d.time).toLocaleString()}</small><br>` : ""}

          ${btn}

        </div>
        `;
      });
    });

    document.getElementById("box").innerHTML = html;
  });
}

/* UPDATE */
function update(pid,uid,status){
  db.ref("interests/"+pid+"/"+uid).update({
    status:status,
    time:Date.now()
  });
}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location="index.html");
}

</script>

</body>
</html>
