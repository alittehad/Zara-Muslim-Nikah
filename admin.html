<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f9;}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.card{
  background:white;
  padding:12px;
  margin:10px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

img{
  width:100%;
  max-height:200px;
  object-fit:cover;
  border-radius:10px;
}

.btn{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  margin:3px;
  cursor:pointer;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
</style>
</head>

<body>

<header>
  <h3>🔥 Admin Dashboard</h3>
  <button onclick="logout()">Logout</button>
</header>

<div id="box"></div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user || user.email !== ADMIN_EMAIL){
    location="index.html";
  } else {
    loadData();
  }
});

/* 🔥 CLEAN + IMAGE + FULL DATA */
function loadData(){

  db.ref("interests").on("value",snap=>{

    let html="";

    snap.forEach(profile=>{

      const pid = profile.key;
      const users = profile.val();

      Object.keys(users || {}).forEach(uid=>{

        const d = users[uid];

        if(!d || typeof d !== "object") return;

        const status = d.status || "pending";

        let btn="";

        if(status === "pending"){
          btn = `<button class="btn approve"
          onclick="update('${pid}','${uid}','approved')">Approve</button>`;
        }

        if(status === "approved"){
          btn = `<button class="btn reject"
          onclick="update('${pid}','${uid}','rejected')">Reject</button>`;
        }

        if(status === "rejected") return;

        html += `
        <div class="card">

          <img src="${d.photo || 'https://via.placeholder.com/300'}">

          <h3>📌 Profile ID: ${pid}</h3>
          <p>👤 User ID: ${uid}</p>
          <p>📊 Status: ${status}</p>
          <p>⏰ Time: ${d.time || '-'}</p>

          ${btn}

        </div>
        `;
      });

    });

    document.getElementById("box").innerHTML = html;
  });
}

/* UPDATE STATUS */
function update(pid,uid,status){
  db.ref("interests/"+pid+"/"+uid).update({
    status:status,
    time:Date.now()
  });
}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location="index.html");
}

</script>

</body>
</html>
