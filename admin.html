<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:'Segoe UI',sans-serif;
  background:#f4f6f9;
  margin:0;
}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  text-align:center;
  font-size:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#home,#logout{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
#home{background:#1e40af;color:white;}
#logout{background:black;color:white;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  padding:10px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  text-align:center;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
}

.card-btn{
  margin:5px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.premium{background:gold;color:black;}
.featured{background:orange;color:white;}

.interest-approve{background:#16a34a;color:white;}
.interest-reject{background:#dc2626;color:white;}
</style>
</head>

<body>

<header>
  <span>Admin Panel</span>
  <div>
    <button id="home" onclick="goHome()">🏠 Home</button>
    <button id="logout" onclick="logout()">Logout</button>
  </div>
</header>

<div class="grid" id="list"></div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user){
    location="index.html";
  } else if(user.email !== ADMIN_EMAIL){
    alert("Access denied");
    location="index.html";
  } else {
    loadData();
  }
});

/* REAL TIME LOAD */
function loadData(){
  db.ref("interests").on("value",snap=>{
    renderCards(snap);
  });
}

/* RENDER */
function renderCards(interestsSnap){

  const list = document.getElementById("list");
  list.innerHTML = "";

  interestsSnap.forEach(profileSnap=>{

    const profileId = profileSnap.key;
    const users = profileSnap.val();

    // show all users under interest node
    Object.keys(users).forEach(userId=>{

      const data = users[userId];

      let btn = "";

      if(data.status === "pending" || !data.status){
        btn = `<button class="card-btn interest-approve"
        onclick="updateStatus('${profileId}','${userId}','approved')">
        ❤️ Approve Interest</button>`;
      }

      else if(data.status === "approved"){
        btn = `<button class="card-btn interest-reject"
        onclick="updateStatus('${profileId}','${userId}','rejected')">
        ❌ Reject Interest</button>`;
      }

      else if(data.status === "rejected"){
        btn = ""; // hide button
      }

      list.innerHTML += `
      <div class="card">

        <h3>Profile ID: ${profileId}</h3>
        <p>User ID: ${userId}</p>
        <p>Status: ${data.status || "pending"}</p>

        ${btn}

      </div>`;
    });
  });
}

/* UPDATE STATUS */
function updateStatus(profileId,userId,status){

  db.ref("interests/"+profileId+"/"+userId).update({
    status:status,
    time:Date.now()
  });

}

/* NAV */
function logout(){ auth.signOut().then(()=>location="index.html"); }
function goHome(){ location="index.html"; }

</script>

</body>
</html>
