<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f9;}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  padding:12px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}

.btn{
  padding:7px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin:4px;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.interestA{background:#16a34a;color:white;}
.interestR{background:#dc2626;color:white;}

.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:420px;
}
</style>
</head>

<body>

<header>
  <h3>🔥 Admin Panel</h3>
  <button onclick="logout()">Logout</button>
</header>

<div class="grid">

<!-- USERS -->
<div>
<h3>👤 Users</h3>
<div id="users"></div>
</div>

<!-- INTEREST -->
<div>
<h3>❤️ Interests</h3>
<div id="interests"></div>
</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user || user.email !== ADMIN_EMAIL){
    location="index.html";
  } else {
    loadUsers();
    loadInterests();
  }
});

/* USERS */
function loadUsers(){
  db.ref("users").on("value",snap=>{
    let html="";

    snap.forEach(s=>{
      let d=s.val();

      html+=`
      <div class="card">
        <h4>${d.name || ""}</h4>
        <p>${d.city || ""}</p>

        <button class="btn approve" onclick="approveUser('${s.key}')">Approve</button>
        <button class="btn reject" onclick="deleteUser('${s.key}')">Delete</button>
      </div>
      `;
    });

    document.getElementById("users").innerHTML=html;
  });
}

function approveUser(id){
  db.ref("users/"+id+"/status").set("approved");
}

function deleteUser(id){
  db.ref("users/"+id).remove();
}

/* INTEREST SYSTEM */
function loadInterests(){
  db.ref("interests").on("value",snap=>{
    let html="";

    snap.forEach(profile=>{

      let pid = profile.key;

      profile.forEach(user=>{

        let uid = user.key;
        let d = user.val();

        if(!d || !d.status) return;

        let btn="";

        // pending → approve
        if(d.status==="pending"){
          btn=`<button class="btn interestA" onclick="setInterest('${pid}','${uid}','approved')">Approve</button>`;
        }

        // approved → reject
        else if(d.status==="approved"){
          btn=`<button class="btn interestR" onclick="setInterest('${pid}','${uid}','rejected')">Reject</button>`;
        }

        html+=`
        <div class="card">
          <b>Profile:</b> ${pid}<br>
          <b>User:</b> ${uid}<br>
          <b>Status:</b> ${d.status}<br>
          ${btn}
        </div>
        `;
      });
    });

    document.getElementById("interests").innerHTML=html;
  });
}

function setInterest(pid,uid,status){
  db.ref("interests/"+pid+"/"+uid).update({
    status:status,
    time:Date.now()
  });
}

/* MODAL */
function openProfile(id){
  db.ref("users/"+id).once("value").then(s=>{
    let d=s.val();
    document.getElementById("modalBody").innerHTML=`
      <h3>${d.name}</h3>
      <p>${d.city}</p>
    `;
    document.getElementById("modal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location="index.html");
}

</script>

</body>
</html>
