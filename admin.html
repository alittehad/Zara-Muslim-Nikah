<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{font-family:Segoe UI;background:#f4f6f9;margin:0}
header{background:#0f766e;color:white;padding:15px;text-align:center;font-size:22px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
padding:10px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
transition:0.3s;
}
.card:hover{transform:translateY(-5px) rotateX(5deg)}

img{width:100%;height:200px;object-fit:cover;border-radius:10px}

button{
margin:5px;
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
box-shadow:0 4px 6px rgba(0,0,0,0.2);
transition:0.2s;
}
button:hover{transform:translateY(-2px) translateZ(2px); box-shadow:0 6px 10px rgba(0,0,0,0.3);}

.approve{background:green;color:white}
.reject{background:red;color:white}
.premium{background:gold;color:black}
.featured{background:orange;color:white}

#logout{
position:absolute;
top:10px;
right:10px;
background:black;
color:white;
}
</style>
</head>
<body>

<header>Admin Panel</header>
<button id="logout" onclick="logout()">Logout</button>

<div class="grid" id="list"></div>

<script>
// Firebase Config
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah",
  storageBucket: "zara-muslim-nikah.appspot.com",
  appId: "1:690336186269:web:8215c1d313c4273c1f7974"
});

const auth=firebase.auth();
const db=firebase.database();

const ADMIN_EMAIL="ngogrant454@gmail.com"; // ✅ Correct admin email

// LOGIN CHECK
auth.onAuthStateChanged(user=>{
 if(!user){
   alert("Login required");
   location="index.html";
 } else {
   const userEmail = (user.email || "").toLowerCase().trim();
   if(userEmail !== ADMIN_EMAIL.toLowerCase().trim()){
     alert("Access denied (Not admin)");
     location="index.html";
   } else {
     loadProfiles();
   }
 }
});

// LOAD PROFILES
function loadProfiles(){
 db.ref("users").on("value",snap=>{
   const list=document.getElementById("list");
   list.innerHTML="";

   let found=false;

   snap.forEach(child=>{
     const d=child.val();

     if(d.status==="pending"){
       found=true;
       list.innerHTML+=`
       <div class="card">
         <img src="${d.photo}" onerror="this.src='https://via.placeholder.com/300'">
         <h3>${d.name}</h3>
         <p>${d.city}</p>

         <button class="approve" onclick="approve('${child.key}')">✅ Approve</button>
         <button class="reject" onclick="reject('${child.key}')">❌ Reject</button>
         <button class="premium" onclick="makePremium('${child.key}')">⭐ Premium</button>
         <button class="featured" onclick="makeFeatured('${child.key}')">🔥 Featured</button>
       </div>`;
     }
   });

   if(!found){
     list.innerHTML="<h3 style='text-align:center'>No Pending Profiles</h3>";
   }
 });
}

// APPROVE
function approve(id){
 db.ref("users/"+id+"/status").set("approved");
}

// REJECT
function reject(id){
 if(confirm("Delete profile?")){
   db.ref("users/"+id).remove();
 }
}

// PREMIUM
function makePremium(id){
 db.ref("users/"+id+"/premium").set(true);
 alert("Marked as Premium");
}

// FEATURED
function makeFeatured(id){
 db.ref("users/"+id+"/featured").set(true);
 alert("Marked as Featured");
}

// LOGOUT
function logout(){
 auth.signOut().then(()=>{ location="index.html"; });
}
</script>

</body>
</html>
