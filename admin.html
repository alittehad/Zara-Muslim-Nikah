<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family: 'Segoe UI', sans-serif;
  background:#f4f6f9;
  margin:0;
}

/* HEADER */
header{
  background:#0f766e;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  padding:10px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
}

/* BUTTONS */
button.card-btn{
  margin:5px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.premium{background:gold;color:black;}
.featured{background:orange;color:white;}
.iA{background:#16a34a;color:white;}
.iR{background:#dc2626;color:white;}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:420px;
  position:relative;
}
</style>
</head>

<body>

<header>
  <span>Admin Panel</span>
  <button onclick="logout()">Logout</button>
</header>

<div class="grid" id="list"></div>

<!-- MODAL -->
<div class="modal" id="profileModal" onclick="closeModal(event)">
  <div class="modal-content">
    <div id="modalBody"></div>
  </div>
</div>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain:"zara-muslim-nikah.firebaseapp.com",
  databaseURL:"https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user || user.email !== ADMIN_EMAIL){
    location="index.html";
  } else {
    loadProfiles();
  }
});

/* LOAD USERS */
function loadProfiles(){
  db.ref("users").on("value",snap=>{
    const list = document.getElementById("list");
    list.innerHTML = "";

    snap.forEach(child=>{
      const id = child.key;
      const d = child.val() || {};

      db.ref("interests/"+id).once("value").then(intSnap=>{

        const intData = intSnap.val() || {};
        const status = intData.status || "pending";

        let interestBtn = "";

        if(status === "pending"){
          interestBtn = `<button class="card-btn iA" onclick="event.stopPropagation(); setInterest('${id}','approved')">Approve Interest</button>`;
        }

        if(status === "approved"){
          interestBtn = `<button class="card-btn iR" onclick="event.stopPropagation(); setInterest('${id}','rejected')">Reject Interest</button>`;
        }

        list.innerHTML += `
        <div class="card" onclick="openModal('${id}')">

          <img src="${d.photo || 'https://via.placeholder.com/300'}">

          <h3>${d.name || 'No Name'}</h3>
          <p>${d.city || ''}</p>

          <div>
            <button class="card-btn approve" onclick="event.stopPropagation(); approve('${id}')">Approve</button>
            <button class="card-btn reject" onclick="event.stopPropagation(); reject('${id}')">Reject</button>
            <button class="card-btn premium" onclick="event.stopPropagation(); premium('${id}')">Premium</button>
            <button class="card-btn featured" onclick="event.stopPropagation(); featured('${id}')">Featured</button>

            ${interestBtn}
          </div>

        </div>`;
      });
    });
  });
}

/* MODAL OPEN */
function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d = snap.val() || {};

    document.getElementById("modalBody").innerHTML = `
      <img src="${d.photo || ''}" style="width:100%;border-radius:10px">
      <h2>${d.name || ''}</h2>
      <p>Age: ${d.age || '-'}</p>
      <p>City: ${d.city || '-'}</p>
      <p>Gender: ${d.gender || '-'}</p>
      <p>Phone: ${d.phone || '-'}</p>
      <p>Bio: ${d.bio || '-'}</p>
      <p>Status: ${d.status || 'pending'}</p>
    `;

    document.getElementById("profileModal").style.display="flex";
  });
}

/* INTEREST SYSTEM */
function setInterest(profileId,status){
  db.ref("interests/"+profileId).set({
    status:status,
    time:Date.now()
  });
}

/* USER ACTIONS */
function approve(id){
  db.ref("users/"+id+"/status").set("approved");
}

function reject(id){
  if(confirm("Delete profile?")){
    db.ref("users/"+id).remove();
  }
}

function premium(id){
  db.ref("users/"+id+"/premium").set(true);
}

function featured(id){
  db.ref("users/"+id+"/featured").set(true);
}

/* CLOSE MODAL */
function closeModal(e){
  if(!e || e.target.id==="profileModal"){
    document.getElementById("profileModal").style.display="none";
  }
}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location="index.html");
}

</script>

</body>
</html>
