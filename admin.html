<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:'Segoe UI',sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:0;
}

/* Header */
header{
  background:#0f766e;
  color:white;
  padding:15px;
  text-align:center;
  font-size:22px;
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* Buttons */
#home,#logout{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
#home{background:#1e40af;color:white;}
#logout{background:black;color:white;}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

/* Card */
.card{
  background:white;
  padding:10px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}
.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
}

/* Buttons */
.card-btn{
  margin:5px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.premium{background:gold;color:black;}
.featured{background:orange;color:white;}
.interest{background:#e11d48;color:white;}

/* Modal */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}
.modal-content{
  background:white;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:400px;
}
.close-btn{
  float:right;
  cursor:pointer;
  font-size:20px;
}
</style>
</head>

<body>

<header>
  <span>Admin Panel</span>
  <div>
    <button id="home" onclick="goHome()">🏠 Home</button>
    <button id="logout" onclick="logout()">Logout</button>
  </div>
</header>

<div class="grid" id="list"></div>

<!-- Modal -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">×</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// Firebase
firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    location="index.html";
  } else {
    if((user.email||"").toLowerCase()!==ADMIN_EMAIL){
      alert("Access denied");
      location="index.html";
    } else {
      loadProfiles();
    }
  }
});

/* LOAD USERS */
function loadProfiles(){
  db.ref("users").on("value",snap=>{
    const list=document.getElementById("list");
    list.innerHTML="";

    snap.forEach(child=>{
      const d=child.val();

      list.innerHTML+=`
      <div class="card" onclick="openModal('${child.key}')">
        <img src="${d.photo}" onerror="this.src='https://via.placeholder.com/300'">
        <h3>${d.name}</h3>
        <p>${d.city}</p>

        <div>
          <button class="card-btn approve" onclick="event.stopPropagation(); approve('${child.key}')">Approve</button>
          <button class="card-btn reject" onclick="event.stopPropagation(); reject('${child.key}')">Reject</button>
          <button class="card-btn premium" onclick="event.stopPropagation(); makePremium('${child.key}')">Premium</button>
          <button class="card-btn featured" onclick="event.stopPropagation(); makeFeatured('${child.key}')">Featured</button>

          <!-- ❤️ INTEREST BUTTON (NEW FIX) -->
          <button class="card-btn interest"
            onclick="event.stopPropagation(); approveInterest('${child.key}','${child.key}')">
            ❤️ Approve Interest
          </button>
        </div>
      </div>`;
    });
  });
}

/* ACTIONS */
function approve(id){ db.ref("users/"+id+"/status").set("approved"); }
function reject(id){ if(confirm("Delete?")) db.ref("users/"+id).remove(); }
function makePremium(id){ db.ref("users/"+id+"/premium").set(true); }
function makeFeatured(id){ db.ref("users/"+id+"/featured").set(true); }

/* ❤️ INTEREST SYSTEM FIXED */
function approveInterest(profileId, userId){
  db.ref("interests/"+profileId+"/"+userId).set({
    status:"approved",
    time:Date.now()
  });
  alert("❤️ Interest Approved");
}

/* MODAL */
function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d=snap.val();
    document.getElementById("modalBody").innerHTML=`
      <img src="${d.photo}" style="width:100%">
      <h2>${d.name}</h2>
      <p>${d.city}</p>
      <p>${d.phone||""}</p>
    `;
    document.getElementById("profileModal").style.display="flex";
  });
}
function closeModal(){ document.getElementById("profileModal").style.display="none"; }

/* NAV */
function logout(){ auth.signOut().then(()=>location="index.html"); }
function goHome(){ location="index.html"; }

</script>

</body>
</html>
