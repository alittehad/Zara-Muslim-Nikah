<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:sans-serif;
  margin:0;
  background:#f4f6f9;
}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header button{
  margin-left:8px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.addBtn{background:#16a34a;color:white;}
.homeBtn{background:#111;color:white;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  padding:10px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}

button.action{
  width:100%;
  margin-top:5px;
  padding:8px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.delete{background:#111;color:white;}
</style>
</head>

<body>

<header>
  <div>👑 Admin Dashboard (No Login)</div>

  <div>
    <button class="addBtn" onclick="goAdd()">➕ Add</button>
    <button class="homeBtn" onclick="goHome()">🏠 Home</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnxk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com"
});

const db = firebase.database();

/* LOAD USERS */
function loadUsers(){
  db.ref("users").on("value", snap => {

    let html = "";

    snap.forEach(child => {

      let id = child.key;
      let d = child.val();

      html += `
      <div class="card">
        <img src="${d.photo || 'https://via.placeholder.com/300'}">
        <h3>${d.name || '-'}</h3>
        <p>${d.city || '-'}</p>

        <button class="action approve" onclick="approve('${id}')">Approve</button>
        <button class="action reject" onclick="reject('${id}')">Reject</button>
        <button class="action delete" onclick="del('${id}')">Delete</button>
      </div>
      `;
    });

    document.getElementById("grid").innerHTML = html;
  });
}

/* ACTIONS */
function approve(id){
  db.ref("users/"+id+"/status").set("approved");
}

function reject(id){
  db.ref("users/"+id+"/status").set("pending");
}

function del(id){
  if(confirm("Delete user?")){
    db.ref("users/"+id).remove();
  }
}

/* NAV */
function goAdd(){
  window.location = "admin-add.html";
}

function goHome(){
  window.location = "index.html";
}

/* START */
loadUsers();

</script>

</body>
</html>
