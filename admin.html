<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:'Segoe UI',sans-serif;
  background:#f4f6f9;
  margin:0;
}

header{
  background:#0f766e;
  color:white;
  padding:15px;
  text-align:center;
  font-size:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#home,#logout{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
#home{background:#1e40af;color:white;}
#logout{background:black;color:white;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  padding:10px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  text-align:center;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
}

.card-btn{
  margin:5px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}
.premium{background:gold;color:black;}
.featured{background:orange;color:white;}
.interest{background:#e11d48;color:white;}

.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:420px;
}
</style>
</head>

<body>

<header>
  <span>Admin Panel</span>
  <div>
    <button id="home" onclick="goHome()">🏠 Home</button>
    <button id="logout" onclick="logout()">Logout</button>
  </div>
</header>

<div class="grid" id="list"></div>

<!-- MODAL -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer;font-size:20px;">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyAhrYtSAdorLMYgBIPeEnXk2nFDG_M65Wc",
  authDomain: "zara-muslim-nikah.firebaseapp.com",
  databaseURL: "https://zara-muslim-nikah-default-rtdb.firebaseio.com",
  projectId: "zara-muslim-nikah"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "ngogrant454@gmail.com";

/* LOGIN CHECK */
auth.onAuthStateChanged(user=>{
  if(!user){
    location="index.html";
  } else if((user.email||"").toLowerCase()!==ADMIN_EMAIL){
    alert("Access denied");
    location="index.html";
  } else {
    loadProfiles();
  }
});

/* LOAD PROFILES */
function loadProfiles(){
  db.ref("users").on("value",snap=>{
    const list=document.getElementById("list");
    list.innerHTML="";

    snap.forEach(child=>{
      const d=child.val();

      // check interest
      db.ref("interests/"+child.key).once("value").then(intSnap=>{

        let interestBtn = "";

        if(intSnap.exists()){
          interestBtn = `
            <button class="card-btn interest"
              onclick="event.stopPropagation(); approveInterest('${child.key}')">
              ❤️ Approve Interest
            </button>
          `;
        }

        list.innerHTML+=`
        <div class="card" onclick="openModal('${child.key}')">

          <img src="${d.photo}" onerror="this.src='https://via.placeholder.com/300'">

          <h3>${d.name}</h3>
          <p>${d.city}</p>

          <div>
            <button class="card-btn approve" onclick="event.stopPropagation(); approve('${child.key}')">Approve</button>
            <button class="card-btn reject" onclick="event.stopPropagation(); reject('${child.key}')">Reject</button>
            <button class="card-btn premium" onclick="event.stopPropagation(); makePremium('${child.key}')">Premium</button>
            <button class="card-btn featured" onclick="event.stopPropagation(); makeFeatured('${child.key}')">Featured</button>

            ${interestBtn}
          </div>

        </div>`;
      });
    });
  });
}

/* ACTIONS */
function approve(id){ db.ref("users/"+id+"/status").set("approved"); }
function reject(id){ db.ref("users/"+id).remove(); }
function makePremium(id){ db.ref("users/"+id+"/premium").set(true); }
function makeFeatured(id){ db.ref("users/"+id+"/featured").set(true); }

/* INTEREST APPROVE */
function approveInterest(profileId){
  db.ref("interests/"+profileId).once("value").then(snap=>{
    snap.forEach(u=>{
      db.ref("interests/"+profileId+"/"+u.key+"/status").set("approved");
    });
  });

  alert("❤️ Interest Approved");
}

/* FULL PROFILE */
function openModal(id){
  db.ref("users/"+id).once("value").then(snap=>{
    const d=snap.val();

    document.getElementById("modalBody").innerHTML=`
      <img src="${d.photo}" style="width:100%;border-radius:10px">
      <h2>${d.name}</h2>
      <p><b>Age:</b> ${d.age||"-"}</p>
      <p><b>City:</b> ${d.city||"-"}</p>
      <p><b>Gender:</b> ${d.gender||"-"}</p>
      <p><b>Education:</b> ${d.education||"-"}</p>
      <p><b>Profession:</b> ${d.profession||"-"}</p>
      <p><b>Phone:</b> ${d.phone||"-"}</p>
      <p><b>Bio:</b> ${d.bio||"-"}</p>
    `;

    document.getElementById("profileModal").style.display="flex";
  });
}

function closeModal(){
  document.getElementById("profileModal").style.display="none";
}

/* NAV */
function logout(){ auth.signOut().then(()=>location="index.html"); }
function goHome(){ location="index.html"; }

</script>

</body>
</html>
